function buscar(q){
  const s = sinTildes(q.trim()), res = $('#bus-res');
  if (s.length < 2){
    res.innerHTML = `<div class="bus-sug"><small>Probá con</small>${['OR-2026-0142', ejemploProd('T40', 'Hélices').cod, 'Estancia', '1581F', 'Agras T100', 'A-48'].map(x => `<button onclick="$('#bus-q').value='${x}';buscar('${x}')">${x}</button>`).join('')}</div>`;
    return;
  }
  const has = (...v) => v.some(x => sinTildes(x).includes(s));
  const g = [];
  const ords = D().ordenes.filter(o => has(o.num, o.chasis, nomCli(o.cli), modeloTxt(o.modelo), o.sintoma)).slice(0, 6);
  if (ords.length) g.push(['Órdenes de reparación', ords.map(o => [ 'llave', `${o.num} · ${modeloTxt(o.modelo)}`, `${nomCli(o.cli)} · ${ESTADOS_ORDEN[o.estado].t}`, `fichaOrden('${o.id}')`])]);
  const drs = D().drones.filter(x => has(x.chasis)).slice(0, 4);
  if (drs.length) g.push(['Drones', drs.map(x => ['dron', x.chasis, `${modeloTxt(x.modelo)} · ${nomCli(x.cli)}`, `ir('clientes')`])]);
  const cls = D().clientes.filter(c => has(c.nombre, c.fantasia || '', c.doc, c.contacto)).slice(0, 5);
  if (cls.length) g.push(['Clientes', cls.map(c => ['clientes', c.nombre, datosCli(c), `abrirCliente('${c.id}')`])]);
  const prs = D().productos.filter(p => has(p.cod, p.nombre, p.cat)).slice(0, 6);
  if (prs.length) g.push(['Repuestos y productos', prs.map(p => ['caja', `${p.cod} · ${p.nombre}`, `${usd(p.precio)} · ${p.stock} disponible${p.stock === 1 ? '' : 's'} · ${p.ubic}`, `mostrarProductoEscaneado('${p.cod}')`])]);
  const bts = D().baterias.filter(b => has(b.num, b.serie, nomCli(b.cli))).slice(0, 4);
  if (bts.length) g.push(['Baterías', bts.map(b => ['bateria', `${b.num} · ${b.serie}`, `${b.disp} · ${ESTADOS_BATERIA[b.estado].t}`, `ir('baterias')`])]);
  if (esJefe()){
    const fs = D().facturas.filter(f => has(f.num, nomCli(f.cli))).slice(0, 4);
    if (fs.length) g.push(['Facturas', fs.map(f => ['factura', `${f.num} · ${nomCli(f.cli)}`, `${usd(f.total)} · ${estadoFactura(f).t}`, `ir('facturacion')`])]);
  }
  const ps = D().presupuestos.filter(p => has(p.num)).slice(0, 3); if (ps.length) g.push(['Presupuestos', ps.map(p => ['presupuesto', p.num, nomCli(p.cli), `ir('presupuestos')`])]);
  const vs = D().ventas.filter(v => has(v.num)).slice(0, 3); if (vs.length) g.push(['Ventas', vs.map(v => ['carrito', v.num, `${nomCli(v.cli)} · ${usd(totalVenta(v))}`, `ir('ventas')`])]);
  const pd = D().pedidos.filter(p => has(p.num)).slice(0, 3); if (pd.length) g.push(['Pedidos a Dragur', pd.map(p => ['camion', p.num, `${p.lineas.length} productos`, `ir('pedidos')`])]);
  res.innerHTML = g.length ? g.map(([t, items]) => `<div class="bus-g"><small>${t}</small>${items.map(([i, a, b, fn]) => `<button class="bus-it" onclick="cerrarBusqueda();${fn}">${ico(i)}<span><b>${resaltar(a, q)}</b><small>${esc(b)}</small></span>${ico('der', 'chico')}</button>`).join('')}</div>`).join('')
    : `<div class="bus-nada">${ico('buscar', 'grande')}<p>No encontramos nada con «${esc(q)}».</p></div>`;
  const primero = res.querySelector('.bus-it'); if (primero) primero.classList.add('sel');
}
function resaltar(t, q){ const i = sinTildes(t).indexOf(sinTildes(q.trim())); return i < 0 ? esc(t) : esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + q.trim().length)) + '</mark>' + esc(t.slice(i + q.trim().length)); }
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); if ($('#busqueda').classList.contains('hidden')) abrirBusqueda(); else cerrarBusqueda(); return; }
  if ($('#busqueda').classList.contains('hidden')) return;
  const its = $$('.bus-it'), i = its.findIndex(x => x.classList.contains('sel'));
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); if (!its.length) return; its.forEach(x => x.classList.remove('sel')); const n = its[(i + (e.key === 'ArrowDown' ? 1 : -1) + its.length) % its.length]; n.classList.add('sel'); n.scrollIntoView({ block:'nearest' }); }
  if (e.key === 'Enter' && i >= 0){ e.preventDefault(); its[i].click(); }
});
$('#bus-q').addEventListener('input', e => buscar(e.target.value));
$('#busqueda').addEventListener('mousedown', e => { if (e.target.id === 'busqueda') cerrarBusqueda(); });

/* ===== js/09-escaner.js ===== */
/* =====================================================================
   ESCÁNER (como de app profesional): marco en la cámara, sonido corto y
   vibración del celular al leer un código de barras o QR.
   Sabe qué escaneó: un repuesto (precio final, disponible y ubicación)
   o el QR de un dron o de una batería (abre su orden o su ficha).
   Usa el lector del navegador (BarcodeDetector) cuando existe; si no hay
   cámara o lector, se escribe el código o se prueba con los ejemplos.
   ===================================================================== */
const ESC = { stream:null, timer:null, detector:null, captura:null };
// N° de serie o de chasis dentro de lo que trae un QR (puede venir solo el número, varios datos o un link)
const serieDe = txt => (String(txt || '').split(/[\s;,|/?&=#:]+/).filter(x => /^[A-Za-z0-9-]{5,30}$/.test(x)).sort((a, c) => c.length - a.length)[0] || String(txt || '').trim()).toUpperCase();
/* captura: { titulo, sub, ejemplos, alLeer(txt) } → el escáner lee un código y se lo pasa a quien lo abrió
   (la recepción de un dron o de una batería). Sin captura, muestra qué es lo que se escaneó. */
function abrirEscaner(captura){
  cerrarCampana(); cerrarMenuYo();
  ESC.captura = captura && captura.alLeer ? captura : null;
  const crit = stockBajo().find(p => estadoStock(p).k === 'critico');
  const ejemplos = [[ejemploProd('T40', 'Hélices').cod, 'Hélice T40'], [ejemploProd('T100', 'Motores').cod, 'Motor T100'], [(crit || ejemploProd('T50', 'Pulverización')).cod, crit ? 'Uno en stock crítico' : 'Repuesto T50'], [D().ordenes.find(o => o.estado === 'reparacion').chasis, 'QR de un dron'], [D().baterias[0].serie, 'QR de una batería'], ['8WWMKN4N', 'Batería T100 nueva']];
  const ej = ESC.captura ? (ESC.captura.ejemplos || []) : ejemplos;
  abrirModal({ titulo:ESC.captura ? ESC.captura.titulo : 'Escanear', sub:ESC.captura ? ESC.captura.sub : 'Código de barras de un repuesto o QR de un dron o una batería', ancho:'modal-escaner',
    cuerpo:`<div class="esc-visor" id="esc-visor">
        <video id="esc-video" playsinline muted></video>
        <div class="esc-sin" id="esc-sin">${ico('camara', 'grande')}<span>Buscando la cámara…</span></div>
        <div class="esc-marco"><i></i><i></i><i></i><i></i><b class="esc-laser"></b></div>
        <div class="esc-pista">Apuntá al código: se lee solo</div>
        <div class="esc-ctrl" id="esc-ctrl"></div>
      </div>
      <label class="btn btn-linea esc-sacar">${ico('camara')} Sacar una foto del código<input type="file" accept="image/*" capture="environment" onchange="escFoto(this)" hidden></label>
      <div class="esc-manual"><div class="campo"><label>¿No se puede escanear? Escribí el código o el nombre</label>
        <div class="esc-in"><input id="esc-q" placeholder="${ESC.captura ? 'Ej.: 8WWMKN4N' : 'Ej.: T50P044'}" autocomplete="off"><button class="btn btn-prim" onclick="leerCodigo($('#esc-q').value)">Buscar</button></div></div>
        <div class="esc-ej"><small>Probar con:</small>${ej.map(([c, t]) => `<button onclick="leerCodigo('${c}')">${t}</button>`).join('')}</div></div>
      <div id="esc-res"></div>`,
    alAbrir:() => { $('#esc-q').onkeydown = e => { if (e.key === 'Enter') leerCodigo(e.target.value); }; prenderCamara(); },
    alCerrar:() => { apagarCamara(); ESC.captura = null; } });
}
/* La cámara lee sola los códigos de barras y QR:
   1) con el lector del navegador (BarcodeDetector) si existe y sabe leer CODE 128 (Chrome en Android y Mac);
   2) si no (Windows, iPhone, Firefox…), con ZXing, que se carga solo la primera vez.
   No se analiza la imagen entera achicada: se recorta el centro (donde está el recuadro) a resolución completa,
   alternando una franja ancha (códigos de barras) y un cuadrado (QR), y se le pide al lector que se esfuerce.
   Si la cámara en vivo no lo enfoca (pasa con etiquetas chicas), «Sacar una foto» usa la cámara del celular,
   que enfoca mucho mejor. Sigue leyendo: después de cada lectura espera un momento y queda lista para el próximo.
   ⚠ ZXing trabaja en un «trabajador» aparte (Web Worker): si lee en la página misma la frena un instante en cada
   intento y la animación de la ficha del artículo se tranca. Si el trabajador no arranca, lee en la página. */
const ZXING = 'https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js';
const ZXING_NUCLEO = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
const FORMATOS_ZX = ['CODE_128', 'QR_CODE', 'EAN_13', 'EAN_8', 'CODE_39', 'UPC_A', 'UPC_E', 'ITF', 'DATA_MATRIX'];
function crearTrabajador(){
  const codigo = `importScripts('${ZXING_NUCLEO}');
    const Z = self.ZXing, pistas = new Map();
    pistas.set(Z.DecodeHintType.POSSIBLE_FORMATS, ${JSON.stringify(FORMATOS_ZX)}.map(x => Z.BarcodeFormat[x]).filter(x => x !== undefined));
    pistas.set(Z.DecodeHintType.TRY_HARDER, true);
    const lector = new Z.MultiFormatReader(); lector.setHints(pistas);
    postMessage({ listo:true });
    onmessage = e => {
      const { id, w, h, px } = e.data, gris = new Uint8ClampedArray(w * h);
      for (let i = 0, j = 0; i < gris.length; i++, j += 4) gris[i] = (px[j] * 77 + px[j + 1] * 150 + px[j + 2] * 29) >> 8;
      let txt = null;
      try { txt = lector.decodeWithState(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.RGBLuminanceSource(gris, w, h)))).getText(); } catch (er) {}
      lector.reset(); postMessage({ id, txt });
    };`;
  return new Promise(ok => {
    let w; try { w = new Worker(URL.createObjectURL(new Blob([codigo], { type:'text/javascript' }))); } catch (e){ return ok(null); }
    const fin = setTimeout(() => { w.terminate(); ok(null); }, 15000);
    w.onerror = () => { clearTimeout(fin); w.terminate(); ok(null); };
    w.onmessage = e => { if (!e.data.listo) return; clearTimeout(fin); ESC.esperan = {}; ESC.nId = 0;
      w.onmessage = m => { const r = ESC.esperan[m.data.id]; delete ESC.esperan[m.data.id]; if (r) r(m.data.txt); };
      ok(w); };
  });
}
async function prepararLector(){
  if (ESC.detector || ESC.trab || ESC.zx) return;
  if (ESC.preparando) return ESC.preparando;
  ESC.preparando = (async () => {
    let formatos = [];
    if ('BarcodeDetector' in window){ try { formatos = await BarcodeDetector.getSupportedFormats(); } catch (e) {} }
    if (formatos.includes('code_128')){ ESC.detector = new BarcodeDetector({ formats:FORMATOS_ZX.map(x => x.toLowerCase()).filter(x => formatos.includes(x)) }); return; }
    ESC.trab = await crearTrabajador(); if (ESC.trab) return;
    await new Promise((ok, mal) => { if (window.ZXingBrowser) return ok(); const s = document.createElement('script'); s.src = ZXING; s.onload = ok; s.onerror = mal; document.head.appendChild(s); });
    const F = ZXingBrowser.BarcodeFormat, pistas = new Map();
    pistas.set(2, FORMATOS_ZX.map(x => F[x]).filter(x => x !== undefined)); // 2 = formatos posibles
    pistas.set(3, true);                                                   // 3 = esforzarse más
    ESC.zx = new ZXingBrowser.BrowserMultiFormatReader(pistas);
  })();
  try { await ESC.preparando; } finally { ESC.preparando = null; }
}
// Lee un canvas: devuelve el texto o null
async function decodificar(c){
  if (ESC.detector){ try { const r = await ESC.detector.detect(c); return r.length ? r[0].rawValue : null; } catch (e){ return null; } }
  if (ESC.trab){
    const d = c.getContext('2d', { willReadFrequently:true }).getImageData(0, 0, c.width, c.height), id = ++ESC.nId;
    return new Promise(ok => { const t = setTimeout(() => { delete ESC.esperan[id]; ok(null); }, 4000); ESC.esperan[id] = txt => { clearTimeout(t); ok(txt); };
      ESC.trab.postMessage({ id, w:c.width, h:c.height, px:d.data }, [d.data.buffer]); });
  }
  try { return ESC.zx.decodeFromCanvas(c).getText(); } catch (e){ return null; }
}
// Lo que lee la cámara: el mismo código que ya está en pantalla no se vuelve a dibujar (si no, la ficha salta cada tanto)
function leidoCamara(txt){
  const ahora = Date.now(); if (!txt || ahora < ESC.pausa) return;
  if (txt === ESC.ultimo && $('#esc-res') && $('#esc-res').firstElementChild) return;
  ESC.ultimo = txt; ESC.pausa = ahora + 1500; leerCodigo(txt);
}
async function prenderCamara(){
  const sin = $('#esc-sin'), pista = $('.esc-pista');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ sin.innerHTML = `${ico('camara', 'grande')}<span>Este navegador no deja usar la cámara en vivo. Usá «Sacar una foto del código» o escribilo abajo.</span>`; return; }
  try {
    ESC.stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1920 }, height:{ ideal:1080 } }, audio:false });
    const v = $('#esc-video'); if (!v){ apagarCamara(); return; }
    v.srcObject = ESC.stream; v.setAttribute('playsinline', ''); await v.play();
    sin.classList.add('hidden'); $('#esc-visor').classList.add('con-video');
    const t = ESC.stream.getVideoTracks()[0]; ESC.cap = {};
    try { ESC.cap = t.getCapabilities ? t.getCapabilities() : {}; if ((ESC.cap.focusMode || []).includes('continuous')) await t.applyConstraints({ advanced:[{ focusMode:'continuous' }] }); } catch (e) {}
    $('#esc-ctrl').innerHTML = (ESC.cap.torch ? `<button type="button" onclick="escLuz(this)" title="Linterna">${ico('sol')}</button>` : '') + (ESC.cap.zoom && ESC.cap.zoom.max >= 2 ? `<button type="button" onclick="escZoom(this)" title="Acercar">2×</button>` : '');
    ESC.ultimo = ''; ESC.pausa = 0; ESC.vuelta = 0;
    pista.textContent = 'Preparando el lector…';
    await prepararLector(); if (!ESC.stream) return;
    pista.textContent = 'Poné el código dentro del recuadro, a un palmo';
    const c = document.createElement('canvas'), ctx = c.getContext('2d', { willReadFrequently:true });
    const paso = async () => {
      if (!ESC.stream) return;
      const W = v.videoWidth, H = v.videoHeight;
      if (W && H && Date.now() >= ESC.pausa){   // mientras aparece la ficha no se analiza nada: la animación queda suave
        const ancha = ESC.vuelta++ % 2 === 0, sw = Math.round(ancha ? W * .9 : Math.min(W, H) * .8), sh = Math.round(ancha ? H * .45 : sw);
        const k = Math.min(1, 1280 / sw);   // más chico = cada intento es más rápido (el código igual queda con varios píxeles por barra)
        c.width = Math.round(sw * k); c.height = Math.round(sh * k); ctx.drawImage(v, (W - sw) / 2, (H - sh) / 2, sw, sh, 0, 0, c.width, c.height);
        const txt = await decodificar(c); if (txt) leidoCamara(txt);
      }
      ESC.timer = setTimeout(paso, 90);
    };
    paso();
  } catch (e){ sin.classList.remove('hidden'); sin.innerHTML = `${ico('camara', 'grande')}<span>No se pudo abrir la cámara${e && e.name === 'NotAllowedError' ? ' (no se dio el permiso)' : ''}. Usá «Sacar una foto del código» o escribilo abajo.</span>`; }
}
function apagarCamara(){
  clearTimeout(ESC.timer); try { if (ESC.ctrl) ESC.ctrl.stop(); } catch (e) {} ESC.ctrl = null;
  if (ESC.stream) ESC.stream.getTracks().forEach(t => t.stop()); ESC.stream = null;
}
function escLuz(b){ const t = ESC.stream && ESC.stream.getVideoTracks()[0]; if (!t) return; const on = !b.classList.contains('on'); t.applyConstraints({ advanced:[{ torch:on }] }).then(() => b.classList.toggle('on', on)).catch(() => {}); }
function escZoom(b){ const t = ESC.stream && ESC.stream.getVideoTracks()[0]; if (!t) return; const on = !b.classList.contains('on'); t.applyConstraints({ advanced:[{ zoom:on ? 2 : Math.max(1, ESC.cap.zoom.min || 1) }] }).then(() => b.classList.toggle('on', on)).catch(() => {}); }
// Plan B: una foto con la cámara del celular (enfoca mejor que el video). Se prueba entera y, si no, por partes.
async function escFoto(inp){
  const f = inp.files && inp.files[0]; inp.value = ''; if (!f) return;
  const res = $('#esc-res'); res.innerHTML = `<div class="esc-leyendo">${ico('camara')} Leyendo la foto…</div>`;
  try {
    await prepararLector();
    const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = URL.createObjectURL(f); });
    const c = document.createElement('canvas'), ctx = c.getContext('2d', { willReadFrequently:true });
    const prueba = (esc, x, y, w, h, giro) => { const W = Math.round(w * esc), H = Math.round(h * esc);
      c.width = giro ? H : W; c.height = giro ? W : H; ctx.save(); if (giro){ ctx.translate(H, 0); ctx.rotate(Math.PI / 2); } ctx.drawImage(img, x, y, w, h, 0, 0, W, H); ctx.restore(); return decodificar(c); };
    const w = img.naturalWidth, h = img.naturalHeight, e = Math.min(1, 1600 / Math.max(w, h));
    const intentos = [[e, 0, 0, w, h], [Math.min(1, 1600 / (w * .6)), w * .2, h * .2, w * .6, h * .6], [e, 0, 0, w, h, true]];
    for (const a of intentos){ const txt = await prueba(...a); if (txt){ leerCodigo(txt); return; } }
    res.innerHTML = `<div class="esc-nada">${ico('alerta')} <span>No encontramos un código en la foto. Sacala más cerca, derecha y con buena luz (que el código ocupe casi todo el ancho).</span></div>`;
  } catch (er){ res.innerHTML = `<div class="esc-nada">${ico('alerta')} <span>No se pudo leer la foto. Revisá la conexión a internet y probá de nuevo.</span></div>`; }
}

// Lo que se leyó: repuesto, dron (chasis) o batería (N° de serie)
function leerCodigo(cod){
  cod = String(cod || '').trim(); if (!cod) return;
  sonido('escaner'); vibrar(60);
  if (ESC.captura){ const f = ESC.captura.alLeer; ESC.captura = null; cerrarModal(); f(cod); return; }
  // En el celular el resultado queda debajo de la cámara: se baja hasta él para que se vea que leyó
  setTimeout(() => { const r = $('#esc-res'); if (r && r.firstElementChild) r.scrollIntoView({ behavior:'smooth', block:'nearest' }); }, 60);
  const v = $('#esc-visor'); if (v){ v.classList.remove('leido'); v.offsetHeight; v.classList.add('leido'); }
  const s = sinTildes(cod);
  // Los QR de los equipos pueden traer varios datos o un link: se prueba con cada parte (el N° de serie suele ser una de ellas)
  const partes = [s].concat(s.split(/[\s;,|/?&=#:]+/).filter(x => x.length >= 5));
  const igual = (v, lista) => lista.find(x => partes.includes(sinTildes(v(x))));
  const contiene = (v, lista) => lista.find(x => { const t = sinTildes(v(x)); return t.length >= 6 && (s.includes(t) || (s.length >= 6 && t.includes(s))); });
  const p = D().productos.find(x => sinTildes(x.cod) === s) || D().productos.find(x => (x.barras || []).some(c => sinTildes(c) === s))
    || (s.length >= 3 && D().productos.find(x => sinTildes(x.nombre).includes(s) || sinTildes(x.cod).includes(s)));
  const dr = igual(x => x.chasis, D().drones) || contiene(x => x.chasis, D().drones);
  const b = igual(x => x.serie, D().baterias.slice().sort((a, c) => c.f.localeCompare(a.f))) || contiene(x => x.serie, D().baterias);
  if (dr){
    const o = ordenesActivas().find(x => x.dron === dr.id);
    $('#esc-res').innerHTML = `<div class="esc-ficha"><div class="esc-foto">${fotoDron(dr.modelo, 3)}</div><div class="esc-datos"><small>QR de un dron · ${dr.chasis}</small><h3>${modeloTxt(dr.modelo)}</h3><p>${esc(nomCli(dr.cli))} · comprado en ${dr.compra}</p>
      <div class="esc-acc">${o ? `<button class="btn btn-prim" onclick="cerrarModal();fichaOrden('${o.id}')">${ico('llave')} Abrir ${o.num}</button>` : `<button class="btn btn-prim" onclick="cerrarModal();ir('recepcion')">${ico('recepcion')} Empezar la recepción</button>`}</div></div></div>`;
    return;
  }
  if (b){
    $('#esc-res').innerHTML = `<div class="esc-ficha"><div class="esc-foto bat">${ico('bateria', 'grande')}</div><div class="esc-datos"><small>QR de una batería · ${b.serie}</small><h3>${esc(b.disp)}</h3><p>${esc(nomCli(b.cli))} · ${b.ciclos} ciclos · ${chip(ESTADOS_BATERIA[b.estado].t, ESTADOS_BATERIA[b.estado].c)}</p>
      <div class="esc-acc"><button class="btn btn-prim" onclick="cerrarModal();ir('baterias')">${ico('bateria')} Abrir ${b.num}</button></div></div></div>`;
    return;
  }
  if (p && tipo() === 'consulta'){ cerrarModal(); consultar(p.cod); return; }
  if (p){ $('#esc-res').innerHTML = fichaProducto(p); return; }
  // No está cargado: si parece el QR de un equipo, se ofrece recibirlo con el número ya completo
  // No está cargado. Un número largo suele ser el código de barras del fabricante (caja de DJI, EAN): se puede asignar a un artículo.
  // Otro texto puede ser el QR de un equipo nuevo: se ofrece recibirlo con el número ya puesto.
  const serie = serieDe(cod), t = tipo(), corto = esc(cod.length > 60 ? cod.slice(0, 60) + '…' : cod);
  const fabricante = /^\d{8,14}$/.test(cod), puedeRecibir = !fabricante && !['consulta', 'externo'].includes(t), puedeAsignar = puedeVer('stock') && t !== 'consulta';
  $('#esc-res').innerHTML = `<div class="esc-nada">${ico('alerta')} <span>Leímos <b>${corto}</b>, pero no hay ningún artículo, dron ni batería con ese código.${fabricante ? ' Parece el código de barras del fabricante: asignalo a su artículo y la próxima vez se reconoce solo.' : puedeRecibir ? ' Si es un equipo nuevo, recibilo con ese número:' : ''}</span></div>
    <div class="esc-acc">${puedeAsignar ? `<button class="btn ${fabricante ? 'btn-prim' : 'btn-linea'}" onclick="asignarBarras('${esc(cod)}')">${ico('caja')} Asignarlo a un artículo</button>` : ''}
      ${puedeRecibir && serie ? `<button class="btn btn-linea" onclick="cerrarModal();recibirBateria('${esc(serie)}')">${ico('bateria')} Recibir esta batería</button>
      <button class="btn btn-linea" onclick="cerrarModal();recibirDronCon('${esc(serie)}')">${ico('dron')} Recibir este dron</button>` : ''}</div>`;
}
// Un código de barras de fábrica queda guardado en el artículo (p.barras) y desde ahí se reconoce al escanear
function asignarBarras(cod){
  abrirModal({ titulo:'Asignar código de barras', sub:'Código leído: ' + esc(cod),

function asignarBarrasOK(cod){

// Recepción de un dron con el chasis que vino del QR
function recibirDronCon(chasis){ const r = REC(); r.chasis = chasis; r.paso = 0; guardar(); REC_LISTA = null; ir('recepcion'); avisar('N° de chasis completado desde el QR: ' + esc(chasis), 'qr'); }
// «Agregar a mi orden» desde el escáner: se elige el dron y el repuesto queda en el pedido

function icoCategoria(c){ return { 'Hélices':'helice', 'Motores':'motor', 'Pulverización':'gota', 'Electrónica':'ajuste', 'Estructura':'dron', 'Baterías':'bateria', 'Cargadores':'bateria', 'Control remoto':'joystick', 'Generadores':'generador', 'Limpieza':'gota', 'Accesorios':'valija', 'Esparcido':'tanque' }[c] || 'caja'; }
function mostrarProductoEscaneado(cod){ abrirEscaner(); setTimeout(() => leerCodigo(cod), 120); }

function kpiPanel(t, valor, serie, color, det, icono, alReves){
  const s = serieSemana(serie), vr = variacion(serie), sube = vr >= 0, bien = alReves ? !sube : sube;

    <div class="kpi-pie"><span>${det}</span>${vr ? `<span class="kpi-var ${bien ? 'bien' : 'mal'}" title="Últimos 7 días contra la semana anterior">${ico(sube ? 'arriba' : 'abajo', 'chico')}${Math.abs(vr)} %<span class="kv-txt">&nbsp;en la semana</span></span>` : ''}</div>
    ${sparkline(s, color)}
  </div>`;
}

function tarjetaDronHoy(o, i){

  </button>`;

/* ---------- Para aprobar (arriba de todo si hay pedidos esperando) ---------- */
function bloqueAprobar(lista){
  const ver = lista.slice(0, 4);
  return `<section class="tarjeta aprobar-bloque">
    <div class="tarjeta-cab"><span class="tarjeta-ico ambar">${ico('aprobar')}</span><div><h3>Para aprobar <span class="contador">${lista.length}</span></h3><div class="sub">Retiros, devoluciones, presupuestos, ventas y pases de drones</div></div>
      <div class="acc"><button class="link" onclick="ir('aprobaciones')">Ver la bandeja ${ico('der')}</button></div></div>
    <div class="ap-lista">${ver.map(filaAprobacion).join('')}</div>
    ${lista.length > ver.length ? `<button class="ap-mas" onclick="ir('aprobaciones')">y ${lista.length - ver.length} más en la bandeja ${ico('der', 'chico')}</button>` : ''}
  </section>`;
}
function descAprobacion(a){
  const o = a.orden && orden(a.orden), quien = `<b>${esc(nomUsuario(a.u))}</b>`;
  const items = (a.items || []).map(i => { const p = producto(i.cod); const falta = a.tipo === 'retiro' && p && p.stock < i.cant;
    return `<span class="ap-item ${falta ? 'falta' : ''}" title="${falta ? 'No alcanza el stock' : ''}">${i.cant > 0 ? i.cant : i.cant} × ${esc(p ? p.nombre : i.cod)} <small>${i.cod}${a.tipo === 'retiro' && p ? ' · hay ' + p.stock : ''}</small></span>`; }).join('');
  if (a.tipo === 'retiro'){ const n = sumar(a.items, i => i.cant); return [`${quien} pide ${n} repuesto${n === 1 ? '' : 's'} para la <b>${o.num}</b> (${modeloTxt(o.modelo).replace('DJI ', '')})`, items]; }
  if (a.tipo === 'devolucion') return [`${quien} devuelve al stock lo que sobró de la <b>${o.num}</b>`, items];
  if (a.tipo === 'presupuesto'){ const p = D().presupuestos.find(x => x.id === a.presupuesto); const tot = sumar(p.lineas, l => l.precio * l.cant);
    return [`${quien} armó el presupuesto <b>${p.num}</b> para la ${o.num}`, `<span class="ap-item">${esc(nomCli(p.cli))} · <b class="num">${usd(tot)}</b> con IVA</span>${(a.vistoBueno || []).length ? `<span class="ap-item ok">${ico('check', 'chico')} Ya lo aprobó ${a.vistoBueno.map(nomUsuario).join(' y ')}</span>` : ''}`]; }
  if (a.tipo === 'venta'){ const vt = D().ventas.find(x => x.id === a.venta);
    return [`${quien} vendió ${vt.items.length} producto${vt.items.length === 1 ? '' : 's'} a ${esc(nomCli(vt.cli))}`, vt.items.map(i => `<span class="ap-item">${i.cant} × ${esc(producto(i.cod).nombre)}</span>`).join('') + `<span class="ap-item"><b class="num">${usd(totalVenta(vt))}</b></span>`]; }
  if (a.tipo === 'pase') return [`${quien} pide pasar la <b>${o.num}</b> (${modeloTxt(o.modelo).replace('DJI ', '')}) a <b>${esc(nomUsuario(a.a))}</b>`, `<span class="ap-item">Motivo: ${esc(a.txt)}</span>`];
  if (a.tipo === 'ajuste') return [`${quien} pide un ajuste manual de stock`, items + `<span class="ap-item">Motivo: ${esc(a.txt)}</span>`];
  return ['', ''];
}
function filaAprobacion(a){
  const [t, det] = descAprobacion(a);
  return `<div class="ap-fila ${a.urgente ? 'urgente' : ''}" id="ap-${a.id}">
    <span class="ap-tipo">${ico(TIPOS_APROB[a.tipo].ico)}</span>
    <div class="ap-txt"><div class="ap-t">${a.urgente ? `<span class="chip c-rojo">${ico('urgente')}Urgente</span>` : ''}<span>${t}</span></div>
      <div class="ap-det">${det}</div><div class="ap-cuando">${TIPOS_APROB[a.tipo].t} · ${haceCuanto(a.f, a.h)}${a.txt && a.tipo !== 'pase' && a.tipo !== 'ajuste' ? ' · «' + esc(a.txt) + '»' : ''}</div></div>
    <div class="ap-acc"><button class="btn btn-linea btn-sm" onclick="rechazar('${a.id}')">Rechazar</button><button class="btn btn-verde btn-sm" onclick="aprobar('${a.id}')">${ico('check')} Aprobar</button></div>
  </div>`;
}

/* ---------- Aprobar y rechazar (lo mismo que en la bandeja de Aprobaciones) ---------- */
function aprobar(id, cambios){
  const a = D().aprobaciones.find(x => x.id === id); if (!a || a.est !== 'pendiente') return;
  // Aprobar con cambios (por ejemplo, otra cantidad): queda anotado cómo estaba antes
  if (cambios){ a.pedido = a.items.map(i => ({ ...i })); a.items = cambios.filter(i => i.cant > 0); if (!a.items.length) return rechazarCon(id, 'Cantidad en cero'); }
  const o = a.orden && orden(a.orden), quien = usuarioId();
  let msg = 'Aprobado';
  if (a.tipo === 'retiro'){
    a.items.forEach(i => { const p = producto(i.cod); p.stock -= i.cant;
      o.repuestos.push({ cod:i.cod, cant:i.cant, precio:p.precio, est:'aprobado', u:a.u, f:hoy(), aprobo:quien, garantiaHasta:p.garantia ? sumarDias(hoy(), p.garantia) : null });
      D().movs.unshift({ f:hoy(), h:hora(), cod:i.cod, tipo:'retiro', cant:-i.cant, ref:o.num, u:a.u, aprobo:quien });
      if (!p.usado) sumarAlPedido(i.cod, i.cant, o.num); });
    o.hist.push({ f:hoy(), h:hora(), u:quien, a:`Aprobó el retiro de ${a.items.map(i => i.cant + ' × ' + i.cod).join(', ')}` });
    msg = `Retiro aprobado · salió del stock y se sumó al pedido a Dragur`;
  } else if (a.tipo === 'devolucion'){
    a.items.forEach(i => { producto(i.cod).stock += i.cant; D().movs.unshift({ f:hoy(), h:hora(), cod:i.cod, tipo:'devolucion', cant:i.cant, ref:o.num, u:a.u, aprobo:quien });
      // se puede devolver una parte: lo devuelto queda en su propia fila
      let resta = i.cant;
      o.repuestos.filter(x => x.cod === i.cod && x.est === 'aprobado' && (!x.devuelto || x.devuelto === 'pendiente')).forEach(r => { if (resta <= 0) return;
        if (resta >= r.cant){ resta -= r.cant; r.devuelto = fCorta(hoy()); } else { r.cant -= resta; o.repuestos.push(Object.assign({}, r, { cant:resta, devuelto:fCorta(hoy()) })); resta = 0; } }); });
    o.hist.push({ f:hoy(), h:hora(), u:quien, a:`Confirmó la devolución al stock de ${a.items.map(i => i.cant + ' × ' + i.cod).join(', ')}` });
    msg = 'Devolución confirmada · volvió al stock';
  } else if (a.tipo === 'presupuesto'){
    const p = D().presupuestos.find(x => x.id === a.presupuesto);
    a.vistoBueno = (a.vistoBueno || []).concat(quien); p.vistoBueno = a.vistoBueno;
    const regla = D().config.aprobaciones.presupuesto.quien;
    if (regla === 'ambos' && !(a.vistoBueno.includes('claudio') && a.vistoBueno.includes('florencia'))){ guardar(); registrar('Dio el visto bueno al presupuesto', p.num, 'presupuestos'); quitarFila(a.id, 'Visto bueno dado · falta el otro'); return; }
    p.est = 'aprobado'; msg = `Presupuesto ${p.num} aprobado · listo para mandar al cliente`;
  } else if (a.tipo === 'venta'){
    const vt = D().ventas.find(x => x.id === a.venta); vt.est = 'aprobada'; vt.aprobo = quien;
    vt.items.forEach(i => { producto(i.cod).stock -= i.cant; D().movs.unshift({ f:hoy(), h:hora(), cod:i.cod, tipo:'venta', cant:-i.cant, ref:vt.num, u:vt.u }); if (!producto(i.cod).usado) sumarAlPedido(i.cod, i.cant, vt.num); });
    msg = `Venta ${vt.num} aprobada · se descontó del stock`;
  } else if (a.tipo === 'pase'){
    const antes = o.tec; o.tec = a.a; o.hist.push({ f:hoy(), h:hora(), u:quien, a:`Aprobó el pase de ${nomUsuario(antes)} a ${nomUsuario(a.a)} (motivo: ${a.txt})` });
    msg = `${o.num} pasó a ${nomUsuario(a.a)} · le llega el aviso`;
  } else if (a.tipo === 'ajuste'){
    a.items.forEach(i => { producto(i.cod).stock += i.cant; D().movs.unshift({ f:hoy(), h:hora(), cod:i.cod, tipo:'ajuste', cant:i.cant, ref:a.txt, u:a.u, aprobo:quien }); });
    msg = 'Ajuste de stock aprobado';
  }
  a.est = 'aprobado'; a.resolvio = quien; a.fRes = hoy(); a.hRes = hora();
  registrar(`Aprobó: ${TIPOS_APROB[a.tipo].t.toLowerCase()}`, o ? o.num : '', 'aprobaciones'); guardar();
  quitarFila(a.id, msg, a.tipo === 'retiro' ? { accion:'Imprimir vale', alTocar:() => valeRetiro(a.id) } : null);
}

/* ---------- Lista que sugiere opciones mientras se escribe (sin <datalist>) ----------
   Se abre hacia arriba si abajo no hay lugar (el teclado del celular) y sigue al campo al desplazarse. */
function autocompletar(input, buscarFn, elegirFn){
  if (!input) return;
  const caja = document.createElement('div'); caja.className = 'ac-lista hidden'; document.body.appendChild(caja);
  let lista = [], sel = 0;
  const pintar = () => {
    if (!document.body.contains(input)){ caja.remove(); return; }
    lista = buscarFn(input.value).slice(0, 8);
    if (!lista.length || document.activeElement !== input){ caja.classList.add('hidden'); return; }
    sel = Math.min(sel, lista.length - 1);
    caja.innerHTML = lista.map((x, i) => `<button type="button" data-i="${i}" class="${i === sel ? 'sel' : ''}">${x.ico ? ico(x.ico) : ''}<span><b>${esc(x.t)}</b>${x.s ? `<small>${esc(x.s)}</small>` : ''}</span></button>`).join('');
    const r = input.getBoundingClientRect(), abajo = innerHeight - r.bottom, arriba = abajo < 260 && r.top > abajo;
    caja.style.left = r.left + 'px'; caja.style.width = Math.max(r.width, 260) + 'px';
    if (arriba){ caja.style.top = ''; caja.style.bottom = (innerHeight - r.top + 4) + 'px'; } else { caja.style.bottom = ''; caja.style.top = (r.bottom + 4) + 'px'; }
    caja.classList.remove('hidden');
  };
  input.addEventListener('input', () => { sel = 0; pintar(); });
  input.addEventListener('focus', pintar);
  input.addEventListener('blur', () => setTimeout(() => caja.classList.add('hidden'), 160));
  input.addEventListener('keydown', e => {
    if (caja.classList.contains('hidden')) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + lista.length) % lista.length; pintar(); }
    if (e.key === 'Enter' && lista[sel]){ e.preventDefault(); elegirFn(lista[sel]); caja.classList.add('hidden'); }
  });
  caja.addEventListener('mousedown', e => { const b = e.target.closest('button'); if (!b) return; e.preventDefault(); elegirFn(lista[b.dataset.i]); caja.classList.add('hidden'); });
  addEventListener('scroll', () => { if (!caja.classList.contains('hidden')) pintar(); }, true);
}

function tomarFoto(o){

    const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; if (!o.galeria) i.setAttribute('capture', 'environment');
    i.onchange = () => {
      const f = i.files[0]; if (!f) return res(null);
      const img = new Image();
      img.onload = () => { const k = Math.min(1, (o.max || 720) / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src); res({ src:c.toDataURL('image/jpeg', .62), f:hoy(), h:hora(), u:usuarioId() }); };

}

/* =====================================================================

   Versión real (decisión del 09/11/2026): cuenta de Google NUEVA del taller,
   solo para la página, compartida con Wydan para controlar los respaldos.

/* ---------- El visor del Drive ---------- */
function contenidoDrive(p){
  const anios = l => [...new Set(l)].sort().reverse();
  const carpeta = (n, extra) => Object.assign({ tipo:'carpeta', n }, extra || {});
  if (!p.length) return DRIVE_CARPETAS.map(([n, i, d]) => carpeta(n, { ico:i, sub:d }));
  const [raiz, a, b] = p;
  if (raiz === 'Facturas de venta'){
    const fs = facturasActivas().filter(f => f.f);
    if (!a) return anios(fs.map(f => f.f.slice(0, 4))).map(y => carpeta(y, { sub:fs.filter(f => f.f.startsWith(y)).length + ' facturas' }));
    if (!b) return [...new Set(fs.filter(f => f.f.startsWith(a)).map(f => f.f.slice(5, 7)))].sort().reverse().map(m => carpeta(m, { etiqueta:m + ' · ' + MESES_DRIVE[Number(m) - 1], sub:fs.filter(f => f.f.startsWith(a + '-' + m)).length + ' facturas' }));
    return fs.filter(f => f.f.startsWith(a + '-' + b)).sort((x, y) => y.f.localeCompare(x.f)).map(f => ({ tipo:'pdf', id:f.id, n:nombreFactura(f), sub:`${f.num} · ${usd(f.total)}`, abrir:`verFactura('${f.id}')` }));
  }
  if (raiz === 'Facturas de compras'){
    const ps = D().pedidos.filter(x => x.factura);
    if (!a) return anios(ps.map(x => (x.fRecibido || x.f).slice(0, 4))).map(y => carpeta(y, { sub:ps.filter(x => (x.fRecibido || x.f).startsWith(y)).length + ' facturas' }));
    return ps.filter(x => (x.fRecibido || x.f).startsWith(a)).map(x => ({ tipo:'pdf', id:x.id, n:`Factura ${x.factura} - Dragur - ${fArchivo(x.fRecibido || x.f)}.pdf`, sub:'Pedido ' + x.num, abrir:`avisar('En la versión real se abre el PDF de la factura de Dragur','nota')` }));
  }
  if (raiz === 'Fotos de recepciones'){
    const os = D().ordenes.filter(o => !o.anulado);
    if (!a) return anios(os.map(o => o.f.slice(0, 4))).map(y => carpeta(y, { sub:os.filter(o => o.f.startsWith(y)).length + ' órdenes' }));
    if (!b) return os.filter(o => o.f.startsWith(a)).sort((x, y) => y.num.localeCompare(x.num)).map(o => carpeta(o.num, { sub:modeloTxt(o.modelo) + ' · ' + nomCli(o.cli) }));
    const o = os.find(x => x.num === b); return o ? fotosOrden(o).map(f => ({ tipo:'foto', foto:f.foto, n:f.t })) : [];
  }
  if (raiz === 'Fotos de pedidos'){
    const ps = D().pedidos.filter(x => x.lineas.some(l => (l.fotos || []).length));
    if (!a) return ps.map(x => carpeta(x.num, { sub:sumar(x.lineas, l => (l.fotos || []).length) + ' fotos' }));
    const x = ps.find(y => y.num === a); return x ? x.lineas.flatMap(l => (l.fotos || []).map(f => ({ tipo:'foto', foto:f, n:l.cod + ' · ' + fDM(f.f) + ' ' + f.h }))) : [];
  }
  if (raiz === 'Fotos de artículos') return D().productos.filter(x => x.foto).map(x => ({ tipo:'foto', foto:x.foto, n:x.cod + ' · ' + x.nombre }));
  if (raiz === 'Respaldos') return Array.from({ length:30 }, (_, i) => sumarDias(hoy(), -i)).flatMap(f => [
    { tipo:'xlsx', n:`Respaldo ${fArchivo(f)}.xlsx`, sub:'Todos los datos en Excel · 23:00', abrir:`avisar('En la versión real se descarga el respaldo de ese día','nota')` },

  return [];
}
function verDrive(ruta, resaltar){

// El ícono del logo (dron con la espiga) convertido a imagen para el PDF
function iconoPNG(){
  if (_iconoPNG) return _iconoPNG;
  return _iconoPNG = new Promise(res => {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="790" height="392" viewBox="${DP.vbIcono}">${dpDefs('p')}${dpO('p')}${dpDron('p')}</svg>`;
    const img = new Image();
    img.onload = () => { const c = document.createElement('canvas'); c.width = 790; c.height = 392; c.getContext('2d').drawImage(img, 0, 0); res(c.toDataURL('image/png')); };
    img.onerror = () => res(null);
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
async function nuevoPDF(o){
  o = o || {};
  try { await cargarLib('jspdf'); await cargarLib('autotable'); }
  catch (e){ error('No se pudo cargar el generador de PDF. Revisá la conexión a internet.'); throw e; }
  const doc = new jspdf.jsPDF({ unit:'mm', format:o.formato || 'a4', orientation:o.orientacion || 'p' });
  cabeceraPDF(doc, o.titulo, o.sub);
  return doc;
}

function pdfTitulo(doc, t){

// Totales a la derecha: [[etiqueta, valor, ¿destacado?], ...]
function pdfTotales(doc, filas){

function pdfFirmas(doc, a, b){

  doc.setDrawColor(...PDF_GRIS); doc.setLineWidth(.2);
  [[14, a], [W / 2 + 8, b]].forEach(([x, t]) => { doc.line(x, doc.y, x + (W / 2 - 22), doc.y); doc.setFontSize(8.5); doc.setTextColor(...PDF_GRIS); doc.setFont('helvetica', 'normal'); doc.text(t, x, doc.y + 4.5); });

function pdfPie(doc, extra){

// Fotos en miniatura (las de ejemplo se dibujan desde su SVG)
async function pdfFotos(doc, fotos, titulo){
  if (!fotos.length) return;
  pdfTitulo(doc, titulo || 'Fotos'); const tam = 30, gap = 4, porFila = 5;
  for (let i = 0; i < fotos.length; i++){
    const f = fotos[i], col = i % porFila; if (col === 0 && i) doc.y += tam * .75 + 9; if (col === 0) pdfEspacio(doc, tam * .75 + 9);
    const x = 14 + col * (tam + gap), src = await fotoPNG(f.foto || f);
    if (src) doc.addImage(src, 'JPEG', x, doc.y, tam, tam * .75);
    doc.setFontSize(6.5); doc.setTextColor(...PDF_GRIS); doc.text(doc.splitTextToSize((f.t ? f.t + ' · ' : '') + fCorta((f.foto || f).f) + ' ' + ((f.foto || f).h || ''), tam)[0], x, doc.y + tam * .75 + 3);
  }
  doc.y += tam * .75 + 10;
}
function fotoPNG(f){
  return new Promise(res => {
    const img = new Image(); img.onload = () => { const c = document.createElement('canvas'); c.width = 400; c.height = 300; const k = c.getContext('2d'); k.fillStyle = '#fff'; k.fillRect(0, 0, 400, 300);
      const r = Math.max(400 / img.width, 300 / img.height); k.drawImage(img, (400 - img.width * r) / 2, (300 - img.height * r) / 2, img.width * r, img.height * r); res(c.toDataURL('image/jpeg', .8)); };
    img.onerror = () => res(null);
    if (f.src) img.src = f.src;
    else { let s = fotoHTML(f).replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" '); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s); }
  });
}

/* ---------- Excel sin imágenes, prolijo y listo para imprimir en una hoja ----------
   o.centrar: índices de columnas centradas · o.num: índices numéricos (formato 1.250,00) */
async function excel(archivo, titulo, cab, filas, o){
  o = o || {};
  try { await cargarLib('xlsx'); } catch (e){ error('No se pudo cargar el generador de Excel. Revisá la conexión.'); return; }
  const aoa = [[titulo], [], cab].concat(filas);
  const ws = XLSX.utils.aoa_to_sheet(aoa), n = cab.length;
  ws['!merges'] = [{ s:{ r:0, c:0 }, e:{ r:0, c:n - 1 } }];
  const borde = { style:'thin', color:{ rgb:'DCE3EE' } }, bordes = { top:borde, bottom:borde, left:borde, right:borde };
  const celda = (r, c) => ws[XLSX.utils.encode_cell({ r, c })] || (ws[XLSX.utils.encode_cell({ r, c })] = { t:'s', v:'' });
  celda(0, 0).s = { font:{ bold:true, sz:14, color:{ rgb:'0B3D9E' }, name:'Calibri' } };
  for (let c = 0; c < n; c++){
    celda(2, c).s = { font:{ bold:true, color:{ rgb:'FFFFFF' }, name:'Calibri' }, fill:{ fgColor:{ rgb:'0B3D9E' } }, border:bordes, alignment:{ horizontal:(o.centrar || []).includes(c) ? 'center' : 'left', vertical:'center' } };
    for (let r = 3; r < aoa.length; r++){
      const x = celda(r, c);
      x.s = { font:{ name:'Calibri', sz:11 }, border:bordes, alignment:{ horizontal:(o.centrar || []).includes(c) ? 'center' : (o.num || []).includes(c) ? 'right' : 'left', vertical:'center' } };
      if ((r - 3) % 2 === 1) x.s.fill = { fgColor:{ rgb:'F4F7FB' } };
      if ((o.num || []).includes(c) && typeof x.v === 'number') x.z = '#,##0.00';
    }
  }
  ws['!cols'] = cab.map((h, c) => ({ wch:Math.min(60, Math.max(String(h).length + 2, ...filas.map(f => String(f[c] == null ? '' : f[c]).length + 2))) }));
  ws['!rows'] = [{ hpt:24 }, { hpt:6 }, { hpt:20 }];
  ws['!pageSetup'] = { orientation:'portrait', fitToWidth:1, fitToHeight:0 };
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, (o.hoja || 'Hoja1').slice(0, 30));
  XLSX.writeFile(wb, archivo);
  registrar('Exportó a Excel «' + archivo + '»', '', o.sec || ''); guardar();
  avisar('Se descargó «' + esc(archivo) + '»', 'descargar');
}

// Garantía: en garantía (verde), por vencer (amarillo), vencida (rojo)
function semaforoGarantia(desde, meses){
  if (!desde) return { t:'Sin datos de garantía', c:'gris', hasta:null };
  const d = aFecha(desde); d.setMonth(d.getMonth() + (meses || 12)); const hasta = iso(d), falta = difDias(hoy(), hasta);
  if (falta < 0) return { t:'Garantía vencida', c:'rojo', hasta };
  if (falta <= 60) return { t:'Garantía por vencer (' + falta + ' días)', c:'ambar', hasta };
  return { t:'En garantía hasta ' + fCorta(hasta), c:'verde', hasta };
}

// Lo que falta en cada paso (no se puede confirmar sin chasis, horas de vuelo ni fotos obligatorias)
function faltaEnPaso(r, p){
  const f = [];
  if (p === 0){ if (!r.cli) f.push('el cliente'); if (!r.modelo) f.push('el modelo'); if (!r.chasis.trim()) f.push('el N° de chasis'); if (!String(r.horas).trim()) f.push('las horas de vuelo'); if (!r.fotoHoras) f.push('la foto de las horas'); }
  if (p === 1){ if (!r.valija.estado) f.push('el estado de la valija'); if (r.valija.estado === 'Con daños' && !r.valija.foto) f.push('la foto del daño'); }
  if (p === 2){ if (!r.contenido.hub) f.push('si trae el hub'); if (r.contenido.hub === 'Sí' && !r.contenido.fotoHub) f.push('la foto del hub'); if (!r.contenido.joysticks) f.push('los joysticks'); if (!r.contenido.cargador) f.push('el cargador'); if (!r.contenido.limpieza) f.push('la limpieza'); }
  if (p === 3){ if (!r.control.estado) f.push('el estado del control'); if (r.control.estado && r.control.estado !== 'Bien' && !r.control.foto) f.push('la foto del control'); }
  if (p === 4){ r.baterias.forEach((b, i) => { if (!b.serie) f.push('el N° de serie de la batería ' + (i + 1)); if (!b.foto) f.push('la foto de la batería ' + (i + 1)); }); }
  if (p === 5){ if (!r.dron.tanque) f.push('el tanque de líquido'); if (!r.dron.fotoTanque) f.push('la foto del tanque'); if (r.dron.motores.some(m => !m.rev)) f.push('revisar todos los motores'); if (Object.values(r.dron.fotos).filter(Boolean).length < 5) f.push('las 5 fotos generales'); }
  if (p === 6){ if (!r.generador.trae) f.push('si trae generador'); if (r.generador.trae === 'Sí' && !r.generador.foto) f.push('la foto del generador'); }
  if (p === 7){ if (!r.frases.length && !r.sintCli.trim()) f.push('qué le pasa al dron'); }
  if (p === 8){ if (!r.entrega.trim()) f.push('quién entrega'); if (!r.conforme) f.push('la conformidad del cliente'); }
  return f;
}

/* ===== js/14-reparaciones.js ===== */
/* =====================================================================

   Se ven en tablero (una columna por estado) o en lista con filtros, y
   una vista de Garantías junta todos los casos abiertos.

const TALLER = { vista:'tablero', q:'', tec:'', modelo:'', estado:'activas', atrasadas:false, recien:null };
const COLUMNAS = ['recibido', 'diagnostico', 'presupuesto', 'esperando', 'reparacion', 'garantia', 'terminado', 'facturado'];

RENDER.reparaciones = v => SUB.orden ? pintarOrden(v, SUB.orden) : pintarTaller(v);
function abrirOrden(id){ cerrarModal(); SUB.orden = id; ir('reparaciones', false, true); }

function ordenesVisibles(){
  const s = sinTildes(TALLER.q);

    && (!esTecnico() || o.tec === USUARIO)
    && (!TALLER.tec || o.tec === TALLER.tec) && (!TALLER.modelo || o.modelo === TALLER.modelo)
    && (!TALLER.atrasadas || atrasada(o))

function pintarTaller(v){

      `<button class="btn btn-prim" onclick="ir('recepcion')">${ico('dron')} Recibir dron</button>`)}
    ${pestanas([['tablero', 'Tablero'], ['lista', 'Lista', todas.length], ['garantias', 'Garantías', gar.length]], TALLER.vista, 'tallerVista')}
    ${TALLER.vista !== 'garantias' ? `<div class="barra-filtros">${buscadorLocal('t-q', TALLER.q, 'Buscar orden, chasis, cliente o síntoma…', 'tallerBuscar')}
      ${esJefe() ? `<select class="filtro" onchange="TALLER.tec=this.value;ir('reparaciones',true)"><option value="">Todos los técnicos</option>${tecnicos().map(t => `<option value="${t.id}" ${TALLER.tec === t.id ? 'selected' : ''}>${esc(t.nombre)}</option>`).join('')}</select>` : ''}
      <select class="filtro" onchange="TALLER.modelo=this.value;ir('reparaciones',true)"><option value="">Todos los modelos</option>${Object.keys(MODELOS).map(m => `<option value="${m}" ${TALLER.modelo === m ? 'selected' : ''}>${modeloTxt(m)}</option>`).join('')}</select>
      <button class="pildora ${TALLER.atrasadas ? 'on' : ''}" onclick="TALLER.atrasadas=!TALLER.atrasadas;ir('reparaciones',true)">${ico('reloj', 'chico')} Atrasadas</button></div>` : ''}

  if (TALLER.vista === 'tablero') prepararArrastre();
}
function tallerVista(k){ TALLER.vista = k; ir('reparaciones', true); }
function tallerBuscar(q){ TALLER.q = q; ir('reparaciones', true); reenfocar('t-q'); }

/* ---------- Tablero: una columna por estado ---------- */
function tablero(l){
  return `<div class="tablero">${COLUMNAS.map(k => { const e = ESTADOS_ORDEN[k], cs = l.filter(o => o.estado === k).sort((a, b) => a.f.localeCompare(b.f));
    return `<div class="col" data-estado="${k}"><div class="col-cab"><i class="col-c c-${e.c}"></i><b>${e.corto}</b><span class="pn">${cs.length}</span></div>
      <div class="col-lista">${cs.map(tarjetaOrden).join('') || `<div class="col-vacia">Arrastrá acá</div>`}</div></div>`; }).join('')}</div>`;
}
function tarjetaOrden(o){
  const dias = diasEnTaller(o), pend = D().aprobaciones.some(a => a.est === 'pendiente' && a.orden === o.id), urg = D().aprobaciones.some(a => a.est === 'pendiente' && a.orden === o.id && a.urgente);
  return `<div class="t-ord ${TALLER.recien === o.id ? 'llega' : ''} ${atrasada(o) ? 'atr' : ''}" draggable="true" data-id="${o.id}" onclick="abrirOrden('${o.id}')">
    <div class="to-foto">${fotoDron(o.modelo, Number(o.num.slice(-3)))}</div>
    <div class="to-txt"><div class="to-top"><b class="num">${o.num.slice(-4)}</b><span class="to-d ${atrasada(o) ? 'rojo' : ''}">${dias ? dias + ' d' : 'hoy'}</span></div>
      <b class="to-m">${modeloTxt(o.modelo).replace('DJI ', '')}</b><span class="to-c">${esc(nomCli(o.cli))}</span>
      <div class="to-pie">${avatar(nomUsuario(o.tec), 'chico')}${urg ? `<span class="chip c-rojo">${ico('urgente')}</span>` : pend ? `<span class="chip c-ambar" title="Esperando aprobación">${ico('reloj')}</span>` : ''}${o.garantia && o.garantia.est === 'tramite' ? `<span class="chip c-violeta">${ico('garantia')}</span>` : ''}</div></div></div>`;
}
// Arrastrar tarjetas entre columnas (en la compu)
function prepararArrastre(){
  let arr = null;
  $$('.t-ord').forEach(t => { t.addEventListener('dragstart', e => { arr = t.dataset.id; t.classList.add('arrastrando'); e.dataTransfer.effectAllowed = 'move'; }); t.addEventListener('dragend', () => { t.classList.remove('arrastrando'); $$('.col').forEach(c => c.classList.remove('sobre')); }); });
  $$('.col').forEach(c => {
    c.addEventListener('dragover', e => { e.preventDefault(); c.classList.add('sobre'); });
    c.addEventListener('dragleave', () => c.classList.remove('sobre'));
    c.addEventListener('drop', e => { e.preventDefault(); c.classList.remove('sobre'); if (arr) moverOrden(arr, c.dataset.estado); });
  });
}

/* ---------- Cambiar el estado (con las reglas de quién puede) ---------- */
function puedeCambiarA(o, k){
  if (esJefe()) return true;
  if (o.tec !== USUARIO) return false;
  return ['diagnostico', 'presupuesto', 'esperando', 'reparacion', 'terminado'].includes(k);
}
async function moverOrden(id, k, sinPreguntar){
  const o = orden(id); if (!o || o.estado === k) return;
  if (!puedeCambiarA(o, k)){ error(o.tec !== USUARIO && esTecnico() ? 'Solo el técnico responsable trabaja en esta orden' : k === 'garantia' ? 'El proceso de garantía lo marcan Claudio o Florencia' : k === 'facturado' ? 'La factura la carga Florencia desde Facturación' : 'No podés pasar la orden a ese estado'); return; }
  if (k === 'terminado') return terminarOrden(id);
  if (k === 'facturado' && !o.factura) return irAFacturar(o.id);
  if (k === 'entregado' && !sinPreguntar) return marcarEntregado(o.id);
  if (k === 'garantia' && !o.garantia) o.garantia = { est:'tramite', f:hoy(), caso:'' };
  const antes = o.estado; o.estado = k; o.cambio = { u:usuarioId(), f:hoy(), h:hora() };
  o.hist.push({ f:hoy(), h:hora(), u:usuarioId(), a:`Cambió el estado de «${ESTADOS_ORDEN[antes].t}» a «${ESTADOS_ORDEN[k].t}»` });
  registrar(`Cambió el estado de la ${o.num}`, o.num, 'reparaciones', { estado:ESTADOS_ORDEN[antes].t }, { estado:ESTADOS_ORDEN[k].t });
  guardar(); _cache = {}; TALLER.recien = id; refrescar(); setTimeout(() => TALLER.recien = null, 800);
  avisar(`${o.num} → <b>${ESTADOS_ORDEN[k].t}</b>`, 'llave');
}

/* ---------- Pedir o retirar repuestos (con aprobación de Claudio o Florencia) ---------- */

function pedirEscanear(id){ const o = orden(id), p = D().productos.find(x => x.modelos.includes(o.modelo) && x.cat === 'Hélices'); sonido('escaner'); vibrar(60); pedirAgregar(p.cod); avisar('Código leído: ' + p.cod, 'escanear'); }

/* ---------- Devolver repuestos al stock (lo que sobró): siempre con aprobación de Claudio o Florencia ----------

function paraDevolver(o){
  const enCamino = {}; D().aprobaciones.filter(a => a.est === 'pendiente' && a.tipo === 'devolucion' && a.orden === o.id).forEach(a => a.items.forEach(i => enCamino[i.cod] = (enCamino[i.cod] || 0) + i.cant));
  const m = {}; o.repuestos.filter(x => x.est === 'aprobado' && !x.devuelto).forEach(x => m[x.cod] = (m[x.cod] || 0) + x.cant);
  return Object.entries(m).map(([cod, cant]) => ({ cod, cant:cant - (enCamino[cod] || 0) })).filter(x => x.cant > 0);
}

function devolverRepuestos(id, codSel){
  const o = orden(id), l = paraDevolver(o);
  if (!l.length){ error('No hay repuestos de esta orden para devolver'); return; }
  DEV = l.map(x => ({ cod:x.cod, max:x.cant, cant:x.cod === codSel ? x.cant : 0 }));
  abrirModal({ titulo:'Devolver repuestos al stock', sub:`${o.num} · ${modeloTxt(o.modelo)} · la devolución la aprueba Claudio o Florencia`, ancho:'ancho',
    cuerpo:`<div id="dev-lista"></div>${campo('Motivo', `<input id="dev-m" value="Sobró de la reparación">`, { cls:'mt' })}`,
    pie:`<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-prim" onclick="devolverOK('${id}')">${ico('volver')} ${esJefe() ? 'Devolver al stock' : 'Pedir aprobación'}</button>`,

}

  D().aprobaciones.push(a); o.hist.push({ f:hoy(), h:hora(), u:USUARIO, a:`Pidió devolver al stock ${items.map(i => i.cant + ' × ' + i.cod).join(', ')}` });

/* ---------- Horas: Empezar/Pausar que cuenta solo, o +½ h y +1 h ---------- */
let _reloj = null;
const relojTxt = ms => { const s = Math.floor(ms / 1000); return p2(Math.floor(s / 3600)) + ':' + p2(Math.floor(s % 3600 / 60)) + ':' + p2(s % 60); };
function arrancarReloj(){ clearInterval(_reloj); const t = (D().timers || {})[USUARIO]; if (!t) return; _reloj = setInterval(() => { const e = $('#reloj'); if (!e){ clearInterval(_reloj); return; } e.textContent = relojTxt(Date.now() - t.desde); }, 1000); }
function empezarReloj(id){ D().timers = D().timers || {}; D().timers[USUARIO] = { orden:id, desde:Date.now(), h:hora() }; guardar(); refrescar(); avisar('Contando las horas de trabajo', 'play'); }
async function pararReloj(id){
  const t = D().timers[USUARIO], hs = Math.max(.1, Math.round((Date.now() - t.desde) / 360000) / 10);
  delete D().timers[USUARIO]; clearInterval(_reloj);
  const txt = await pedirTexto('¿Qué hiciste?', '', `Se cargan ${horas(hs)}`, 'Se puede dictar con el micrófono del teclado') || 'Trabajo en el taller';
  cargarHorasOrden(id, hs, txt);
}
function sumarHoras(id, h){ cargarHorasOrden(id, h, 'Trabajo en el taller'); }
function cargarHorasOrden(id, h, txt){
  const o = orden(id); o.horas.push({ f:hoy(), h, u:USUARIO, txt }); o.hist.push({ f:hoy(), h:hora(), u:USUARIO, a:`Cargó ${horas(h)}: ${txt}` });
  registrar('Cargó ' + horas(h), o.num, 'reparaciones'); guardar(); refrescar(); avisar(`Se cargaron <b>${horas(h)}</b> · total ${horas(totalHoras(o))}`, 'reloj');
}

/* ---------- Garantía ---------- */
function garantiaIniciar(id){ const o = orden(id); o.garantia = { est:'tramite', f:hoy(), caso:'' }; moverOrden(id, 'garantia', true); }
function garantiaResponder(id, r){
  const o = orden(id), caso = ($('#g-caso') || {}).value || o.garantia.caso;
  if (r === 'con'){
    abrirModal({ titulo:'Con garantía', sub:'Cargá la nota de garantía y adjuntá el documento',
      cuerpo:grilla([campo('N° de la nota de garantía', `<input id="g-nota" placeholder="Ej.: GAR-20931">`), campo('Documento', `<input type="file" id="g-doc" accept=".pdf,image/*">`, { ayuda:'Se guarda en la nube junto a la orden.' })]),
      pie:`<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-prim" onclick="garantiaCon('${id}','${esc(caso)}')">${ico('check')} Guardar</button>` });
    return;
  }
  Object.assign(o.garantia, { est:'sin', caso, fRes:hoy() }); o.estado = 'presupuesto';
  o.hist.push({ f:hoy(), h:hora(), u:USUARIO, a:'El fabricante respondió SIN garantía · vuelve al circuito normal con presupuesto' });
  registrar('Garantía: sin garantía', o.num, 'reparaciones'); guardar(); refrescar(); avisar('Sin garantía: la orden vuelve al circuito normal con presupuesto al cliente', 'garantia');
}
function garantiaCon(id, caso){
  const o = orden(id), f = $('#g-doc').files[0];
  Object.assign(o.garantia, { est:'con', caso, nota:$('#g-nota').value || 'GAR-' + Math.floor(Math.random() * 90000 + 10000), doc:f ? f.name : 'Nota de garantía.pdf', fRes:hoy() });
  o.estado = 'reparacion'; o.hist.push({ f:hoy(), h:hora(), u:USUARIO, a:'El fabricante respondió CON garantía · nota ' + o.garantia.nota });
  registrar('Garantía: con garantía', o.num, 'reparaciones'); guardar(); cerrarModal(); refrescar(); avisar('Con garantía: nota guardada y le avisamos al responsable', 'garantia', { tilde:true });
}

/* ---------- Pase a otro técnico (lo aprueba Claudio) ---------- */
function pasarOrden(id){
  const o = orden(id);
  abrirModal({ titulo:'Pasar a otro técnico', sub:`${o.num} · hoy es de ${esc(nomUsuario(o.tec))}`,
    cuerpo:`${campo('Nuevo responsable', sel('a', tecnicos().filter(t => t.id !== o.tec).map(t => [t.id, t.nombre]), '', 'id="pase-a"'))}
      ${campo('Motivo', `<input id="pase-m" placeholder="Ej.: licencia, ausencia, especialidad…">`, { ayuda:esDueno() ? 'Como sos Claudio, el pase se hace en el momento.' : 'Lo aprueba Claudio. Queda en el historial quién hizo qué.' })}`,
    pie:`<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-prim" onclick="pasarOK('${id}')">${ico('pase')} ${esDueno() ? 'Pasar' : 'Pedir el pase'}</button>` });
}
function pasarOK(id){
  const o = orden(id), a = $('#pase-a').value, m = $('#pase-m').value.trim(); if (!m){ error('Escribí el motivo'); return; }
  const ap = { id:'a' + Date.now().toString(36), tipo:'pase', u:USUARIO, f:hoy(), h:hora(), est:'pendiente', vistoBueno:[], orden:o.id, a, txt:m };
  D().aprobaciones.push(ap); registrar('Pidió pasar la orden a ' + nomUsuario(a), o.num, 'reparaciones'); guardar(); _cache = {}; cerrarModal();

/* ---------- Terminar: arma solo el reporte para facturar y le avisa a Florencia ---------- */
async function terminarOrden(id){
  const o = orden(id);
  if (D().aprobaciones.some(a => a.est === 'pendiente' && a.orden === id && a.tipo === 'retiro')){ if (!await confirmar('Hay repuestos esperando aprobación', '¿Terminar igual? Los pedidos pendientes quedan sin usar.', 'Terminar igual')) return; }
  else if (!await confirmar('¿Terminar la reparación?', `Se arma el reporte para facturar (${horas(totalHoras(o))} de mano de obra y ${o.repuestos.filter(x => x.est === 'aprobado').length} repuestos) y le avisamos a Florencia.`, 'Terminar')) return;
  o.estado = 'terminado'; o.fTerm = hoy(); o.hist.push({ f:hoy(), h:hora(), u:USUARIO, a:'Marcó la reparación como terminada · lista para facturar' });
  registrar('Terminó la reparación', o.num, 'reparaciones', { estado:'En reparación' }, { estado:'Terminado' }); guardar(); _cache = {}; refrescar();
  avisar(`<b>${o.num}</b> lista para facturar · le avisamos a Florencia`, 'check', { tilde:true, accion:'Ver reporte', alTocar:() => reporteFacturar(id) });
}
async function marcarEntregado(id){
  const o = orden(id);
  const quien = await pedirTexto('Marcar como entregado', cliente(o.cli).contacto, '¿Quién retiró el dron?', 'Fecha y hora quedan automáticas.'); if (!quien) return;
  o.estado = 'entregado'; o.fEntrega = hoy(); o.retiro = quien; o.hist.push({ f:hoy(), h:hora(), u:USUARIO, a:'Entregado al cliente · retiró ' + quien });
  registrar('Marcó como entregado (retiró ' + quien + ')', o.num, 'reparaciones'); guardar(); _cache = {}; refrescar(); avisar(`${o.num} entregado al cliente`, 'check', { tilde:true });
}
async function anularOrden(id){
  const o = orden(id), m = await pedirTexto('Anular la orden', '', 'Motivo', 'Nada se borra: queda visible como anulada, con quién la anuló y por qué.'); if (!m) return;
  o.anulado = { u:USUARIO, f:hoy(), h:hora(), motivo:m }; registrar('Anuló la orden (' + m + ')', o.num, 'reparaciones'); guardar(); _cache = {}; SUB = {}; ir('reparaciones'); avisar(o.num + ' anulada', 'anular');
}

/* ---------- PDF: reporte para facturar y vale de retiro ---------- */
async function reporteFacturar(id){
  const o = orden(id), c = cliente(o.cli), tarifa = D().config.tarifaHora, iva = D().config.iva / 100;
  const doc = await nuevoPDF({ titulo:'Reporte para facturar', sub:o.num });
  pdfDatos(doc, [['Cliente', c.nombre], ['RUT / CI', c.doc], ['Teléfono', c.tel], ['Localidad', c.localidad], ['Dron', modeloTxt(o.modelo)], ['Chasis', o.chasis], ['Ingreso', fCorta(o.f)], ['Terminado', fCorta(o.fTerm || hoy())]], 'Cliente y equipo');
  pdfTitulo(doc, 'Trabajos realizados');
  pdfTabla(doc, ['Fecha', 'Qué se hizo', 'Técnico', 'Horas'], o.horas.map(x => [fCorta(x.f), x.txt, nomUsuario(x.u), horas(x.h)]), { columnStyles:{ 3:{ halign:'right' } } });
  const rep = o.repuestos.filter(x => x.est === 'aprobado' && !x.devuelto);
  pdfTitulo(doc, 'Repuestos usados');
  pdfTabla(doc, ['Código', 'Repuesto', 'Tipo', 'Cant.', 'Precio s/IVA', 'Importe'], rep.map(x => { const p = producto(x.cod) || {}; return [x.cod, (p.nombre || '').replace(' (usado)', ''), /-U$/.test(x.cod) ? 'Usado' : 'Nuevo', String(x.cant), usd(x.precio / (1 + iva)), usd(x.precio / (1 + iva) * x.cant)]; }), { columnStyles:{ 3:{ halign:'center' }, 4:{ halign:'right' }, 5:{ halign:'right' } } });
  const sub = sumar(rep, x => x.precio / (1 + iva) * x.cant) + totalHoras(o) * tarifa;
  pdfTotales(doc, [['Repuestos', usd(sumar(rep, x => x.precio / (1 + iva) * x.cant))], [`Mano de obra (${horas(totalHoras(o))} × ${usd0(tarifa)})`, usd(totalHoras(o) * tarifa)], ['Subtotal', usd(sub)], ['IVA ' + D().config.iva + ' %', usd(sub * iva)], ['Total', usd(sub * (1 + iva)), true]]);
  if (o.garantia && o.garantia.est === 'con') pdfTexto(doc, 'Caso con garantía del fabricante (nota ' + o.garantia.nota + '): revisar qué parte se factura al cliente.', { color:PDF_HOJA });
  pdfPie(doc, o.num);
  docListo(doc, `Reporte para facturar ${o.num}.pdf`, { ref:o.num, sec:'facturacion' });
}
async function valeRetiro(aid){
  const a = D().aprobaciones.find(x => x.id === aid), o = orden(a.orden);
  const doc = await nuevoPDF({ titulo:'Vale de retiro de repuestos', sub:o.num });
  pdfDatos(doc, [['Fecha', fCorta(a.fRes || a.f) + ' ' + (a.hRes || a.h)], ['Orden', o.num], ['Dron', modeloTxt(o.modelo)], ['Cliente', nomCli(o.cli)], ['Técnico', nomUsuario(a.u)], ['Aprobó', nomUsuario(a.resolvio)]], 'Datos del retiro');
  pdfTabla(doc, ['Código', 'Repuesto', 'Ubicación', 'Cantidad'], a.items.map(i => { const p = producto(i.cod) || {}; return [i.cod, p.nombre, p.ubic, String(i.cant)]; }), { columnStyles:{ 3:{ halign:'center' } } });
  pdfTexto(doc, 'Los repuestos salen del stock y se suman al pedido a Dragur para reponerlos.', { tam:8.5, color:PDF_GRIS });
  pdfFirmas(doc, 'Retira: ' + nomUsuario(a.u), 'Aprueba: ' + nomUsuario(a.resolvio));
  pdfPie(doc, 'Vale ' + o.num);
  docListo(doc, `Vale de retiro ${o.num} - ${fArchivo(hoy())}.pdf`, { ref:o.num, sec:'stock' });
}


/* ===== js/16-aprobaciones.js ===== */
/* =====================================================================
   APROBACIONES · una bandeja única con todo lo que espera el visto bueno
   de Claudio o Florencia, agrupada por dron. Cada pedido muestra quién lo
   hizo, cuándo, para qué, el stock disponible (en rojo si no alcanza) y
   hace cuánto espera. Aprobar todo, uno por uno, con cambios o rechazar.
   ===================================================================== */
let APR_VISTA = 'pendientes';
RENDER.aprobaciones = v => {
  const pend = aprobacionesPendientes(), todas = D().aprobaciones.filter(a => a.est === 'pendiente');
  const res = D().aprobaciones.filter(a => a.est !== 'pendiente').sort((a, b) => ((b.fRes || b.f) + (b.hRes || b.h)).localeCompare((a.fRes || a.f) + (a.hRes || a.h))).slice(0, 40);
  v.innerHTML = `${enc('Aprobaciones', pend.length ? `<b>${pend.length}</b> pedido${pend.length === 1 ? '' : 's'} esperando tu visto bueno` : 'No hay nada esperando tu aprobación')}
    ${pestanas([['pendientes', 'Para aprobar', pend.length], ['otros', 'Esperando a otro', todas.length - pend.length], ['resueltas', 'Resueltas']], APR_VISTA, 'aprVista')}
    <div id="apr-cuerpo">${APR_VISTA === 'pendientes' ? bandeja(pend, true) : APR_VISTA === 'otros' ? bandeja(todas.filter(a => !pend.includes(a)), false) : resueltas(res)}</div>
    <p class="ayuda-sec mt">${ico('info', 'chico')} Quién aprueba cada cosa se cambia en Configuración › Aprobaciones. Si un pedido queda ${D().config.recordatorioMin} minutos sin respuesta se vuelve a avisar, y si sigue esperando le llega a Claudio.</p>`;
};
function aprVista(k){ APR_VISTA = k; ir('aprobaciones', true, true); }

function bandeja(l, puede){
  if (!l.length) return vacio(puede ? '¡Todo aprobado!' : 'Nada por acá', puede ? 'Cuando un técnico pida repuestos, una venta o un pase, aparece acá.' : '');
  const grupos = {};
  l.forEach(a => { const k = a.orden || a.tipo; (grupos[k] = grupos[k] || []).push(a); });
  return Object.entries(grupos).sort((a, b) => (b[1].some(x => x.urgente) - a[1].some(x => x.urgente))).map(([k, as]) => {
    const o = orden(k), urg = as.some(x => x.urgente), ret = as.filter(x => x.tipo === 'retiro');
    const cab = o ? `<div class="apg-foto">${fotoDron(o.modelo, Number(o.num.slice(-3)))}</div><div><b>${o.num} · ${modeloTxt(o.modelo)}</b><small>${esc(nomCli(o.cli))} · responsable ${esc(nomUsuario(o.tec))} · ${ESTADOS_ORDEN[o.estado].t}</small></div>`
      : `<span class="ap-tipo">${ico(TIPOS_APROB[k].ico)}</span><div><b>${TIPOS_APROB[k].t}${as.length > 1 ? 's' : ''}</b><small>Sin orden de reparación</small></div>`;
    return `<section class="ap-grupo ${urg ? 'urg' : ''}"><div class="apg-cab">${cab}${puede && as.length > 1 ? `<button class="btn btn-verde btn-sm" onclick="aprobarTodo('${k}')">${ico('check')} Aprobar todo (${as.length})</button>` : ''}</div>
      <div class="apg-cuerpo">${as.map(a => filaBandeja(a, puede)).join('')}</div></section>`;
  }).join('');
}
function filaBandeja(a, puede){
  const [t, det] = descAprobacion(a), min = Math.round((Date.now() - (() => { const d = aFecha(a.f); const [h, m] = a.h.split(':'); d.setHours(h, m); return d; })()) / 60000);
  const espera = min >= D().config.recordatorioMin * 2 ? `<span class="espera larga">Espera ${haceCuanto(a.f, a.h).replace('hace ', '')} · ya se le avisó a Claudio</span>` : min >= D().config.recordatorioMin ? `<span class="espera larga">Espera ${haceCuanto(a.f, a.h).replace('hace ', '')} · se volvió a avisar</span>` : `<span class="espera">${haceCuanto(a.f, a.h)}</span>`;
  const editable = puede && ['retiro', 'devolucion', 'venta'].includes(a.tipo) && a.items;
  return `<div class="ap-fila ${a.urgente ? 'urgente' : ''}" id="ap-${a.id}">
    <span class="ap-tipo">${ico(TIPOS_APROB[a.tipo].ico)}</span>
    <div class="ap-txt"><div class="ap-t">${a.urgente ? `<span class="chip c-rojo">${ico('urgente')}Urgente</span>` : ''}<span>${t}</span></div>
      <div class="ap-det">${det}</div>
      <div class="ap-cuando">${TIPOS_APROB[a.tipo].t} · ${espera}${a.txt && !['pase', 'ajuste'].includes(a.tipo) ? ' · «' + esc(a.txt) + '»' : ''}${(a.vistoBueno || []).length && a.tipo !== 'presupuesto' ? ' · visto bueno de ' + a.vistoBueno.map(nomUsuario).join(' y ') : ''}</div></div>
    ${puede ? `<div class="ap-acc">${editable ? `<button class="btn btn-fantasma btn-sm" onclick="aprobarConCambios('${a.id}')">${ico('editar')} Con cambios</button>` : ''}${a.tipo === 'presupuesto' ? `<button class="btn btn-fantasma btn-sm" onclick="abrirPresupuesto('${a.presupuesto}')">${ico('ojo')} Ver</button>` : ''}
      <button class="btn btn-linea btn-sm" onclick="rechazar('${a.id}')">Rechazar</button><button class="btn btn-verde btn-sm" onclick="aprobar('${a.id}')">${ico('check')} Aprobar</button></div>` : `<div class="ap-acc"><span class="chip c-ambar">Le toca a ${a.tipo === 'pase' || a.tipo === 'ajuste' ? 'Claudio' : 'otro'}</span></div>`}
  </div>`;
}
function aprobarTodo(k){
  const l = aprobacionesPendientes().filter(a => (a.orden || a.tipo) === k);
  l.forEach((a, i) => setTimeout(() => aprobar(a.id), i * 120));
}
// Aprobar con cambios (por ejemplo, otra cantidad)
function aprobarConCambios(id){
  const a = D().aprobaciones.find(x => x.id === id);
  const items = a.items || D().ventas.find(v => v.id === a.venta).items;
  abrirModal({ titulo:'Aprobar con cambios', sub:`${TIPOS_APROB[a.tipo].t} de ${esc(nomUsuario(a.u))} · cambiá lo que haga falta`,
    cuerpo:`<div class="ped-items">${items.map((i, k) => { const p = producto(i.cod); return `<div class="ped-it"><span class="ap-tipo">${ico(icoCategoria(p.cat))}</span><div class="pi-t"><b>${esc(p.nombre)}</b><small class="num">${i.cod} · pidió ${i.cant} · hay ${p.stock}</small></div><input class="cant-edit" type="number" min="0" value="${i.cant}" data-k="${k}"></div>`; }).join('')}</div>
      <p class="ayuda mt-s">Poné 0 para sacar un repuesto. Quien lo pidió ve el cambio.</p>`,
    pie:`<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-verde" id="acc-ok">${ico('check')} Aprobar con estos cambios</button>`,
    alAbrir:() => { $('#acc-ok').onclick = () => {
      const nuevos = items.map((i, k) => ({ cod:i.cod, cant:Math.max(0, Number($(`.cant-edit[data-k="${k}"]`).value) || 0), precio:i.precio }));
      cerrarModal();
      if (a.tipo === 'venta'){ const vt = D().ventas.find(v => v.id === a.venta); vt.items = nuevos.filter(i => i.cant > 0); aprobar(id); }
      else aprobar(id, nuevos);
    }; } });
}
function resueltas(l){
  return tabla([
    { t:'Pedido', k:a => { const [t] = descAprobacion(a); return `<div class="celda-p"><span class="ap-tipo">${ico(TIPOS_APROB[a.tipo].ico)}</span><span><b>${TIPOS_APROB[a.tipo].t}</b><small>${t.replace(/<[^>]+>/g, '')}</small></span></div>`; } },
    { t:'Pidió', k:a => esc(nomUsuario(a.u)) },
    { t:'Resultado', k:a => a.est === 'aprobado' ? chip(a.pedido ? 'Aprobado con cambios' : 'Aprobado', 'verde', 'check') : chip('Rechazado' + (a.motivo ? ': ' + a.motivo : ''), 'rojo', 'x') },
    { t:'Resolvió', k:a => esc(nomUsuario(a.resolvio)) },
    { t:'Cuándo', k:a => `<span class="num peq">${fCorta(a.fRes || a.f)} ${a.hRes || ''}</span>` },
    { t:'', k:a => a.tipo === 'retiro' && a.est === 'aprobado' && a.orden ? `<button class="btn btn-fantasma btn-sm" onclick="valeRetiro('${a.id}')">${ico('imprimir')} Vale</button>` : '', cls:'der' }
  ], l);
}


/* ===== js/17-stock.js ===== */
/* =====================================================================
   STOCK Y CÓDIGOS
   Mismo código de Dragur (T50P044); los usados con la letra U (T50P044-U).
   Stock mínimo (amarillo) y crítico (rojo), movimientos con exportación a
   Excel y generador de códigos de barras para imprimir etiquetas.
   ===================================================================== */
const STK = { vista:'productos', q:'', cat:'', filtro:'todos', mov:'todos', selEt:[], ver:60 };
RENDER.stock = v => {
  const l = D().productos.filter(p => !p.inactivo), bajo = stockBajo();
  v.innerHTML = `${enc('Stock', `${l.filter(p => !p.usado).length} productos nuevos y ${l.filter(p => p.usado).length} usados · <b class="txt-rojo">${bajo.filter(p => estadoStock(p).k === 'critico').length} en crítico</b> · ${bajo.filter(p => estadoStock(p).k === 'minimo').length} en mínimo`,
      `${esJefe() ? `<button class="btn btn-linea" onclick="ajusteStock()">${ico('ajuste')} Ajuste manual</button><button class="btn btn-prim" onclick="editarProducto()">${ico('mas')} Alta de producto</button>` : ''}`)}
    ${pestanas([['productos', 'Productos', l.length], ['movimientos', 'Movimientos'], ['etiquetas', 'Etiquetas']], STK.vista, 'stkVista')}
    <div id="stk-cuerpo">${STK.vista === 'productos' ? listaProductos(l) : STK.vista === 'movimientos' ? listaMovs() : etiquetas()}</div>`;
  if (STK.vista === 'etiquetas') dibujarEtiquetas();
};
function stkVista(k){ STK.vista = k; ir('stock', true, true); }
const CATEGORIAS = () => [...new Set(D().productos.map(p => p.cat).concat(D().config.categoriasExtra || []))].sort((a, b) => a.localeCompare(b, 'es'));

function listaProductos(l){
  const s = sinTildes(STK.q);
  const f = l.filter(p => (!s || sinTildes(p.cod + ' ' + p.nombre + ' ' + p.modelos.join(' ')).includes(s)) && (!STK.cat || p.cat === STK.cat)
    && (STK.filtro === 'todos' || STK.filtro === 'nuevos' && !p.usado || STK.filtro === 'usados' && p.usado || estadoStock(p).k === STK.filtro))
    .sort((a, b) => (estadoStock(a).k === 'critico') - (estadoStock(b).k === 'critico') ? -1 : 0).sort((a, b) => { const o = { critico:0, minimo:1, ok:2 }; return o[estadoStock(a).k] - o[estadoStock(b).k] || a.cod.localeCompare(b.cod); });
  const n = k => l.filter(p => estadoStock(p).k === k).length;
  return `<div class="barra-filtros">${buscadorLocal('stk-q', STK.q, 'Buscar código, nombre o modelo…', 'stkBuscar')}
      <select class="filtro" onchange="STK.cat=this.value;ir('stock',true,true)"><option value="">Todas las categorías</option>${CATEGORIAS().map(c => `<option ${STK.cat === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
      <div class="der"><button class="btn btn-linea btn-sm" onclick="exportarStock()">${ico('descargar')} Excel</button></div></div>
    <div class="barra-filtros">${pildoras([['todos', 'Todos', l.length], ['nuevos', 'Nuevos'], ['usados', 'Usados', l.filter(p => p.usado).length], ['critico', 'Crítico', n('critico'), 'rojo'], ['minimo', 'Mínimo', n('minimo'), 'ambar']], STK.filtro, 'stkFiltro')}</div>
    ${tabla([
      { t:'Producto', k:p => `<div class="celda-p"><span class="ap-tipo ${p.foto ? 'con-foto' : ''}">${imgArticulo(p)}</span><span><b>${esc(p.nombre)}</b><small class="num">${p.cod}${p.modelos.length ? ' · ' + p.modelos.join(', ') : ''}</small></span></div>` },
      { t:'Categoría', k:p => `<span class="peq">${esc(p.cat)}</span>` },
      { t:'Ubicación', k:p => `<span class="num peq">${esc(p.ubic)}</span>` },
      { t:'Stock', k:p => { const e = estadoStock(p); return `<span class="chip c-${e.c}"><b class="num">${p.stock}</b>${e.k !== 'ok' ? ' · ' + e.t.toLowerCase() : ''}</span>`; }, cls:'cen' },
      { t:'Mín. / crít.', k:p => p.usado ? '<span class="sutil">—</span>' : `<span class="num peq">${p.min} / ${p.crit}</span>`, cls:'cen' },
      { t:'Precio final', k:p => `<b class="num">${usd(p.precio)}</b>`, cls:'der' },
      verCostos() ? { t:'Costo', k:p => `<span class="num peq">${p.costo ? usd(p.costo) : '—'}</span>`, cls:'der' } : null

/* =====================================================================

   Se escanea un producto y aparece al instante, en grande, el precio final

function consultar(cod){
