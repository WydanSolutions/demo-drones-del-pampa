.rec-resumen small{display:block;font-size:12px;color:var(--texto-3);font-weight:600}
.rec-resumen b{font-size:14.5px}
.rec-resumen .ancho{grid-column:1/-1}
.conforme{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1.5px solid var(--borde);cursor:pointer;font-weight:500}
.conforme input{display:none}
.conforme>span{width:28px;height:28px;border-radius:8px;border:2px solid var(--borde);display:inline-flex;align-items:center;justify-content:center;color:transparent;flex-shrink:0}
.conforme.on{border-color:var(--verde);background:var(--tinte-verde)}
.conforme.on>span{background:var(--verde);border-color:var(--verde);color:#fff}
.rec-listo{max-width:640px;margin:20px auto;text-align:center;padding:36px 28px}
.rec-listo .tilde{width:84px;height:84px;margin-bottom:8px}
.rec-listo h2{font-size:26px;color:var(--azul)}
.rec-listo p{color:var(--texto-2);margin:8px 0 22px;line-height:1.6}
.rl-acc{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- Tablero ---------- */
.tablero{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity}
.col{background:var(--borde-2);border-radius:16px;padding:10px;min-height:300px;scroll-snap-align:start;transition:background .15s, box-shadow .15s}
html[data-tema="oscuro"] .col{background:#121A28}
.col.sobre{background:var(--tinte);box-shadow:inset 0 0 0 2px var(--cielo)}
.col-cab{display:flex;align-items:center;gap:8px;padding:4px 4px 10px;font-size:13px}
.col-cab b{flex:1}
.col-c{width:10px;height:10px;border-radius:3px;background:currentColor}
.col-lista{display:flex;flex-direction:column;gap:8px}
.col-vacia{border:1.5px dashed var(--borde);border-radius:12px;padding:18px;text-align:center;font-size:12px;color:var(--texto-3)}
.t-ord{display:grid;grid-template-columns:64px minmax(0,1fr);background:var(--carta);border-radius:12px;box-shadow:var(--s1);overflow:hidden;cursor:pointer;border:1px solid transparent;transition:box-shadow .15s, transform .15s}
.t-ord:hover{box-shadow:var(--s2);transform:translateY(-1px)}
.t-ord.atr{border-left:3px solid var(--rojo)}
.t-ord.arrastrando{opacity:.4}
.t-ord.llega{animation:llega .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes llega{from{opacity:0;transform:translateX(-24px) scale(.96)}to{opacity:1;transform:none}}
.to-foto{position:relative}.to-foto .foto-dron{position:absolute;inset:0;width:100%;height:100%}
.to-txt{padding:8px 10px;min-width:0;display:flex;flex-direction:column;gap:1px}
.to-top{display:flex;justify-content:space-between;font-size:12px;color:var(--texto-3)}
.to-top b{color:var(--azul)}
.to-d.rojo{color:var(--rojo-t);font-weight:700}
.to-m{font-size:13.5px}
.to-c{font-size:12px;color:var(--texto-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.to-pie{display:flex;gap:4px;align-items:center;margin-top:4px}
.to-pie .chip{height:20px;padding:0 5px}
.mini-foto{position:relative;width:52px;height:40px;border-radius:8px;overflow:hidden;flex-shrink:0}.mini-foto .foto-dron{position:absolute;inset:0;width:100%;height:100%}
.ayuda-sec{font-size:13.5px;color:var(--texto-2);display:flex;gap:6px;align-items:flex-start;margin-bottom:14px;max-width:760px}
.gar-lista{display:flex;flex-direction:column}
.gar-fila{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto auto;gap:14px;align-items:center;padding:10px 6px;border-top:1px solid var(--borde-2);text-align:left;border-radius:10px}
.gar-fila:hover{background:var(--fondo)}
.gar-ico{width:40px;height:40px;border-radius:12px;background:var(--violeta-f);color:var(--violeta-t);display:inline-flex;align-items:center;justify-content:center}
.gar-ico.con{background:var(--ok-f);color:var(--ok-t)}.gar-ico.sin{background:var(--rojo-f);color:var(--rojo-t)}
.gar-t{min-width:0}.gar-t b{display:block;font-size:14px}.gar-t small{display:block;font-size:12.5px;color:var(--texto-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gar-caso{font-size:12.5px;color:var(--texto-2)}
.gar-d{display:flex;flex-direction:column;align-items:center;line-height:1}.gar-d b{font-family:var(--f-titulo);font-size:18px;color:var(--violeta-t)}.gar-d small{font-size:10px}

/* ---------- Ficha de la orden ---------- */
.volver-link{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:600;color:var(--cielo);margin-bottom:12px}
.ord-cab{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--carta);border:1px solid var(--borde-2);border-radius:var(--r-l);padding:16px;box-shadow:var(--s1)}
.oc-foto{position:relative;height:96px;border-radius:12px;overflow:hidden}.oc-foto .foto-dron{position:absolute;inset:0;width:100%;height:100%}
.oc-pre{font-size:12.5px;color:var(--texto-3)}
.oc-txt h1{font-size:24px;color:var(--azul)}
.oc-cli{display:flex;align-items:center;gap:6px;font-size:14.5px;color:var(--texto-2)}
.oc-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.oc-resp{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--fondo)}
.oc-resp small{display:block;font-size:11.5px;color:var(--texto-3)}.oc-resp b{display:block}
.ord-acc{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.ord-acc .btn-verde{margin-left:auto}
.mas-caja{position:relative}
.mas-menu{position:absolute;left:0;top:calc(100% + 6px);z-index:40;min-width:250px;background:var(--carta);border:1px solid var(--borde-2);border-radius:14px;box-shadow:var(--s3);padding:6px;animation:subeModal .15s ease}
.mas-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;font-size:14px;text-align:left}
.mas-menu button:hover{background:var(--fondo)}
.mas-menu button:disabled{opacity:.4;cursor:not-allowed}
.ord-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start;margin-top:14px}
.ord-lado{display:flex;flex-direction:column;gap:12px}
.lado-t{font-size:13px;color:var(--texto-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;font-family:var(--f-texto)}
.sint{display:flex;gap:6px;font-size:14px;font-weight:500}.sint .ico{color:var(--ambar);margin-top:2px}
.chk-l{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.chk-l span{background:var(--fondo);border-radius:10px;padding:6px 10px}
.chk-l small{display:block;font-size:11px;color:var(--texto-3)}.chk-l b{font-size:13px}
.ord-lado .foto-m{width:78px;height:58px}
.ord-tot{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;margin-top:12px;border-radius:12px;background:var(--fondo);font-size:14px;color:var(--texto-2)}
.ord-tot b{font-family:var(--f-titulo);font-size:18px;color:var(--texto)}
.ord-tot small{font-size:12px;color:var(--texto-3);font-family:var(--f-texto);font-weight:500}
.ord-extra{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12.5px}
.aviso-linea.ambar{background:var(--ambar-f);color:var(--ambar-t);margin:12px 0 0}
.reloj-caja{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px;border-radius:16px;background:var(--carta);border:1px solid var(--borde-2);margin-bottom:14px;box-shadow:var(--s1)}
.reloj-caja.corriendo{border-color:var(--verde);box-shadow:0 0 0 4px rgba(109,183,46,.15)}
.rj-t small{display:block;font-size:12.5px;color:var(--texto-3)}
.rj-t b{font-family:var(--f-titulo);font-size:34px;font-weight:600;letter-spacing:.02em}
.corriendo .rj-t b{color:var(--hoja)}
.rj-b{display:flex;gap:8px;flex-wrap:wrap}
.gar-est{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;background:var(--violeta-f);color:var(--violeta-t)}
.gar-est.con{background:var(--ok-f);color:var(--ok-t)}.gar-est.sin{background:var(--rojo-f);color:var(--rojo-t)}
.gar-est b{display:block;font-size:15px}.gar-est small{color:var(--texto-2)}
.ped-sug{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.ped-sug button{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--borde);font-size:12.5px;background:var(--carta)}
.ped-sug button .ico{width:15px;height:15px;color:var(--azul)}
.ped-items{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ped-it{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:14px;border:1px solid var(--borde-2);background:var(--fondo)}
.pi-t b{display:block;font-size:14px}.pi-t small{display:block;font-size:12px;color:var(--texto-3)}
.seg.mini{margin-top:6px}.seg.mini button{height:26px;font-size:12px;padding:0 10px}
.urg-tgl{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--rojo-t)}

/* ---------- Aprobaciones ---------- */
.ap-grupo{background:var(--carta);border:1px solid var(--borde-2);border-radius:var(--r-l);box-shadow:var(--s1);margin-bottom:14px;overflow:hidden}
.ap-grupo.urg{border-color:#F3C6C6;box-shadow:0 0 0 3px rgba(214,69,69,.1)}
.apg-cab{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;background:var(--fondo);border-bottom:1px solid var(--borde-2)}
.apg-foto{position:relative;width:64px;height:48px;border-radius:10px;overflow:hidden}.apg-foto .foto-dron{position:absolute;inset:0;width:100%;height:100%}
.apg-cab b{display:block;font-size:15px}.apg-cab small{font-size:12.5px;color:var(--texto-2)}
.apg-cuerpo{padding:0 16px}
.apg-cuerpo .ap-fila:first-child{border-top:none}
.cant-edit{width:64px;height:32px;border-radius:8px;border:1px solid var(--borde);text-align:center;font-weight:700;background:var(--carta)}
.espera{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--gris-e-f);color:var(--texto-2)}
.espera.larga{background:var(--rojo-f);color:var(--rojo-t)}

/* ---------- Celular ---------- */
body.cel .rec{grid-template-columns:1fr}
body.cel .rec-pasos{display:none}
body.cel .rec-caja{padding:16px;border-radius:20px}
body.cel .rec-pie{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));background:var(--carta);margin:20px -16px -16px;padding:12px 16px;border-radius:0 0 20px 20px;z-index:5}
body.cel .rec-pie .btn{flex:1;min-width:0}
body.cel .rec-sig{min-width:0}
body.cel .rb-g{grid-template-columns:1fr}
body.cel .rl-acc{grid-template-columns:1fr}
body.cel .enc-acc{flex-wrap:wrap}
body.cel .tablero{grid-auto-columns:82vw}
body.cel .ord-cab{grid-template-columns:84px minmax(0,1fr)}
body.cel .oc-foto{height:72px}
body.cel .oc-resp{grid-column:1/-1}
body.cel .oc-txt h1{font-size:20px}
body.cel .ord-grid{grid-template-columns:1fr}
body.cel .ord-acc .btn-verde{margin-left:0;width:100%}
body.cel .gar-fila{grid-template-columns:40px minmax(0,1fr) auto}
body.cel .gar-caso{display:none}
body.cel .apg-cab{grid-template-columns:56px minmax(0,1fr)}
body.cel .apg-cab .btn{grid-column:1/-1}
body.cel .reloj-caja .rj-b{width:100%}
body.cel .reloj-caja .rj-b .btn{flex:1}
.opc.opc-mas{border-style:dashed;color:var(--cielo);flex:0 1 auto}


/* ===== css/07-stock-ventas.css ===== */
/* =====================================================================
   STOCK · ETIQUETAS · CONSULTA DE PRECIOS · VENTAS · PRESUPUESTOS
   ===================================================================== */
.txt-verde{color:var(--ok-t)}
.pf-grid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start;margin-bottom:10px}
.pf-cod{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px;border:1px solid var(--borde-2);border-radius:14px;background:#fff}
.pf-cod svg{width:100%;height:auto}
.pf-cod small{font-size:11.5px;color:#8A94A6}
.pf-res{margin:0}
.chk-m{display:inline-flex;align-items:center}
.chk-m input{display:none}
.chk-m span{min-height:38px;padding:0 12px;border-radius:999px;border:1.5px solid var(--borde);display:inline-flex;align-items:center;font-size:13.5px;cursor:pointer}
.chk-m input:checked + span{border-color:var(--azul);background:var(--tinte);color:var(--azul);font-weight:600}
.frases .chk-mas{min-height:38px;padding:0 12px;border-radius:999px;border:1.5px dashed var(--borde);background:none;display:inline-flex;align-items:center;gap:4px;font-size:13.5px;color:var(--azul);font-weight:600;cursor:pointer}
.et-grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;align-items:start}
.et-rap{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.et-sel{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.et-sel .chip button{display:inline-flex;margin-left:2px;opacity:.6}
.etiquetas{display:flex;flex-wrap:wrap;gap:10px}
.etq{width:220px;height:122px;border-radius:10px;background:#fff;border:1px dashed #C9D2E0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px;color:#1B2433;box-shadow:var(--s1)}
.etq b{font-size:12px;text-align:center;line-height:1.2;max-height:2.4em;overflow:hidden}
.etq svg{width:100%;height:62px}
.etq small{font-size:10.5px;color:#5B6678}

/* ---------- Tablet de consulta de precios ---------- */
.cons{min-height:calc(100vh - 140px);display:flex;flex-direction:column;gap:18px;max-width:1100px;margin:0 auto}
.cons-cab{display:flex;align-items:center;justify-content:space-between}
.cons-cab .logo-dp{height:64px;width:auto}
.cons-acc{display:flex;gap:8px;align-items:center}
.cons-bus .fila-in input{height:64px;font-size:20px;border-radius:16px}
.cons-bus .btn-xl{height:64px}
.cons-res{flex:1;display:flex}
.cons-vacio{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;background:var(--carta);border:1px solid var(--borde-2);border-radius:28px;padding:40px;box-shadow:var(--s1)}
.cv-anim{position:relative;width:140px;height:140px;border-radius:32px;background:var(--tinte);color:var(--azul);display:flex;align-items:center;justify-content:center;margin-bottom:10px;overflow:hidden}
.cv-anim .ico{width:72px;height:72px}
.cv-anim i{position:absolute;left:14px;right:14px;height:3px;background:#7CF24A;box-shadow:0 0 14px 3px rgba(124,242,74,.7);animation:laser 1.6s ease-in-out infinite alternate}
.cons-vacio h2{font-size:28px;color:var(--azul)}
.cons-vacio p{color:var(--texto-2);font-size:17px}
.cons-ficha{flex:1;position:relative;display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;align-items:center;background:var(--carta);border:1px solid var(--borde-2);border-radius:28px;padding:40px;box-shadow:var(--s2);animation:subeModal .3s ease}
.cf-foto{width:260px;height:260px;border-radius:28px;background:linear-gradient(150deg,var(--tinte),var(--tinte-verde));display:flex;align-items:center;justify-content:center;color:var(--azul)}
.cf-foto .ico{width:120px;height:120px;stroke-width:1.2}
.cf-txt small{font-size:15px;color:var(--texto-3);font-weight:600}
.cf-txt h2{font-size:34px;line-height:1.15;margin:4px 0 16px}
.cf-precio b{display:block;font-family:var(--f-titulo);font-size:76px;font-weight:700;color:var(--azul);line-height:1;letter-spacing:-.02em}
.cf-precio span{font-size:16px;color:var(--texto-3)}
.cf-disp{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:10px 18px;border-radius:999px;background:var(--ok-f);color:var(--ok-t);font-size:20px;font-weight:600}
.cf-disp b{font-size:26px}
.cf-disp span{color:var(--texto-2);font-weight:500;font-size:16px}
.cf-disp.sin{background:var(--rojo-f);color:var(--rojo-t)}
.cf-usado{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px;padding:12px 18px;border-radius:16px;border:1.5px dashed var(--borde);font-size:17px}
.cf-usado b.num{font-family:var(--f-titulo);font-size:26px;color:var(--hoja)}
.cf-mod{margin-top:14px;color:var(--texto-2)}
.cf-otra{position:absolute;right:20px;top:20px}
.cons-pie{text-align:center;font-size:12.5px;color:var(--texto-3)}
body[data-tipo="consulta"] .lateral,body[data-tipo="consulta"] .tope,body[data-tipo="consulta"] .barra-cel,body[data-tipo="consulta"] .franja{display:none!important}
body[data-tipo="consulta"] .principal{margin-left:0;padding:24px}

/* ---------- Ventas y presupuestos ---------- */
.venta{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.v-items{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.v-it{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto 32px;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;border:1px solid var(--borde-2);background:var(--carta);animation:vistaEntra .25s ease}
.v-it .ap-tipo{width:40px;height:40px}
.v-it b.num{font-size:15px}
.v-res{position:sticky;top:90px}
.v-tot{display:flex;flex-direction:column;gap:8px;margin:14px 0;padding:14px;border-radius:14px;background:var(--fondo)}
.v-tot div{display:flex;justify-content:space-between;font-size:14px;color:var(--texto-2)}
.v-tot .gran{font-size:16px;color:var(--texto);padding-top:8px;border-top:1px solid var(--borde)}
.v-tot .gran b{font-family:var(--f-titulo);font-size:26px;color:var(--azul)}
.lin-tipo{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pr-lineas .v-it{grid-template-columns:40px minmax(0,1fr) 90px 110px auto 32px}
.pr-lineas input{height:38px;border:1px solid var(--borde);border-radius:9px;padding:0 10px;width:100%;background:var(--carta);font-size:14px}
.leyenda{font-size:13px;font-weight:700;color:var(--ambar-t);background:var(--ambar-f);padding:6px 12px;border-radius:8px;display:inline-block}
.circuito{display:flex;gap:0;align-items:center;margin:4px 0 16px;flex-wrap:wrap}
.circuito span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--texto-3);padding:6px 10px;border-radius:999px}
.circuito span.on{background:var(--tinte);color:var(--azul)}
.circuito span.hecho{color:var(--ok-t)}
.circuito i{width:18px;height:2px;background:var(--borde)}

body.cel .pf-grid,body.cel .et-grid,body.cel .venta{grid-template-columns:1fr}
body.cel .cons-ficha{grid-template-columns:1fr;padding:24px;text-align:center}
body.cel .cf-foto{width:140px;height:140px;margin:0 auto}
body.cel .cf-precio b{font-size:52px}
body.cel .cf-otra{position:static}
body.cel .v-it{grid-template-columns:36px minmax(0,1fr) auto;}
body.cel .v-it>:nth-child(4){grid-column:2}
body.cel .pr-lineas .v-it{grid-template-columns:36px minmax(0,1fr) auto}
body.cel .v-res{position:static}
.pr-acc{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.pr-acc .btn{width:100%}
.campo-q{width:100%;height:46px;padding:0 14px;border:1.5px dashed #B9CBEA;border-radius:12px;background:var(--tinte);font-size:15px}
.campo-q:focus{outline:none;border-style:solid;border-color:var(--cielo);background:var(--carta)}
.ok-t{color:var(--ok-t)}
.avatar{flex:none!important}
@media (max-width:1200px){.venta{grid-template-columns:1fr}.v-res{position:static}}


/* ===== css/08-admin.css ===== */
/* =====================================================================
   BATERÍAS · PEDIDOS A DRAGUR · FACTURACIÓN · CLIENTES · EQUIPO · ACTIVIDAD
   ===================================================================== */
.tag-d{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--fondo);border:1px solid var(--borde-2);color:var(--texto-2);margin:1px 0;white-space:nowrap}
.txt-violeta{color:var(--violeta-t)}
.ficha-mini.reing{background:var(--violeta-f);border-color:rgba(123,92,196,.3);color:var(--violeta-t)}
.est-bat{display:flex;flex-wrap:wrap;gap:8px}
.est-bat button{min-height:44px;padding:0 14px;border-radius:12px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;border:1.5px solid transparent;opacity:.6}
.est-bat button.on{opacity:1;border-color:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 15%,transparent)}
.est-bat button:not(:disabled):hover{opacity:1}
.etq-bat{display:flex;gap:16px;align-items:center;padding:16px;border:1.5px dashed var(--borde);border-radius:14px;background:#fff;color:#1B2433;max-width:380px;margin:0 auto}
.eb-qr svg{width:120px;height:120px;display:block}
.etq-bat b,.etq-bat span,.etq-bat small{display:block}.etq-bat b{font-size:15px}.etq-bat span{font-size:13px}.etq-bat small{font-size:12px;color:#5B6678;margin-top:4px}
.barras-v{display:flex;align-items:flex-end;gap:10px;height:200px;padding-top:24px;overflow-x:auto}
.barras-v>div{flex:1;min-width:38px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;position:relative}
.barras-v i{display:block;width:70%;max-width:42px;height:var(--h);min-height:4px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--cielo),var(--azul));animation:creceV .8s cubic-bezier(.2,.8,.3,1) both}
@keyframes creceV{from{height:0}}
.barras-v b{font-size:12px}
.barras-v small{font-size:11px;color:var(--texto-3)}
.barras-v em{position:absolute;top:-2px;font-style:normal;font-size:10.5px;color:var(--ok-t);font-weight:700}

/* Pedidos a Dragur */
.pd-cab{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px}
.pd-cab b{display:block;font-size:16px}.pd-cab small{color:var(--texto-2);font-size:13px}
.pd-btns{display:flex;gap:8px;flex-wrap:wrap}
.pd-fact{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;margin-bottom:14px}
.pd-fact>.ico{color:var(--azul);width:26px;height:26px}
.pd-fact .campo{min-width:220px}
.rc-in{display:inline-flex;align-items:center;gap:2px}
.rc-in input,.cant-edit{width:64px;height:36px;border:1px solid var(--borde);border-radius:9px;text-align:center;font-weight:700;background:var(--carta)}
.cant-edit.ancho{width:90px}
.obs-in{width:100%;min-width:140px;height:34px;border:1px solid var(--borde);border-radius:9px;padding:0 10px;font-size:13px;background:var(--carta)}
.fotos.mini{margin-top:6px}.fotos.mini .foto-m,.fotos.mini .foto-btn{width:54px;height:42px}
.fotos.mini .foto-btn .ico{width:18px;height:18px}
.pd-pie{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;align-items:center;margin-top:14px}

/* Facturación */
.fac-fila{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--borde-2)}
.ff-t b{display:block;font-size:14px}.ff-t small{font-size:12.5px;color:var(--texto-2)}
.ff-acc{display:flex;gap:6px}
.subir{display:flex;flex-direction:column;align-items:center}
.zona{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:34px 20px;border:2px dashed #B9CBEA;border-radius:18px;background:var(--tinte);color:var(--azul);cursor:pointer;text-align:center}
.zona:hover{border-color:var(--cielo)}
.zona input{display:none}
.zona small{color:var(--texto-2)}
.fac-sub{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;align-items:start}
.fs-prev{border:1px solid var(--borde-2);border-radius:12px;overflow:hidden;background:#525659;max-height:420px;overflow-y:auto}
.fs-prev canvas,.fac-visor canvas{display:block;width:100%;height:auto;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.fac-visor{flex:1;overflow:auto;background:#525659;border-radius:12px;padding:14px}
.fac-visor canvas{max-width:780px;margin:0 auto 12px}
.drive{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--fondo);border:1px solid var(--borde-2)}
.drive .ico{color:#1FA855;width:26px;height:26px}
.drive small{display:block;font-size:12px;color:var(--texto-3)}.drive b{font-size:13px;word-break:break-word}
.fac-bloque{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px;border-radius:14px;border:1px solid var(--borde-2);background:var(--fondo)}
.fac-bloque b{display:block}.fac-bloque small{display:block;font-size:12.5px;color:var(--texto-2)}

/* Clientes y drones */
.cli-cab{grid-template-columns:auto minmax(0,1fr) auto}
.cli-acc{display:flex;gap:8px;flex-wrap:wrap}
.oc-cli .ico{width:15px;height:15px;color:var(--texto-3)}
.sec-t{font-size:17px;margin:22px 0 12px;display:flex;align-items:center;gap:10px}
.hist-dron{display:flex;flex-direction:column;gap:8px}
.hd-it{display:grid;grid-template-columns:58px minmax(0,1fr) 20px;gap:14px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--carta);border:1px solid var(--borde-2);text-align:left;box-shadow:var(--s1)}
.hd-it:hover{box-shadow:var(--s2)}
.hd-f{display:flex;flex-direction:column;align-items:center;padding:8px 0;border-radius:12px;background:var(--tinte);color:var(--azul)}
.hd-f b{font-family:var(--f-titulo);font-size:16px}.hd-f small{font-size:11px}
.hd-t>div:first-child{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hd-t small{display:block;font-size:12.5px;color:var(--texto-2);margin-top:3px}

/* Equipo y actividad */
.personas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.personas button{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;border:1.5px solid var(--borde);background:var(--carta);font-weight:600;font-size:14px}
.personas button .ico{margin-left:8px;color:var(--azul)}
.personas button.on{border-color:var(--azul);background:var(--tinte);color:var(--azul)}
.ej-filtros{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.ej-filtros small{color:var(--texto-3);font-size:12.5px}
.ej-filtros button{font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--tinte);color:var(--azul);font-weight:600}

body.cel .fac-fila{grid-template-columns:36px minmax(0,1fr) auto}
body.cel .ff-acc{grid-column:1/-1;justify-content:flex-end}
body.cel .fac-sub{grid-template-columns:1fr}
body.cel .cli-cab{grid-template-columns:auto minmax(0,1fr)}
body.cel .cli-acc{grid-column:1/-1}
body.cel .pd-btns .btn{flex:1}


/* ===== css/09-espacio-config.css ===== */
/* =====================================================================
   MI ESPACIO (notas como papel, calendario, recordatorios, tareas)
   CONFIGURACIÓN (tarjetas por tema, interruptores, usuarios)
   ===================================================================== */
.me-res .res{text-align:left;cursor:pointer;transition:box-shadow var(--anim), transform var(--anim)}
.me-res .res:hover{box-shadow:var(--s2);transform:translateY(-1px)}
.me-res .res small{display:flex;align-items:center;gap:5px}
.me-res .res span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grupos{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.grupos button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--texto-2);background:var(--carta);border:1px solid var(--borde)}
.grupos button i{width:9px;height:9px;border-radius:50%;background:var(--gc)}
.grupos button span{font-size:11.5px;opacity:.7}
.grupos button.on{border-color:var(--gc,var(--azul));color:var(--texto);box-shadow:inset 0 0 0 1px var(--gc,var(--azul))}
/* Notas adhesivas: papel pastel, cinta arriba, leve inclinación que se endereza al pasar el mouse */
.notas{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:24px 18px;padding:12px 4px 6px}
.nota{position:relative;background:var(--nc);color:#3a3524;border-radius:3px 3px 10px 10px;padding:20px 14px 12px;min-height:150px;display:flex;flex-direction:column;gap:8px;
  box-shadow:0 3px 10px rgba(19,34,39,.10);transform:rotate(-1.2deg);transition:transform .18s ease, box-shadow .18s ease;animation:vistaEntra .35s ease both}
.nota:nth-child(3n+2){transform:rotate(1.1deg)}
.nota:nth-child(3n){transform:rotate(.4deg)}
.nota:hover,.nota:focus-within{transform:rotate(0) translateY(-4px);box-shadow:0 12px 26px rgba(19,34,39,.18);z-index:3}
.nota::before{content:'';position:absolute;top:-8px;left:50%;width:58px;height:17px;margin-left:-29px;transform:rotate(-3deg);background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.05);border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.nota.hecha{opacity:.72}
.nota.hecha .nota-txt{text-decoration:line-through;text-decoration-color:rgba(0,0,0,.35)}
.nota-acc{display:flex;justify-content:flex-end;gap:3px;margin:-8px -6px 0 0;opacity:.35;transition:opacity .15s}
.nota:hover .nota-acc,.nota:focus-within .nota-acc{opacity:1}
.nota-acc button{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.6);font-size:13px;color:rgba(0,0,0,.55);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.nota-acc button:hover{background:#fff;color:#000}
.nota-acc .nh{font-weight:800}.nota-acc .nh.on{color:#2E9E5B}
.nota-txt{font-size:14px;line-height:1.55;outline:none;flex:1;white-space:pre-wrap;word-break:break-word;cursor:text}
.nota-lista{display:flex;flex-direction:column;gap:5px;flex:1}
.nota-lista label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.4;cursor:pointer}
.nota-lista input{margin-top:3px;accent-color:#3F8A1F}
.nota-lista .ok{text-decoration:line-through;opacity:.6}
.nota-add{background:rgba(255,255,255,.45);border:none;border-radius:6px;padding:5px 8px;font-size:13px;color:#3a3524}
.nota-lnk{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.6);color:#0B3D9E}
.nota-pie{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nota-g{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.55);border-left:3px solid var(--gc)}
.nota-fecha{font-size:10.5px;color:rgba(0,0,0,.4);font-weight:700;letter-spacing:.3px}
.nota-sello{align-self:flex-start;font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#2E9E5B;border:1.5px solid #2E9E5B;border-radius:4px;padding:1px 6px;transform:rotate(-3deg)}
.notas-vacio{text-align:center;padding:30px;color:var(--texto-2)}
.flotante{position:fixed;z-index:960;display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px;background:var(--carta);border:1px solid var(--borde-2);border-radius:20px;box-shadow:var(--s3);animation:subeModal .15s ease;max-width:280px}
.nota-cols{display:flex;gap:9px;flex-wrap:wrap}
.ncol{width:28px;height:28px;border-radius:50%;border:2px solid rgba(0,0,0,.08);transition:transform .15s}
.ncol:hover{transform:scale(1.12)}
.ncol.on{border-color:var(--azul);box-shadow:0 0 0 3px rgba(11,61,158,.15)}
.gr-ops{flex-direction:column;gap:2px;border-radius:14px}
.gr-op{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:13.5px;text-align:left}
.gr-op:hover{background:var(--fondo)}.gr-op i{width:10px;height:10px;border-radius:50%}
/* Calendario */
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-tit{font-family:var(--f-titulo);font-size:17px;min-width:200px;text-align:center;text-transform:capitalize}
.cal-tipos{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px;font-size:13px;color:var(--texto-2)}
.cal-tipos label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.cal-tipos input{display:none}
.cal-tipos i{width:14px;height:14px;border-radius:4px;border:2px solid var(--ec)}
.cal-tipos input:checked + i{background:var(--ec)}
.cal-sem{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;font-size:12px;font-weight:600;color:var(--texto-3);text-align:center}
.cal-mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-d{min-height:104px;background:var(--carta);border:1px solid var(--borde-2);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:box-shadow .15s;overflow:hidden}
.cal-d:hover{box-shadow:var(--s2)}
.cal-d>b{font-size:13px;font-weight:600;color:var(--texto-2)}
.cal-d.hoy{border-color:var(--azul);box-shadow:inset 0 0 0 1px var(--azul)}
.cal-d.hoy>b{color:#fff;background:var(--azul);border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center}
.cal-d.fuera{opacity:.45}
.cal-d small{font-size:11px;color:var(--texto-3)}
.cal-e{font-size:11.5px;line-height:1.25;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--ec) 13%,transparent);border-left:3px solid var(--ec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-semana{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cal-semana .cal-d{min-height:320px}
.cs-cab{text-align:center;font-size:13px;color:var(--texto-2);margin-bottom:6px;text-transform:capitalize}
.cs-cab b{display:block;font-family:var(--f-titulo);font-size:20px;color:var(--texto)}
.cs-cab.hoy b{color:var(--azul)}
.cal-dia h3{text-transform:capitalize;margin-bottom:12px}
.cd-e{display:flex;gap:12px;align-items:center;width:100%;padding:10px;border-radius:12px;text-align:left;margin-bottom:6px;background:color-mix(in srgb,var(--ec) 9%,transparent)}
.cd-e i{width:6px;align-self:stretch;border-radius:3px;background:var(--ec)}
.cd-e b{display:block;font-size:14px}.cd-e small{font-size:12px;color:var(--texto-2)}

/* «Guardando en Drive…» */

.sube-drive .ico{color:var(--verde);width:44px;height:44px;animation:subeNube 1s ease-in-out infinite}

/* Tarjeta de Configuración */

/* ===== js/00-logos.js ===== */
/* =====================================================================
   LOGO DE DRONES DEL PAMPA, rehecho en SVG con capas separadas
   (letras · dron: cuerpo, brazo y cada hélice · la «o» con la espiga)
   Las coordenadas están MEDIDAS sobre el logo original (2000 × 986 px,
   logo-original.jpg): cada letra va en su lugar exacto (Poppins Bold, con
   el ancho ajustado letra por letra) y cada pieza del dron con sus medidas.
   Así se ve igual al original y la animación del ingreso puede mover cada
   pieza por separado.
   ===================================================================== */
const DP = {
  vbCompleto: '188 178 1572 712',   // recorte del logo entero
  vbIcono: '440 182 790 392'        // solo el dron con la espiga (íconos)
};
let _dpN = 0;

// Letras: [letra, x, ancho (escala horizontal)] sobre cada línea de base, Poppins 700.
const DP_LETRAS = [
  { t:'Drones', y:556, f:413, l:[['D',182.2,1.115],['r',522.4,.993],['n',972.3,.994],['e',1254.6,.993],['s',1514.8,1.02]] },
  { t:'Pampa',  y:806, f:310, l:[['P',525.7,1.15],['a',758.2,1],['m',977.5,1.005],['p',1314.2,1.021],['a',1537.2,1]] },
  { t:'del',    y:700, f:155, l:[['d',248,.989],['e',355,.989],['l',452.1,1.1]], verde:true }
];

// Hojas de la espiga: [x, y, giro, escala ancho, escala alto]. El orden es el orden en que
// «crecen» en la animación (de abajo hacia arriba).
const HOJA = 'M0 -40 C 24 -18 24 18 0 40 C -24 18 -24 -18 0 -40 Z';
const DP_HOJAS = [
  [833.5, 519, 0, 1.3, 1.05],                         // la de abajo, colgando
  [806, 462, 32, 1, 1], [861, 462, -32, 1, 1],        // par de abajo
  [806, 396, 32, 1, 1], [861, 396, -32, 1, 1]         // par de arriba
];

function dpDefs(id){
  return `<defs>
    <linearGradient id="${id}-az" gradientUnits="userSpaceOnUse" x1="200" y1="260" x2="1760" y2="860"><stop offset="0" stop-color="#0A3896"/><stop offset=".5" stop-color="#1D60B8"/><stop offset="1" stop-color="#0B3D9E"/></linearGradient>
    <linearGradient id="${id}-ve" gradientUnits="userSpaceOnUse" x1="560" y1="560" x2="1110" y2="190"><stop offset="0" stop-color="#3F8A1F"/><stop offset=".55" stop-color="#5CA829"/><stop offset="1" stop-color="#78C437"/></linearGradient>
    <radialGradient id="${id}-cu" gradientUnits="userSpaceOnUse" cx="862" cy="235" r="120"><stop offset="0" stop-color="#8ED64C"/><stop offset="1" stop-color="#55A126"/></radialGradient>
    <linearGradient id="${id}-de" gradientUnits="userSpaceOnUse" x1="250" y1="700" x2="505" y2="585"><stop offset="0" stop-color="#3F8A1F"/><stop offset="1" stop-color="#6DB72E"/></linearGradient>
    <filter id="${id}-bl" x="-10%" y="-400%" width="120%" height="900%"><feGaussianBlur stdDeviation="5 2.5"/></filter>
  </defs>`;
}

// El dron (lo que despega): hélices, postes, brazo y cuerpo. Cada hélice tiene su «disco»
// difuminado (oculto) que aparece cuando gira.
function dpDron(id){
  const helice = (cx, mitad, lado) => `<g class="dp-helice dp-helice-${lado}" style="transform-box:view-box;transform-origin:${cx}px 215px">
      <ellipse class="dp-disco" cx="${cx}" cy="215" rx="${mitad + 8}" ry="12" fill="#6DB72E" opacity="0" filter="url(#${id}-bl)"/>
      <path class="dp-pala" d="M${cx - mitad} 215 Q${cx} 199 ${cx + mitad} 215 Q${cx} 231 ${cx - mitad} 215 Z"/>
    </g>`;
  return `<g class="dp-dron" fill="url(#${id}-ve)">
    ${helice(572.5, 117.5, 'izq')}${helice(1095.5, 119.5, 'der')}
    <rect x="561" y="201" width="18" height="60" rx="3"/>
    <rect x="1087" y="201" width="18" height="60" rx="3"/>
    <rect x="547" y="254" width="571" height="24" rx="3"/>
    <path class="dp-cuerpo" fill="url(#${id}-cu)" d="M736 300 C736 236 776 201 834 201 C892 201 932 236 932 300 L921 318 Q834 342 747 318 Z"/>
  </g>`;
}

// La «o»: el anillo verde (grueso arriba, se afina hacia abajo y queda abierto) y la espiga adentro.
function dpO(id){
  return `<g class="dp-o" fill="url(#${id}-ve)">
    <path class="dp-anillo" d="M760.3 512 A121.5 121.5 0 1 1 906.7 512 L893.1 512 A93.5 93.5 0 1 0 773.9 512 Z"/>
    <g class="dp-espiga">
      ${DP_HOJAS.map(([x, y, g, sx, sy], i) => `<g transform="translate(${x} ${y}) rotate(${g})"><g class="dp-hoja" data-i="${i}"><path d="${HOJA}" transform="scale(${sx} ${sy})"/></g></g>`).join('')}
    </g>
  </g>`;
}

function dpLetras(id){
  return `<g class="dp-letras" font-family="Poppins, 'Segoe UI', sans-serif" font-weight="700">` +
    DP_LETRAS.map(p => `<g class="dp-${p.t.toLowerCase()}" fill="url(#${id}-${p.verde ? 'de' : 'az'})" font-size="${p.f}">` +
      p.l.map(([c, x, s]) => `<text transform="translate(${x} ${p.y}) scale(${s} 1)">${c}</text>`).join('') + '</g>').join('') +
    '</g>';
}

// Logo completo. o.vb: viewBox (por defecto, el recorte del logo); o.cls: clases extra.
function logoDP(o){
  o = o || {}; const id = 'dp' + (++_dpN);
  return `<svg class="logo-dp ${o.cls || ''}" viewBox="${o.vb || DP.vbCompleto}" role="img" aria-label="Drones del Pampa" xmlns="http://www.w3.org/2000/svg">
    ${dpDefs(id)}${dpLetras(id)}${dpO(id)}${dpDron(id)}</svg>`;
}

// Solo el ícono (el dron con la espiga): barra de navegación chica, tarjetas, favicon.
function iconoDP(o){
  o = o || {}; const id = 'dpi' + (++_dpN);
  return `<svg class="icono-dp ${o.cls || ''}" viewBox="${DP.vbIcono}" role="img" aria-label="Drones del Pampa" xmlns="http://www.w3.org/2000/svg">
    ${dpDefs(id)}${dpO(id)}${dpDron(id)}</svg>`;
}

// Favicon e ícono de la pantalla de inicio del celular: el ícono sobre un cuadrado blanco redondeado.
function faviconDP(tam){
  tam = tam || 64;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${tam}" height="${tam}" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#fff"/>`
    + `<svg x="6" y="20" width="88" height="60" viewBox="${DP.vbIcono}">${dpDefs('f')}${dpO('f')}${dpDron('f')}</svg></svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

/* «Foto» de un dron: ilustración vista desde arriba, con el color y la cantidad de brazos de cada
   modelo, sobre un fondo de taller o de campo. En la versión real son las fotos que saca el técnico. */
function fotoDron(modelo, semilla, fondo){
  const M = MODELOS[modelo] || MODELOS.T40, r = azar((semilla || 7) * 97 + modelo.length * 13);
  const brazos = M.motores === 6 ? 6 : 4, giro = Math.round(r() * 30 - 15);
  const fondos = [['#E9EEF5', '#CFD8E6'], ['#EEF2E6', '#D2DCC2'], ['#E8ECF2', '#C5CFDD'], ['#F1EEE8', '#DCD5C8']];
  const [f1, f2] = fondo === 'campo' ? ['#9DBE6A', '#6E9443'] : fondos[Math.floor(r() * fondos.length)];
  const uid = 'fd' + (++_dpN);
  let br = '';
  for (let i = 0; i < brazos; i++){
    const a = (360 / brazos) * i + (brazos === 4 ? 45 : 0);
    br += `<g transform="rotate(${a} 100 75)"><rect x="96" y="22" width="8" height="48" rx="3" fill="${M.color}"/>
      <circle cx="100" cy="24" r="${brazos === 6 ? 17 : 20}" fill="${M.color}" opacity=".18"/><circle cx="100" cy="24" r="6.5" fill="${M.color}"/>
      <rect x="${brazos === 6 ? 83 : 79}" y="22" width="${brazos === 6 ? 34 : 42}" height="4" rx="2" fill="#20262E" opacity=".75" transform="rotate(${Math.round(r() * 170)} 100 24)"/></g>`;
  }
  return `<svg class="foto-dron" viewBox="0 0 200 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><linearGradient id="${uid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${f1}"/><stop offset="1" stop-color="${f2}"/></linearGradient></defs>
    <rect width="200" height="150" fill="url(#${uid})"/>
    ${fondo === 'campo' ? Array.from({ length: 9 }, (_, i) => `<path d="M${-20 + i * 28} 150 L${30 + i * 28} 0" stroke="#5A7D36" stroke-width="5" opacity=".35"/>`).join('') : '<rect y="112" width="200" height="38" fill="#000" opacity=".04"/>'}
    <ellipse cx="104" cy="82" rx="58" ry="52" fill="#000" opacity=".10"/>
    <g transform="rotate(${giro} 100 75)">${br}
      <rect x="80" y="55" width="40" height="40" rx="10" fill="${M.color}"/>
      <rect x="86" y="61" width="28" height="28" rx="7" fill="#fff" opacity=".9"/>
      <rect x="90" y="65" width="20" height="20" rx="5" fill="${M.marca === 'XAG' ? '#E8B22A' : '#6DB72E'}" opacity=".55"/>
      <circle cx="100" cy="57" r="2.2" fill="#E04848"/></g>
  </svg>`;
}

/* =====================================================================
   HERRAMIENTAS COMUNES: fechas, dólares, ventanas, avisos, gráficos chicos
   ===================================================================== */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2 = n => String(n).padStart(2, '0');
const sinTildes = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const r2 = n => Math.round(n * 100) / 100;
const sumar = (l, f) => l.reduce((s, x) => s + (f ? f(x) : x), 0);
const menosMovimiento = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Fechas (siempre como texto 'AAAA-MM-DD'; se muestran dd/mm/aaaa) ---------- */
const DIAS  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','setiembre','octubre','noviembre','diciembre'];
const MESES_C = ['ene','feb','mar','abr','may','jun','jul','ago','set','oct','nov','dic'];
function iso(d){ return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function aFecha(s){ const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function hoy(){ return iso(new Date()); }
function hora(){ const d = new Date(); return p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function sumarDias(s, n){ const d = aFecha(s); d.setDate(d.getDate() + n); return iso(d); }
function difDias(a, b){ return Math.round((aFecha(b) - aFecha(a)) / 864e5); }   // b − a
function inicioMes(s){ return s.slice(0, 8) + '01'; }
function inicioSemana(s){ const d = aFecha(s), k = (d.getDay() + 6) % 7; return sumarDias(s, -k); }
function fLarga(s){ const d = aFecha(s); return DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]; }
function fCorta(s){ if (!s) return '—'; const d = aFecha(s); return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear(); }
function fDM(s){ if (!s) return '—'; const d = aFecha(s); return p2(d.getDate()) + '/' + p2(d.getMonth() + 1); }
function fMes(s){ const d = aFecha(s.length === 7 ? s + '-01' : s); return MESES[d.getMonth()] + ' ' + d.getFullYear(); }
function cuando(s){
  const n = difDias(hoy(), s);
  if (n === 0) return 'hoy'; if (n === -1) return 'ayer'; if (n === 1) return 'mañana';
  return n > 0 ? 'en ' + n + ' días' : 'hace ' + (-n) + ' días';
}

const FORMATOS = { usd, usd0, n: num };
function contar(el, desde, hasta, ms, fmt){

  if (menosMovimiento()){ el.textContent = f(hasta); return; }
  const paso = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = f(desde + (hasta - desde) * e); if (k < 1) requestAnimationFrame(paso); };
  requestAnimationFrame(paso);
}

/* ---------- Mini gráfico de la semana (tendencia) ---------- */
function sparkline(valores, color, o){
  o = o || {}; const w = o.w || 120, h = o.h || 34, n = valores.length;
  const max = Math.max(...valores, 1), min = Math.min(...valores, 0);
  const X = i => (i / (n - 1)) * (w - 4) + 2, Y = v => h - 3 - ((v - min) / (max - min || 1)) * (h - 8);
  const pts = valores.map((v, i) => [X(i), Y(v)]);
  // curva suave
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < n; i++){ const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], cx = (x0 + x1) / 2; d += ` C${cx} ${y0} ${cx} ${y1} ${x1} ${y1}`; }
  const uid = 'sp' + (++_dpN), [ux, uy] = pts[n - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${ux} ${h} L${pts[0][0]} ${h} Z" fill="url(#${uid})"/>
    <path class="spark-l" d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${ux}" cy="${uy}" r="2.6" fill="${color}"/></svg>`;
}

/* =====================================================================
   CAPA DE DATOS (separada de la pantalla)
   En esta demostración todo se guarda en el navegador (localStorage).
   En la versión real cada registro es un documento en Firebase (base de
   datos en tiempo real): solo cambia este archivo, el resto no se toca.
   Funciones para crear, leer, editar y anular: Store.crear / Store.leer /
   Store.editar / Store.anular. Nada se borra: se anula con un motivo.
   ===================================================================== */
let _cache = {};
function memo(k, fn){ return k in _cache ? _cache[k] : (_cache[k] = fn()); }

const Store = {
  data: null,
  cargar(){
    let d = null;
    try { d = JSON.parse(localStorage.getItem(CLAVE_GUARDADO) || 'null'); } catch (e) { d = null; }
    // El demo SIEMPRE tiene ejemplos: si la copia está vacía, rota o es de otra versión, se vuelve a sembrar.
    if (!d || d.version !== VERSION_DATOS || !Array.isArray(d.ordenes) || d.ordenes.length < 20 || !Array.isArray(d.productos) || d.productos.length < 20) d = crearDatosEjemplo(hoy());
    this.data = d;
    Object.assign(MODELOS, d.config.modelosExtra || {});   // los modelos que agregó el taller
    moverFechas(d, hoy());   // la demo siempre "vive" en el día de hoy
    this.guardar();
  },
  guardar(){
    _cache = {};
    try { localStorage.setItem(CLAVE_GUARDADO, JSON.stringify(this.data)); } catch (e) { /* sin espacio o modo privado: sigue en memoria */ }
  },
  id(pref){ this.data.seq = (this.data.seq || 0) + 1; return pref + this.data.seq.toString(36) + Math.random().toString(36).slice(2, 5); },
  // CRUD genérico sobre una colección (ordenes, ventas, productos…)
  crear(col, obj, accion){ obj.id = obj.id || this.id(col.slice(0, 2)); obj.creado = { u:usuarioId(), f:hoy(), h:hora() }; this.data[col].unshift(obj); registrar(accion || 'Creó un registro', obj.num || obj.cod || obj.id, col); this.guardar(); return obj; },
  leer(col, id){ return (this.data[col] || []).find(x => x.id === id || x.cod === id || x.num === id) || null; },
  editar(col, id, cambios, accion){ const x = this.leer(col, id); if (!x) return null; const antes = {}; Object.keys(cambios).forEach(k => antes[k] = x[k]); Object.assign(x, cambios); x.cambio = { u:usuarioId(), f:hoy(), h:hora() }; registrar(accion || 'Editó', x.num || x.cod || x.id, col, antes, cambios); this.guardar(); return x; },
  anular(col, id, motivo){ const x = this.leer(col, id); if (!x) return null; x.anulado = { u:usuarioId(), f:hoy(), h:hora(), motivo }; registrar('Anuló (' + motivo + ')', x.num || x.id, col); this.guardar(); return x; }
};
const D = () => Store.data;

/* Los datos de ejemplo se crean "alrededor de hoy". Si alguien vuelve otro día,
   se corren todas las fechas para que siga habiendo movimiento hoy. */
function moverFechas(d, h){
  const n = difDias(d.base, h);
  if (!n) return;
  const esF = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
  (function recorrer(o){
    if (Array.isArray(o)) o.forEach((v, i) => { if (esF(v)) o[i] = sumarDias(v, n); else if (v && typeof v === 'object') recorrer(v); });
    else if (o && typeof o === 'object') Object.keys(o).forEach(k => { if (esF(o[k])) o[k] = sumarDias(o[k], n); else if (o[k] && typeof o[k] === 'object') recorrer(o[k]); });
  })(d);
  d.base = h;
}

function haceCuanto(f, h){

const pagado = f => r2(sumar(f.pagos || [], p => p.monto));
const recargos = f => r2(sumar(f.recargos || [], p => p.monto));
const saldoFactura = f => r2(f.total + recargos(f) - pagado(f));
function estadoFactura(f){
  if (f.anulado) return { k:'anulada', t:'Anulada', c:'gris' };

}
const facturasActivas = () => D().facturas.filter(f => !f.anulado);

/* ---------- Números del mes y tendencia de la semana ---------- */
const totalVenta = v => r2(sumar(v.items, i => i.precio * i.cant) - (v.desc || 0));
const ventaCuenta = v => !v.anulado && v.est !== 'pendiente';
function numerosMes(){
  return memo('numMes', () => {
    const h = hoy(), ini = inicioMes(h);
    const ventas = D().ventas.filter(v => ventaCuenta(v) && v.f >= ini);
    const fRep = facturasActivas().filter(f => f.tipo === 'orden' && f.f >= ini);
    let cobrado = 0; facturasActivas().forEach(f => (f.pagos || []).forEach(p => { if (p.f >= ini) cobrado += p.monto; }));
    const pendiente = sumar(facturasActivas(), f => Math.max(0, saldoFactura(f)));
    return { ventas:r2(sumar(ventas, totalVenta)), nVentas:ventas.length, reparaciones:r2(sumar(fRep, f => f.total)), nRep:fRep.length, cobrado:r2(cobrado), pendiente:r2(pendiente) };
  });
}
// Serie de los últimos 7 días (para los mini gráficos)
function serieSemana(cual){
  return memo('serie_' + cual, () => {
    const h = hoy(), dias = Array.from({ length: 7 }, (_, i) => sumarDias(h, i - 6));
    if (cual === 'ventas') return dias.map(d => r2(sumar(D().ventas.filter(v => ventaCuenta(v) && v.f === d), totalVenta)));
    if (cual === 'reparaciones') return dias.map(d => r2(sumar(facturasActivas().filter(f => f.tipo === 'orden' && f.f === d), f => f.total)));
    if (cual === 'cobrado') return dias.map(d => { let s = 0; facturasActivas().forEach(f => (f.pagos || []).forEach(p => { if (p.f === d) s += p.monto; })); return r2(s); });
    // pendiente de cobro al cierre de cada día
    return dias.map(d => r2(sumar(facturasActivas().filter(f => f.f <= d), f => Math.max(0, f.total + sumar((f.recargos || []).filter(x => x.f <= d), x => x.monto) - sumar((f.pagos || []).filter(p => p.f <= d), p => p.monto)))));
  });
}
// Variación contra la semana anterior (en %)
function variacion(cual){
  return memo('var_' + cual, () => {
    const h = hoy(), a0 = sumarDias(h, -6), b0 = sumarDias(h, -13), b1 = sumarDias(h, -7);
    const entre = (x, y) => {
      if (cual === 'ventas') return sumar(D().ventas.filter(v => ventaCuenta(v) && v.f >= x && v.f <= y), totalVenta);
      if (cual === 'reparaciones') return sumar(facturasActivas().filter(f => f.tipo === 'orden' && f.f >= x && f.f <= y), f => f.total);
      if (cual === 'cobrado'){ let s = 0; facturasActivas().forEach(f => (f.pagos || []).forEach(p => { if (p.f >= x && p.f <= y) s += p.monto; })); return s; }
      return 0;
    };
    if (cual === 'pendiente'){ const s = serieSemana('pendiente'); return s[0] ? Math.round((s[6] - s[0]) / s[0] * 100) : 0; }
    const ant = entre(b0, b1), act = entre(a0, h);
    return ant ? Math.round((act - ant) / ant * 100) : 0;
  });
}
// Horas cargadas por técnico en el mes
function horasPorTecnico(desde){
  desde = desde || inicioMes(hoy());
  const m = {}; tecnicos().forEach(t => m[t.id] = 0);
  D().ordenes.forEach(o => (o.horas || []).forEach(x => { if (x.f >= desde && m[x.u] != null) m[x.u] += x.h; }));
  return m;
}
// Repuestos más usados del mes (retiros aprobados + ventas)
function repuestosMasUsados(n){
  const ini = inicioMes(hoy()), m = {};
  D().ordenes.forEach(o => (o.repuestos || []).forEach(x => { if (x.est === 'aprobado' && x.f >= ini) m[x.cod] = (m[x.cod] || 0) + x.cant; }));
  D().ventas.forEach(v => { if (ventaCuenta(v) && v.f >= ini) v.items.forEach(i => m[i.cod] = (m[i.cod] || 0) + i.cant); });
  return Object.entries(m).filter(([c]) => producto(c) && producto(c).cat !== 'Limpieza').sort((a, b) => b[1] - a[1]).slice(0, n || 6);
}

/* ---------- Pedidos a Dragur ---------- */
const pedidoBorrador = () => D().pedidos.find(p => p.est === 'borrador');
// Suma un repuesto al borrador del pedido (se arma solo a medida que se usan repuestos).
function sumarAlPedido(cod, cant, motivo){
  let p = pedidoBorrador();
  if (!p){ p = { id:Store.id('pd'), num:'PD-' + hoy().slice(0, 4) + '-' + String(D().numPedido = (D().numPedido || 34) + 1).padStart(3, '0'), f:hoy(), est:'borrador', lineas:[] }; D().pedidos.unshift(p); }
  const l = p.lineas.find(x => x.cod === cod);
  if (l){ l.cant += cant; if (motivo && !l.motivos.includes(motivo)) l.motivos.push(motivo); }
  else p.lineas.push({ cod, cant, motivos: motivo ? [motivo] : [] });
}

/* ---------- Un artículo real de ejemplo (para los «Probar con…» de la demo) ---------- */
function ejemploProd(m, ...cats){
  for (const c of cats){ const p = D().productos.find(x => !x.usado && x.cat === c && (!m || x.modelos.includes(m)) && x.stock > 0); if (p) return p; }
  return D().productos.find(x => !x.usado && (!m || x.modelos.includes(m))) || D().productos[0];
}

/* =====================================================================
   DATOS DE EJEMPLO (todos inventados)
   Clientes del norte de Uruguay, drones DJI Agras y XAG, repuestos con
   códigos al estilo Dragur y casi un año de historial, para que la página

/* ---- Cada artículo REAL se clasifica por su nombre y su código.
   La categoría y los modelos compatibles salen de ahí; el precio, el stock y la ubicación son INVENTADOS. ---- */
const REGLAS_CAT = [
  ['Drones', (n, c, cu) => cu === 'D'],
  ['Fertilizantes', (n, c, cu) => cu === 'F' && !/^T\d/.test(c) && !/lava|jabon|antiespum/.test(n)],
  ['Generadores', (n, c, cu) => cu === 'G' || /^D1[24]P|^D14000|^TOY|^GE\d|^GEN/.test(c) || /generador/.test(n)],
  ['Hélices', n => /helice/.test(n) && !/arandela|tornillo|base|correa|sujeta|anclaje/.test(n)],
  ['Tornillería y juntas', n => /tornillo|tuerca|arandela|pasador|ruleman|rodamiento|buje|junta|goma|anillo|sell|o-ring|oring|espuma|almohadilla|resorte|clip|hebilla|perno|chaveta/.test(n)],
  ['Motores', n => /\bmotor/.test(n) && !/base|cubierta|cobertor|anclaje|cable|soporte|eje|sinfin/.test(n)],
  ['Electrónica', n => /cable|placa|sensor|radar|antena|\besc\b|modulo|camara|usb|conector|chicote|gps|rtk|\bled\b|electron/.test(n)],
  ['Cargadores', n => /cargador|estacion de bateria|carga de la estacion/.test(n)],
  ['Baterías', n => /bateri/.test(n)],
  ['Control remoto', n => /control remoto|joystick/.test(n)],

  let defs = '', parcelas = '';

  if (i.value !== CLAVE_DEMO){
    i.classList.add('mal'); $('#ig-error').textContent = i.value ? 'La contraseña no es correcta. Probá de nuevo.' : 'Escribí tu contraseña.';
    t.classList.remove('tiembla'); t.offsetHeight; t.classList.add('tiembla');
    vibrar([40, 30, 40]);
    i.select(); return;
  }
  USUARIO = IG.u;
  registrar('Inició sesión', '', 'ingreso'); guardar();
  despegar();
}
function bloquear(){

  USUARIO = null; cerrarModal(); cerrarCampana(); cerrarMenuYo();
  mostrarIngreso();
}

/* =====================================================================
   DESPEGUE: el dron del logo despega (unos 3 segundos)
   1. Las hélices empiezan a girar y el dron se eleva de la «o» con un balanceo.
   2. Da una vuelta por la pantalla inclinándose en las curvas, con una estela de pulverización.
   3. Mientras vuela, la espiga se completa hoja por hoja.
   4. Vuelve, se achica y aterriza en el logo de la barra de navegación; el panel aparece con un fundido.
   Hecha en código (SVG + Web Animations API): carga al instante y se ve nítida en cualquier pantalla.
   Se saltea con un toque; sale en cada ingreso de todos los usuarios;
   si el sistema pide reducir el movimiento, solo el fundido.
   ===================================================================== */
let DESPEGANDO = false;
const _dg = { anims:[], timers:[], gotas:null, fin:null };
// Decisión de la usuaria (06/11/2026): el despegue sale en CADA ingreso y para TODOS los usuarios.
function despegar(forzar){
  const completo = forzar || !menosMovimiento();
  if (!completo){ fundidoCorto(); return; }
  DESPEGANDO = true;
  const dg = $('#despegue'); dg.classList.remove('hidden');
  $('.dg-velo').removeAttribute('style'); $('#dg-logo').removeAttribute('style');
  $('#dg-logo').innerHTML = logoDP({ cls:'dg-svg' });
  $('#dg-estela').innerHTML = '';
  const logo = $('#dg-logo .logo-dp'), hojas = $$('#dg-logo .dp-hoja');
  hojas.forEach((h, i) => { if (i > 0) h.style.transform = 'scale(0)'; });
  const T = (ms, fn) => _dg.timers.push(setTimeout(fn, ms));
  const A = (el, kf, o) => { const a = el.animate(kf, Object.assign({ fill:'forwards' }, o)); _dg.anims.push(a); return a; };
  // Se saltea con un toque o una tecla (recién después de un instante: el Enter de la contraseña no cuenta)
  dg.onclick = null; _dg.tecla = () => terminarDespegue();
  T(350, () => { dg.onclick = terminarDespegue; document.addEventListener('keydown', _dg.tecla); });

  // 1) la tarjeta se desvanece y queda el logo grande en el centro
  $('#ig-tarjeta').classList.add('sale');
  A($('.dg-velo'), [{ opacity:0 }, { opacity:1 }], { duration:380, easing:'ease-out' });
  A($('#dg-logo'), [{ opacity:0, transform:'translate(-50%,-50%) scale(.94)' }, { opacity:1, transform:'translate(-50%,-50%) scale(1)' }], { duration:480, delay:120, easing:'cubic-bezier(.2,.8,.3,1)' });
  // la página se arma detrás del fondo blanco (así la tarjeta se desvanece sin tirones)
  T(400, () => { abrirApp(); $('#ingreso').classList.add('hidden'); logo.classList.add('girando'); });

  // 2) el dron se separa del logo y despega
  T(820, () => {
    const dronLogo = $('.dp-dron', logo);
    const r0 = rectDron(logo), destino = logoDestino(), r1 = destino ? rectDron(destino) : null;
    if (destino) $('.dp-dron', destino).style.opacity = '0';
    const v = document.createElement('div'); v.className = 'dg-vuela';
    v.style.width = r0.w + 'px'; v.style.height = r0.h + 'px';
    v.innerHTML = `<svg viewBox="${VB_DRON.join(' ')}" class="girando">${dpDefs('vu')}${dpDron('vu')}</svg>`;
    $('#despegue').appendChild(v); _dg.vuela = v;
    dronLogo.style.opacity = '0';
    const W = innerWidth, H = innerHeight, c0 = [r0.x + r0.w / 2, r0.y + r0.h / 2];
    const lift = [c0[0], c0[1] - Math.min(110, H * .12)];
    const fin = r1 ? [r1.x + r1.w / 2, r1.y + r1.h / 2] : [c0[0], -80], sFin = r1 ? r1.w / r0.w : .2;
    const ruta = [c0, lift, [W * .80, H * .2], [W * .87, H * .6], [W * .52, H * .84], [W * .14, H * .62], [W * .18, H * .26], [fin[0] + W * .08, fin[1] + H * .14], fin];
    const kf = rutaKeyframes(ruta, r0, sFin);
    const vuelo = A(v, kf, { duration:2500, easing:'cubic-bezier(.42,.0,.3,1)' });
    // estela de pulverización verde
    _dg.gotas = setInterval(() => estela(v), 26);
    // 3) la espiga crece hoja por hoja
    hojas.slice(1).forEach((h, i) => T(520 + i * 300, () => A(h, [{ transform:'scale(0)' }, { transform:'scale(1.18)', offset:.65 }, { transform:'scale(1)' }], { duration:420, easing:'cubic-bezier(.3,1.4,.5,1)' })));
    // 4) el panel aparece con un fundido mientras el dron vuelve
    T(1600, () => A($('#dg-logo'), [{ opacity:1 }, { opacity:0, transform:'translate(-50%,-50%) scale(.97)' }], { duration:560, easing:'ease-in' }));
    T(1750, () => A($('.dg-velo'), [{ opacity:1 }, { opacity:0 }], { duration:650, easing:'ease-in-out' }));
    T(2150, () => clearInterval(_dg.gotas));
    vuelo.finished.then(() => terminarDespegue(true)).catch(() => {});
  });
}
// El dron (en coordenadas del logo): hélices de 446 a 1223, de 196 a 342
const VB_DRON = [440, 190, 790, 158];
function rectDron(svg){
  const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
  const k = Math.min(r.width / vb.width, r.height / vb.height), ox = r.left + (r.width - vb.width * k) / 2, oy = r.top + (r.height - vb.height * k) / 2;
  return { x: ox + (VB_DRON[0] - vb.x) * k, y: oy + (VB_DRON[1] - vb.y) * k, w: VB_DRON[2] * k, h: VB_DRON[3] * k };
}
function logoDestino(){ return $$('#lat-marca svg, #tope-logo svg, .cons-cab svg').find(s => { const r = s.getBoundingClientRect(); return r.width > 0 && r.height > 0; }) || null; }
// Curva suave por los puntos (Catmull-Rom) → cuadros de la animación, inclinando el dron en las curvas.
function rutaKeyframes(pts, r0, sFin){
  const N = 70, seg = pts.length - 1, out = [];
  const cr = (p0, p1, p2, p3, t) => { const t2 = t * t, t3 = t2 * t; return [0, 1].map(k => .5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3)); };
  const punto = u => { const x = Math.min(seg - 1e-6, u * seg), i = Math.floor(x), t = x - i; return cr(pts[Math.max(0, i - 1)], pts[i], pts[i + 1], pts[Math.min(seg, i + 2)], t); };
  let prev = punto(0);
  for (let n = 0; n <= N; n++){
    const u = n / N, [x, y] = punto(u), dx = x - prev[0];
    let giro = Math.max(-16, Math.min(16, dx * .55)); if (u < .12) giro = Math.sin(u * 60) * 3.5;   // balanceo al despegar
    if (u > .92) giro *= (1 - u) / .08;
    const s = u < .12 ? 1 : u < .8 ? 1 - .22 * Math.sin((u - .12) / .68 * Math.PI) : 1 + (sFin - 1) * ((u - .8) / .2);
    out.push({ transform:`translate(${(x - r0.w / 2).toFixed(1)}px, ${(y - r0.h / 2).toFixed(1)}px) rotate(${giro.toFixed(2)}deg) scale(${s.toFixed(3)})`, offset:u });
    prev = [x, y];
  }
  out[0].transform = `translate(${r0.x}px, ${r0.y}px) rotate(0deg) scale(1)`;
  return out.map(k => Object.assign(k, { transformOrigin:'50% 50%' }));
}
function estela(v){
  const r = v.getBoundingClientRect(); if (!r.width) return;
  const g = document.createElement('i'); g.className = 'gota-e';
  const t = 3 + Math.random() * 6;
  g.style.cssText = `--t:${t}px;--dx:${(Math.random() * 20 - 10).toFixed(1)}px;left:${r.left + r.width * (.42 + Math.random() * .16)}px;top:${r.top + r.height * .82}px`;
  $('#dg-estela').appendChild(g); setTimeout(() => g.remove(), 950);
}
// natural = true cuando el dron terminó de aterrizar; si no, la persona tocó para saltear.
function terminarDespegue(natural){
  if (!DESPEGANDO) return;
  natural = natural === true; DESPEGANDO = false;
  _dg.timers.forEach(clearTimeout); _dg.timers = []; clearInterval(_dg.gotas);
  document.removeEventListener('keydown', _dg.tecla);
  const dg = $('#despegue');
  if ($('#app').classList.contains('hidden')) abrirApp();
  // Cada pieza queda donde está (antes se «cancelaba» y volvía un instante al principio: eso era el tirón del final)
  _dg.anims.forEach(a => { try { a.commitStyles(); a.cancel(); } catch (e) {} }); _dg.anims = [];
  if (_dg.vuela){ _dg.vuela.remove(); _dg.vuela = null; }
  const destino = logoDestino();
  if (destino){ const d = $('.dp-dron', destino); d.style.opacity = '1'; d.animate([{ transform:'translateY(-6px)' }, { transform:'translateY(1.5px)' }, { transform:'none' }], { duration:380, easing:'cubic-bezier(.3,1.5,.5,1)' }); }
  const cerrar = () => { dg.classList.add('hidden'); dg.style.opacity = ''; $('.dg-velo').removeAttribute('style'); $('#dg-logo').removeAttribute('style'); $('#dg-estela').innerHTML = ''; };
  if (natural) cerrar();   // el fondo y el logo grande ya se desvanecieron
  else dg.animate([{ opacity:1 }, { opacity:0 }], { duration:260, easing:'ease-out' }).finished.then(cerrar);
  $('#ingreso').classList.add('hidden');
  despuesDeEntrar();
}
// Los demás ingresos del día: un fundido corto.
function fundidoCorto(){
  $('#ig-tarjeta').classList.add('sale');
  const ig = $('#ingreso');
  ig.animate([{ opacity:1 }, { opacity:0 }], { duration:300, easing:'ease-out' }).finished.then(() => { ig.classList.add('hidden'); ig.style.opacity = ''; });
  abrirApp();
  despuesDeEntrar();
}
function verDespegue(){ cerrarMenuYo(); const u = USUARIO; registrar('Volvió a ver la animación del despegue', '', 'ingreso'); USUARIO = u; $('#app').classList.add('hidden'); mostrarIngreso(); IG.u = u; IG.paso = 'clave'; igPintar(); $('#ig-in').value = CLAVE_DEMO; setTimeout(() => { USUARIO = u; despegar(true); }, 350); }


/* ===== js/07b-fondos.js ===== */
/* =====================================================================
   FONDOS DE LA PANTALLA DE INGRESO (se elige en Configuración › Datos del taller)
   Todos dibujados en código (SVG): cargan al instante y se ven nítidos.
   ===================================================================== */
const FONDOS_INGRESO = {
  campo:     { t:'Campo con surcos (el de antes)', svg:() => campoSVG() },
  amanecer:  { t:'Amanecer en el campo',    svg:() => fondoAmanecer() },
  topo:      { t:'Blanco con curvas de nivel', svg:() => fondoTopo() },
  mision:    { t:'Misión de vuelo',         svg:() => fondoMision() },
  satelital: { t:'Campo satelital',         svg:() => fondoSatelital() }
};

/* ---------- 1. Amanecer: cielo azul que aclara, sol suave y surcos verdes en perspectiva ---------- */
function fondoAmanecer(){
  const W = 1600, H = 1000, hz = 560, vx = 820, r = azar(11);
  const surcos = Array.from({ length:46 }, (_, i) => { const x = -2400 + i * 140; return `<line x1="${vx}" y1="${hz}" x2="${x}" y2="${H}" stroke="${i % 2 ? '#2F6E1A' : '#5FA82A'}" stroke-width="${i % 2 ? 26 : 30}" stroke-opacity="${i % 2 ? .55 : .35}"/>`; }).join('');
  const nubes = Array.from({ length:6 }, () => { const x = r() * W, y = 90 + r() * 280, w = 160 + r() * 260; return `<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="${w.toFixed(0)}" ry="${(w * .16).toFixed(0)}" fill="#fff" opacity="${(.10 + r() * .14).toFixed(2)}" filter="url(#am-b)"/>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice"><defs>
      <linearGradient id="am-cielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#082F82"/><stop offset=".35" stop-color="#0B3D9E"/><stop offset=".62" stop-color="#3C82CF"/><stop offset=".82" stop-color="#A9CFEF"/><stop offset="1" stop-color="#F7E1B5"/></linearGradient>
      <radialGradient id="am-sol" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFF6DA"/><stop offset=".35" stop-color="#FFE3A3" stop-opacity=".85"/><stop offset="1" stop-color="#FFD38A" stop-opacity="0"/></radialGradient>
      <linearGradient id="am-tierra" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6DB72E"/><stop offset=".4" stop-color="#3F8A1F"/><stop offset="1" stop-color="#1F4E12"/></linearGradient>
      <filter id="am-b"><feGaussianBlur stdDeviation="18"/></filter>
      <clipPath id="am-c"><rect y="${hz}" width="${W}" height="${H - hz}"/></clipPath></defs>
    <rect width="${W}" height="${hz + 2}" fill="url(#am-cielo)"/>
    <circle cx="1180" cy="${hz - 10}" r="260" fill="url(#am-sol)"/><circle cx="1180" cy="${hz - 10}" r="46" fill="#FFF3CF" opacity=".9"/>
    ${nubes}
    <path d="M0 ${hz} C 220 ${hz - 60} 420 ${hz - 30} 620 ${hz - 55} S 1000 ${hz - 25} 1240 ${hz - 70} S 1500 ${hz - 30} 1600 ${hz - 45} V ${hz + 6} H0 Z" fill="#2E6A1C" opacity=".55"/>
    <path d="M0 ${hz} C 300 ${hz - 25} 520 ${hz - 10} 820 ${hz - 28} S 1300 ${hz - 6} 1600 ${hz - 20} V ${hz + 6} H0 Z" fill="#3F8A1F" opacity=".8"/>
    <rect y="${hz}" width="${W}" height="${H - hz}" fill="url(#am-tierra)"/>
    <g clip-path="url(#am-c)">${surcos}</g>
    <rect y="${hz}" width="${W}" height="${H - hz}" fill="url(#am-cielo)" opacity=".08"/>
    <g transform="translate(470 250) scale(.11)" fill="#0B2E73" opacity=".55">${dpDronSilueta()}</g>
    <path d="M520 278 C 600 330 690 360 780 420" stroke="#9BDB63" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round" fill="none" opacity=".6"/>
  </svg>`;
}
// Silueta simple del dron del logo (para los fondos)
function dpDronSilueta(){ return '<rect x="0" y="40" width="760" height="22" rx="4"/><ellipse cx="120" cy="10" rx="120" ry="10"/><ellipse cx="640" cy="10" rx="120" ry="10"/><rect x="110" y="10" width="18" height="40"/><rect x="630" y="10" width="18" height="40"/><path d="M290 70 C290 10 330 -20 380 -20 C430 -20 470 10 470 70 Z"/>'; }

/* ---------- 2. Blanco con curvas de nivel y la ruta de un vuelo ---------- */
function fondoTopo(){
  const W = 1600, H = 1000, r = azar(23), centros = [[260, 240, 9], [1300, 760, 11], [1220, 170, 6], [420, 860, 7]];
  let lineas = '';
  centros.forEach(([cx, cy, n], k) => {
    const fases = Array.from({ length:5 }, () => r() * 6.28), amps = Array.from({ length:5 }, () => .05 + r() * .09);
    for (let i = 1; i <= n; i++){
      const rad = 34 * i + 10, pts = [];
      for (let a = 0; a <= 64; a++){ const t = a / 64 * Math.PI * 2; const d = rad * (1 + amps.reduce((s, am, j) => s + am * Math.sin(t * (j + 2) + fases[j] + i * .15), 0)); pts.push([cx + Math.cos(t) * d * 1.25, cy + Math.sin(t) * d]); }
      const verde = (i + k) % 4 === 0;
      lineas += `<path d="M${pts.map(p => p.map(v => v.toFixed(1)).join(' ')).join(' L')} Z" fill="none" stroke="${verde ? '#6DB72E' : '#0B3D9E'}" stroke-opacity="${verde ? .28 : (i % 5 === 0 ? .2 : .1)}" stroke-width="${i % 5 === 0 ? 2.2 : 1.3}"/>`;
    }
  });
  const ruta = [[120, 520], [430, 380], [700, 470], [900, 300], [1180, 420], [1480, 330]];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice"><rect width="${W}" height="${H}" fill="#F4F7FB"/>
    <g opacity=".9">${lineas}</g>
    <path d="M${ruta.map(p => p.join(' ')).join(' L')}" fill="none" stroke="#3F8A1F" stroke-width="2.5" stroke-dasharray="3 10" stroke-linecap="round" opacity=".55"/>
    ${ruta.map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="${i ? 6 : 9}" fill="#fff" stroke="${i ? '#6DB72E' : '#0B3D9E'}" stroke-width="2.5" opacity=".8"/>`).join('')}
    <g transform="translate(1440 300) scale(.09)" fill="#0B3D9E" opacity=".35">${dpDronSilueta()}</g>
  </svg>`;
}

/* ---------- 3. Misión de vuelo: grilla, parcela con pasadas de pulverización y la ruta ---------- */
function fondoMision(){
  const W = 1600, H = 1000;
  let grilla = ''; for (let x = 0; x <= W; x += 40) grilla += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#1E62B8" stroke-opacity="${x % 200 ? .10 : .22}"/>`;
  for (let y = 0; y <= H; y += 40) grilla += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#1E62B8" stroke-opacity="${y % 200 ? .10 : .22}"/>`;
  const parc = [[980, 180], [1460, 260], [1400, 760], [900, 690]];
  let pasadas = ''; for (let k = 0; k < 15; k++){ const t = k / 14, a = [parc[0][0] + (parc[3][0] - parc[0][0]) * t, parc[0][1] + (parc[3][1] - parc[0][1]) * t], b = [parc[1][0] + (parc[2][0] - parc[1][0]) * t, parc[1][1] + (parc[2][1] - parc[1][1]) * t];
    pasadas += `<line x1="${a[0].toFixed(0)}" y1="${a[1].toFixed(0)}" x2="${b[0].toFixed(0)}" y2="${b[1].toFixed(0)}" stroke="#6DB72E" stroke-width="${k < 9 ? 16 : 2}" stroke-opacity="${k < 9 ? .22 : .5}" ${k >= 9 ? 'stroke-dasharray="6 8"' : ''}/>`; }
  const parc2 = [[160, 640], [520, 600], [560, 900], [120, 940]];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="mi-f" cx=".55" cy=".4" r=".8"><stop offset="0" stop-color="#0E3277"/><stop offset="1" stop-color="#050E24"/></radialGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#mi-f)"/>${grilla}
    <g fill="none" stroke="#1E62B8" stroke-opacity=".28">${[120, 200, 280, 360].map(rr => `<circle cx="260" cy="230" r="${rr}"/>`).join('')}<line x1="260" y1="-140" x2="260" y2="600"/><line x1="-120" y1="230" x2="640" y2="230"/></g>
    <polygon points="${parc.map(p => p.join(',')).join(' ')}" fill="#6DB72E" fill-opacity=".07" stroke="#8ED64C" stroke-width="2.5" stroke-opacity=".8"/>
    ${pasadas}
    ${parc.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="9" fill="#06122B" stroke="#8ED64C" stroke-width="3"/>`).join('')}
    <polygon points="${parc2.map(p => p.join(',')).join(' ')}" fill="#1E62B8" fill-opacity=".08" stroke="#5A93EE" stroke-width="2" stroke-opacity=".6" stroke-dasharray="8 8"/>
    <path d="M560 540 C 700 520 820 420 980 330" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>
    <g transform="translate(1110 410) scale(.12) rotate(-12)" fill="#9BDB63" opacity=".85">${dpDronSilueta()}</g>
    <g font-family="Inter, sans-serif" font-size="15" fill="#7FAEF2" fill-opacity=".7">
      <text x="990" y="160">PARCELA 4 · 38,6 ha</text><text x="1420" y="800" text-anchor="end">30°54′ S · 55°32′ O</text>
      <text x="1330" y="120">ALT 3,5 m · VEL 7 m/s · 18 L/ha</text><text x="170" y="625">PARCELA 5 · pendiente</text></g>
  </svg>`;
}

/* ---------- 4. Campo satelital: chacras en verdes, trigo y tierra, con caminos, monte y arroyo ---------- */
function fondoSatelital(){
  const r = azar(41), W = 1600, H = 1000, C = 6, F = 4, TONOS = ['#5E8A31', '#7DA23E', '#4C7429', '#9DB45A', '#C2AE63', '#8C6B45', '#6F9A3A', '#A79A5A', '#5A7F33'];
  const p = [];
  for (let j = 0; j <= F; j++){ p.push([]); for (let i = 0; i <= C; i++){ const b = i === 0 || j === 0 || i === C || j === F; p[j].push([i * W / C + (b ? 0 : (r() - .5) * 140), j * H / F + (b ? 0 : (r() - .5) * 100)]); } }
  let defs = '', par = '';
  for (let j = 0; j < F; j++) for (let i = 0; i < C; i++){
    const k = j * C + i, ton = TONOS[Math.floor(r() * TONOS.length)], ang = Math.round(r() * 180), sep = 7 + Math.round(r() * 6);
    defs += `<pattern id="sa${k}" width="${sep}" height="${sep}" patternUnits="userSpaceOnUse" patternTransform="rotate(${ang})"><rect width="${sep}" height="${sep}" fill="${ton}"/><rect width="${(sep * .4).toFixed(1)}" height="${sep}" fill="#000" fill-opacity=".08"/></pattern>`;
    const q = [p[j][i], p[j][i + 1], p[j + 1][i + 1], p[j + 1][i]].map(x => x.map(Math.round).join(',')).join(' ');
    par += `<polygon points="${q}" fill="url(#sa${k})" stroke="#D9CBA0" stroke-width="5" stroke-opacity=".75"/>`;
  }
  const monte = Array.from({ length:70 }, (_, i) => { const t = i / 69, x = 60 + t * 1500, y = 690 - Math.sin(t * 3.4) * 140 + (r() - .5) * 40; return `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(8 + r() * 13).toFixed(1)}" fill="#2D4A1B" opacity=".85"/>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice"><defs>${defs}<radialGradient id="sa-v" cx=".5" cy=".45" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#05142E" stop-opacity=".55"/></radialGradient></defs>
    ${par}

function avisosDe(uid){

  });

  if (jefe){
    stockBajo().filter(p => estadoStock(p).k === 'critico').forEach(p => l.push({ id:'st' + p.cod, ico:'alerta', c:'rojo', t:`Stock crítico (urgente): ${p.nombre}`, s:`${p.cod} · ${p.stock ? 'queda ' + p.stock : 'no queda ninguno'}`, ir:'stock', f:h + '07:00', urg:true }));
    const mi = stockBajo().filter(p => estadoStock(p).k === 'minimo');
    if (mi.length) l.push({ id:'stm' + mi.map(p => p.cod).join(''), ico:'caja', c:'ambar', t:`${mi.length} repuestos llegaron al stock mínimo`, s:'Ya se sumaron al borrador del pedido a Dragur', ir:'stock', f:h + '07:00' });
  }
  if (flor) ordenesActivas().filter(o => o.estado === 'terminado').forEach(o => l.push({ id:'tf' + o.id, ico:'factura', c:'verde', t:`Lista para facturar: ${o.num}`, s:`${modeloTxt(o.modelo)} · ${nomCli(o.cli)}`, ir:'facturacion', f:(o.fTerm || h) + '17:00' }));
  if (flor) D().baterias.filter(b => b.estado === 'diagnostico' && b.diag.length).forEach(b => l.push({ id:'bd' + b.id, ico:'bateria', c:'cielo', t:`Batería diagnosticada, falta el estado`, s:`${b.num} · ${b.disp}`, ir:'baterias', f:b.f + '12:00' }));
  if (jefe){
    const fs = facturasActivas(), venc = fs.filter(f => ['vencida', 'recargo'].includes(estadoFactura(f).k));
    // las que vencieron estos días, una por una; las anteriores, juntas
    venc.filter(f => difDias(f.venc, h) <= 7).forEach(f => l.push({ id:'fv' + f.id, ico:'factura', c:'rojo', t:`Venció la factura ${f.num} · ${nomCli(f.cli)}`, s:`Debe ${usd(saldoFactura(f))} · el mensaje de WhatsApp ya está armado`, ir:'facturacion', f:f.venc + '08:00' }));
    const viejas = venc.filter(f => difDias(f.venc, h) > 7);

    fs.filter(f => estadoFactura(f).k === 'pendiente' && difDias(h, f.venc) <= 7).forEach(f => l.push({ id:'fp' + f.id, ico:'calendario', c:'ambar', t:`Vence ${cuando(f.venc)}: ${f.num}`, s:`${nomCli(f.cli)} · ${usd(saldoFactura(f))}`, ir:'facturacion', f:h + '08:00' }));
  }
  if (claudio || t === 'tecnico') ordenesActivas().filter(o => atrasada(o) && (claudio || o.tec === uid)).forEach(o => l.push({ id:'at' + o.id, ico:'reloj', c:'rojo', t:`Orden atrasada: ${o.num}`, s:`${diasEnTaller(o)} días en el taller · ${modeloTxt(o.modelo)}`, ir:'reparaciones', f:h + '06:00' }));
  if (t === 'tecnico'){
    D().aprobaciones.filter(a => a.u === uid && a.est !== 'pendiente' && a.f >= sumarDias(h, -3)).forEach(a => l.push({ id:'re' + a.id, ico:a.est === 'aprobado' ? 'check' : 'x', c:a.est === 'aprobado' ? 'verde' : 'rojo', t:`${TIPOS_APROB[a.tipo].t}: ${a.est === 'aprobado' ? 'aprobado' : 'rechazado'}`, s:`por ${nomUsuario(a.resolvio)}`, ir:'reparaciones', f:a.f + a.h }));

  const leidos = (D().leidos[uid] || []);
  l.forEach(a => a.leido = leidos.includes(a.id));
  return l.sort((a, b) => (a.leido - b.leido) || ((b.urg ? 1 : 0) - (a.urg ? 1 : 0)) || b.f.localeCompare(a.f));

// Sonidos cortos (escáner y avisos), hechos con el navegador, sin archivos.
let _audio = null;
function sonido(tipoS){
  try {
    _audio = _audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = _audio.currentTime, notas = tipoS === 'aviso' ? [[880, 0], [1320, .11]] : [[1760, 0]];
    notas.forEach(([fr, d]) => { const o = _audio.createOscillator(), g = _audio.createGain(); o.type = 'sine'; o.frequency.value = fr;
      g.gain.setValueAtTime(0, t + d); g.gain.linearRampToValueAtTime(.12, t + d + .01); g.gain.exponentialRampToValueAtTime(.001, t + d + .12);
      o.connect(g).connect(_audio.destination); o.start(t + d); o.stop(t + d + .14); });
  } catch (e) {}
}
