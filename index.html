<style>
/* ===== css/01-base.css ===== */
/* =====================================================================
   SISTEMA DE DISEÑO DE DRONES DEL PAMPA
   Colores y letras SOLO acá (variables de :root). Toda la paleta sale del
   logo: azul, verde y blanco, con el blanco como protagonista.
   Radios de 12 a 16 px · tres niveles de sombra · espaciado de 4 y 8 px.
   ===================================================================== */
:root{
  /* Marca */
  --azul:#0B3D9E;          /* Azul Pampa: navegación, títulos, botones principales */
  --cielo:#1E62B8;         /* Azul cielo: degradados, enlaces, estado activo */
  --verde:#6DB72E;         /* Verde campo: dron, acciones positivas, destacados */
  --hoja:#3F8A1F;          /* Verde hoja: verde para texto sobre blanco */
  --blanco:#FFFFFF;
  --fondo:#F4F7FB;         /* Blanco azulado: fondo detrás de las tarjetas */
  --carta:#FFFFFF;
  --borde:#DCE3EE;         /* Gris suave */
  --borde-2:#E9EEF5;
  --texto:#1B2433;         /* Grafito */
  --texto-2:#5B6678;       /* Gris */
  --texto-3:#8A94A6;
  --tinte:#EEF3FB;         /* azul muy suave: activo, hover */
  --tinte-verde:#EFF7E7;
  /* Estados */
  --ok:#2E9E5B;      --ok-t:#1F7A44;     --ok-f:#E6F5EC;
  --ambar:#E0A100;   --ambar-t:#8F6500;  --ambar-f:#FDF4DC;
  --rojo:#D64545;    --rojo-t:#B23131;   --rojo-f:#FCEAEA;
  --azul-e:#1E62B8;  --azul-e-t:#1A55A0; --azul-e-f:#E7EFFA;
  --violeta:#7B5CC4; --violeta-t:#5F43A8;--violeta-f:#F0EBFA;
  --gris-e:#8A94A6;  --gris-e-t:#5B6678; --gris-e-f:#EEF1F5;
  /* Letras */
  --f-titulo:'Poppins', 'Segoe UI', system-ui, sans-serif;
  --f-texto:'Inter', 'Segoe UI', system-ui, sans-serif;
  /* Forma */
  --r-s:8px; --r:12px; --r-l:16px; --r-xl:22px;
  --s1:0 1px 2px rgba(16,36,80,.06), 0 1px 1px rgba(16,36,80,.03);
  --s2:0 6px 18px -6px rgba(16,36,80,.14), 0 2px 5px rgba(16,36,80,.05);
  --s3:0 24px 60px -18px rgba(9,30,80,.32), 0 8px 18px rgba(9,30,80,.08);
  --anim:.2s cubic-bezier(.2,.7,.3,1);
  /* Wydan (solo en la presentación) */
  --w-azul:#14294A; --w-azul-2:#1D3A66; --w-acero:#6E7C8C; --w-plata:#9AA6B4; --w-fondo:#F4F6F9; --w-texto-suave:#4A5768;
  --lateral:248px;
  color-scheme:light;
}
/* Modo oscuro (opcional, desde el menú del usuario): igual de cuidado que el claro */
html[data-tema="oscuro"]{
  --azul:#3D7BE6; --cielo:#5A93EE; --verde:#7CC63A; --hoja:#8ACB4E;
  --fondo:#0D1320; --carta:#151D2C; --borde:#26324A; --borde-2:#1E2839;
  --texto:#E7ECF4; --texto-2:#A2AEC2; --texto-3:#6F7C93;
  --tinte:#1A2742; --tinte-verde:#1A2A1A;
  --ok-t:#5FCB8A; --ok-f:#173225; --ambar-t:#F2C14E; --ambar-f:#33290F; --rojo-t:#F07C7C; --rojo-f:#3A1C1F;
  --azul-e-t:#7FAEF2; --azul-e-f:#18294A; --violeta-t:#B7A1EE; --violeta-f:#271F40; --gris-e-t:#A2AEC2; --gris-e-f:#1E2839;
  --s1:0 1px 2px rgba(0,0,0,.4); --s2:0 8px 22px -8px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.3); --s3:0 28px 70px -20px rgba(0,0,0,.75);
  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:var(--f-texto);font-size:15px;line-height:1.5;color:var(--texto);background:var(--fondo);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body.con-modal{overflow:hidden}
h1,h2,h3,h4{font-family:var(--f-titulo);font-weight:600;letter-spacing:-.01em;line-height:1.25}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--cielo);text-decoration:none}
.hidden{display:none!important}
.num,.tabular{font-variant-numeric:tabular-nums}
.ico{width:20px;height:20px;flex-shrink:0;display:inline-block;vertical-align:middle}
.ico.chico{width:16px;height:16px}.ico.grande{width:26px;height:26px}
.muted{color:var(--texto-2)} .sutil{color:var(--texto-3)}
.mt-s{margin-top:8px}.mt{margin-top:16px}.mt-l{margin-top:24px}
::selection{background:rgba(109,183,46,.28)}
:focus-visible{outline:2.5px solid var(--cielo);outline-offset:2px;border-radius:6px}

/* ---------- Botones (con respuesta al tocarlos) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;font-weight:600;font-size:14px;
  transition:transform .12s, box-shadow var(--anim), background var(--anim), border-color var(--anim), color var(--anim);white-space:nowrap;user-select:none;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn .ico{width:18px;height:18px}
.btn-prim{background:linear-gradient(180deg,#1149B3,var(--azul));color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.18) inset, 0 4px 12px -4px rgba(11,61,158,.55)}
.btn-prim:hover{background:linear-gradient(180deg,#1653C4,#0D44AE);box-shadow:0 1px 0 rgba(255,255,255,.2) inset, 0 8px 20px -6px rgba(11,61,158,.6)}
.btn-verde{background:linear-gradient(180deg,#78C23A,#5EA826);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 4px 12px -4px rgba(63,138,31,.55)}
.btn-verde:hover{background:linear-gradient(180deg,#80CA42,#62AE29)}
.btn-linea{background:var(--carta);border:1px solid var(--borde);color:var(--texto)}
.btn-linea:hover{border-color:#C3CEDF;background:var(--fondo)}
.btn-suave{background:var(--tinte);color:var(--azul)}
.btn-suave:hover{background:#E2EBF8}
html[data-tema="oscuro"] .btn-suave{color:#9CC0FA}
.btn-peligro{background:var(--rojo);color:#fff}
.btn-fantasma{color:var(--texto-2);padding:0 10px}
.btn-fantasma:hover{background:var(--tinte);color:var(--texto)}
.btn-sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn-xl{height:56px;padding:0 24px;font-size:16px;border-radius:14px}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--texto-2);transition:background var(--anim), color var(--anim), transform .12s;position:relative}
.icon-btn:hover{background:var(--tinte);color:var(--azul)}
.icon-btn:active{transform:scale(.94)}

/* ---------- Etiquetas de estado (cada una con su color) ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1}
.chip .punto{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.9}
.chip .ico{width:14px;height:14px}
.c-verde{background:var(--ok-f);color:var(--ok-t)}
.c-ambar{background:var(--ambar-f);color:var(--ambar-t)}
.c-rojo{background:var(--rojo-f);color:var(--rojo-t)}
.c-azul{background:var(--azul-e-f);color:var(--azul-e-t)}
.c-cielo{background:#E9F3FD;color:#2272C9}
html[data-tema="oscuro"] .c-cielo{background:#16304C;color:#8CC2F7}
.c-violeta{background:var(--violeta-f);color:var(--violeta-t)}
.c-gris{background:var(--gris-e-f);color:var(--gris-e-t)}
.contador{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--rojo);color:#fff;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- Tarjetas ---------- */
.tarjeta{background:var(--carta);border:1px solid var(--borde-2);border-radius:var(--r-l);box-shadow:var(--s1);padding:20px}
.tarjeta-cab{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.tarjeta-cab h3{font-size:16px;color:var(--texto)}
.tarjeta-cab .sub{font-size:13px;color:var(--texto-2)}
.tarjeta-cab .acc{margin-left:auto;display:flex;gap:6px;align-items:center}
.tarjeta-ico{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:var(--tinte);color:var(--azul);flex-shrink:0}
.tarjeta-ico.verde{background:var(--tinte-verde);color:var(--hoja)}
.tarjeta-ico.ambar{background:var(--ambar-f);color:var(--ambar-t)}
.tarjeta-ico.rojo{background:var(--rojo-f);color:var(--rojo-t)}
.tarjeta-ico.violeta{background:var(--violeta-f);color:var(--violeta-t)}
.link{color:var(--cielo);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.link:hover{text-decoration:underline}
.link .ico{width:15px;height:15px}

/* ---------- Avatar ---------- */
.avatar{width:34px;height:34px;border-radius:50%;background:var(--av);color:#fff;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;letter-spacing:.02em;font-family:var(--f-titulo);box-shadow:0 0 0 2px var(--carta)}
.avatar.chico{width:24px;height:24px;font-size:10px}
.avatar.grande{width:46px;height:46px;font-size:16px}

/* ---------- Formularios ---------- */
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-size:13px;font-weight:600;color:var(--texto-2)}
.campo .req{color:var(--rojo)}
.campo input,.campo select,.campo textarea{height:44px;padding:0 14px;border:1px solid var(--borde);border-radius:10px;background:var(--carta);font-size:15px;transition:border-color var(--anim), box-shadow var(--anim)}
.campo textarea{height:auto;min-height:88px;padding:10px 14px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--cielo);box-shadow:0 0 0 4px rgba(30,98,184,.14)}
.campo .ayuda{font-size:12.5px;color:var(--texto-3)}
/* Interruptores como los del celular */
.interruptor{position:relative;display:inline-block;width:46px;height:28px;flex-shrink:0}
.interruptor input{opacity:0;width:0;height:0}
.interruptor span{position:absolute;inset:0;border-radius:999px;background:#C9D2E0;transition:background .2s;cursor:pointer}
.interruptor span::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
.interruptor input:checked + span{background:var(--verde)}
.interruptor input:checked + span::after{transform:translateX(18px)}
html[data-tema="oscuro"] .interruptor span{background:#34405A}

/* ---------- Ventanas ---------- */
.modal-fondo{position:fixed;inset:0;z-index:700;background:rgba(10,22,48,.42);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fundido .18s ease}
.modal{background:var(--carta);border-radius:var(--r-xl);box-shadow:var(--s3);width:100%;max-width:560px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;animation:subeModal .24s cubic-bezier(.2,.8,.3,1)}
.modal.ancho{max-width:860px}
.modal-sm{max-width:420px}
.modal-cab{display:flex;align-items:flex-start;gap:12px;padding:22px 24px 12px}
.modal-cab>div{flex:1;min-width:0}
.modal-cab h2{font-size:20px}
.modal-sub{font-size:13.5px;color:var(--texto-2);margin-top:2px}
.modal-cuerpo{padding:8px 24px 20px;overflow:auto}
.modal-cuerpo h3{font-size:18px;margin-bottom:6px}
.modal-pie{display:flex;justify-content:flex-end;gap:10px;padding:14px 24px 20px;border-top:1px solid var(--borde-2)}
.modal-fondo.cerrando{animation:fundidoSale .18s ease forwards}
.dialogo{z-index:800}
@keyframes fundido{from{opacity:0}to{opacity:1}}
@keyframes fundidoSale{to{opacity:0}}
@keyframes subeModal{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

/* ---------- Avisos que entran desde abajo y se van solos ---------- */
.avisos{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:900;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(440px,calc(100vw - 32px))}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px 12px 12px;border-radius:14px;background:#14213A;color:#fff;box-shadow:var(--s3);font-size:14px;animation:entraToast .3s cubic-bezier(.2,.9,.3,1.2)}
.toast.clic{cursor:pointer}
.toast-ico{width:30px;height:30px;border-radius:9px;background:rgba(109,183,46,.22);color:#9BDB63;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.toast-mal .toast-ico{background:rgba(214,69,69,.25);color:#FF9C9C}
.toast-txt{flex:1;line-height:1.4}
.toast-txt b{color:#fff}
.toast-btn{color:#9BC3FF;font-weight:700;font-size:13px;padding:6px 8px;border-radius:8px}
.toast-btn:hover{background:rgba(255,255,255,.08)}
.toast.sale{animation:saleToast .28s ease forwards}
@keyframes entraToast{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes saleToast{to{opacity:0;transform:translateY(16px) scale(.97)}}

/* ---------- El tilde verde que se dibuja ---------- */
.tilde{width:56px;height:56px}
.tilde.chico{width:22px;height:22px}
.tilde-c{stroke:var(--verde);stroke-width:3;stroke-dasharray:145;stroke-dashoffset:145;animation:dibuja .45s cubic-bezier(.65,0,.45,1) forwards}
.tilde-p{stroke:var(--verde);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:dibuja .3s .38s cubic-bezier(.65,0,.45,1) forwards}
.tilde.chico .tilde-c{stroke:#9BDB63}.tilde.chico .tilde-p{stroke:#9BDB63;stroke-width:5}
@keyframes dibuja{to{stroke-dashoffset:0}}

/* ---------- Estados vacíos y esqueletos ---------- */
.vacio{text-align:center;padding:28px 16px;color:var(--texto-2)}
.vacio-dib{width:150px;height:auto;margin-bottom:8px}
.vacio h3{font-size:16px;color:var(--texto);margin-bottom:4px}
.vacio p{font-size:14px;max-width:340px;margin:0 auto 14px}
.esq{display:flex;flex-direction:column;gap:12px;padding:6px 0}
.esq-f{height:14px;width:var(--w);border-radius:7px;background:linear-gradient(90deg,var(--borde-2) 25%,var(--fondo) 50%,var(--borde-2) 75%);background-size:200% 100%;animation:brillo 1.2s infinite}
@keyframes brillo{to{background-position:-200% 0}}

/* ---------- Mini gráficos ---------- */
.spark{width:100%;height:34px;display:block}
.spark-l{stroke-dasharray:400;stroke-dashoffset:400;animation:dibuja 1.1s .15s cubic-bezier(.4,0,.2,1) forwards}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}


/* ===== css/02-ingreso.css ===== */
/* =====================================================================
   PRESENTACIÓN DE WYDAN · PANTALLA DE INGRESO · DESPEGUE DEL DRON
   ===================================================================== */

/* ---------- Presentación de Wydan (la pantalla es de Wydan; los colores del cliente van solo en la vista previa) ---------- */
#bienvenida{position:fixed;inset:0;z-index:600;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:44px 20px;
  background:radial-gradient(1200px 600px at 50% -10%,#FFFFFF 0%,var(--w-fondo) 60%) ,var(--w-fondo);font-family:var(--f-texto)}
.bv-in{width:100%;max-width:680px;text-align:center;margin:auto}
.bv-marca img{width:220px;max-width:60%;height:auto;display:block;margin:0 auto 30px}
.bv-para{font-size:10.5px;letter-spacing:3.6px;text-transform:uppercase;color:var(--w-plata);font-weight:600}
.bv-t{font-family:var(--f-titulo);font-size:34px;font-weight:700;color:var(--w-azul);line-height:1.15;letter-spacing:-.4px;margin-top:8px}
.bv-s{font-size:11px;letter-spacing:3.4px;text-transform:uppercase;color:var(--w-acero);margin-top:9px;font-weight:500}
.bv-frase{font-size:16.5px;line-height:1.65;color:var(--w-texto-suave);margin:22px auto 0;max-width:560px}
.bv-vista{margin:30px auto 26px;max-width:580px}
.bv-btn{display:inline-flex;align-items:center;gap:10px;background:var(--w-azul);color:#fff;font-family:var(--f-titulo);font-weight:600;font-size:16px;
  padding:16px 30px;border-radius:14px;box-shadow:0 12px 30px -10px rgba(20,41,74,.55);transition:transform .18s, background .18s, box-shadow .18s}
.bv-btn:hover{background:var(--w-azul-2);transform:translateY(-2px);box-shadow:0 18px 36px -12px rgba(20,41,74,.6)}
.bv-btn b{display:inline-block;transition:transform .18s}
.bv-btn:hover b{transform:translateX(5px)}
.bv-pie{margin-top:26px;font-size:12px;color:var(--w-plata)}
.bv-in>*{animation:bvSube .55s cubic-bezier(.2,.7,.3,1) both}
.bv-marca{animation-delay:.03s}.bv-para{animation-delay:.1s}.bv-t{animation-delay:.14s}.bv-s{animation-delay:.2s}
.bv-frase{animation-delay:.28s}.bv-vista{animation-delay:.38s}.bv-btn{animation-delay:.5s}.bv-pie{animation-delay:.6s}
@keyframes bvSube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* Vista previa en miniatura de la página, con los colores de Drones del Pampa */
.bv-prev{border-radius:16px;overflow:hidden;padding:18px;box-shadow:0 30px 60px -24px rgba(20,41,74,.45);background:linear-gradient(150deg,#0B3D9E 0%,#1E62B8 100%);position:relative}
.mini-app{display:flex;background:#F4F7FB;border-radius:10px;overflow:hidden;height:230px;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.mini-lat{width:22%;background:#fff;border-right:1px solid #E3E9F2;padding:10px 8px;display:flex;flex-direction:column;gap:6px}
.mini-lat .logo-dp{width:100%;height:auto;margin-bottom:6px}
.mini-it{height:9px;border-radius:4px;background:#E9EEF6}
.mini-it.on{background:#DCE7F8;box-shadow:inset 3px 0 0 #0B3D9E}
.mini-body{flex:1;padding:12px;display:flex;flex-direction:column;gap:8px}
.mini-tit{height:12px;width:45%;border-radius:4px;background:#0B3D9E;opacity:.85}
.mini-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mini-kpi{background:#fff;border-radius:6px;padding:6px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.mini-kpi b{display:block;font-family:var(--f-titulo);font-size:10px;color:#1B2433}
.mini-kpi small{display:block;font-size:6.5px;color:#8A94A6;margin-bottom:2px}
.mini-kpi svg{width:100%;height:14px;display:block;margin-top:3px}
.mini-tablero{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mini-col{background:#EAF0F8;border-radius:6px;padding:5px;display:flex;flex-direction:column;gap:4px}
.mini-col i{display:block;height:8px;border-radius:3px;margin-bottom:2px}
.mini-card{background:#fff;border-radius:4px;height:26px;box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;gap:4px;padding:4px;align-items:center}
.mini-card .foto-dron{width:22px;height:18px;border-radius:3px}
.mini-card span{flex:1;display:flex;flex-direction:column;gap:3px}.mini-card span u{display:block;height:4px;border-radius:2px;background:#E3E9F2;text-decoration:none}

/* ---------- Pantalla de ingreso ---------- */
#ingreso{position:fixed;inset:0;z-index:600;display:flex;flex-direction:column;overflow:auto}
.ig-fondo{position:fixed;inset:0;overflow:hidden;background:linear-gradient(140deg,#0A3590 0%,#0B3D9E 38%,#1E62B8 100%)}
.ig-campo{position:absolute;inset:-12%;animation:sobrevuelo 70s ease-in-out infinite alternate;opacity:.95}
.ig-campo svg{width:100%;height:100%;display:block}
@keyframes sobrevuelo{from{transform:translate3d(-2%,-1%,0) rotate(-1deg) scale(1.02)}to{transform:translate3d(2%,1.5%,0) rotate(1deg) scale(1.08)}}
.ig-luz{position:absolute;inset:0;background:radial-gradient(900px 520px at 50% 42%,rgba(255,255,255,.16),transparent 70%),linear-gradient(180deg,rgba(5,20,60,0) 55%,rgba(5,20,60,.45))}
.ig-centro{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px 20px}
.ig-tarjeta{width:min(460px,100%);padding:30px 30px 24px;border-radius:26px;background:rgba(255,255,255,.86);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid rgba(255,255,255,.65);box-shadow:0 40px 90px -30px rgba(3,15,50,.65), 0 2px 0 rgba(255,255,255,.7) inset;animation:tarjetaEntra .6s cubic-bezier(.2,.8,.3,1) both;color:#1B2433}
@keyframes tarjetaEntra{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.ig-tarjeta.tiembla{animation:tiembla .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes tiembla{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.ig-tarjeta.sale{animation:tarjetaSale .32s ease forwards}
@keyframes tarjetaSale{to{opacity:0;transform:scale(.96)}}
.ig-logo{display:flex;justify-content:center}
.ig-logo .logo-dp{width:250px;height:auto}
.ig-saludo{text-align:center;margin:14px 0 18px}
.ig-saludo b{display:block;font-family:var(--f-titulo);font-size:21px;color:#0B3D9E;font-weight:600}
.ig-saludo span{font-size:14px;color:#5B6678}
.ig-usuarios{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ig-u{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.75);border:1px solid #E3E9F2;text-align:left;
  transition:transform .15s, box-shadow .15s, border-color .15s, background .15s;animation:tarjetaEntra .45s calc(var(--i) * 45ms + .15s) cubic-bezier(.2,.8,.3,1) both;min-height:56px}
.ig-u:hover{border-color:#B9CBEA;background:#fff;transform:translateY(-1px);box-shadow:0 8px 18px -10px rgba(11,61,158,.45)}
.ig-u:active{transform:scale(.98)}
.ig-u b{display:block;font-size:14px;color:#1B2433;line-height:1.2}
.ig-u small{display:block;font-size:11.5px;color:#7A8597;line-height:1.25}
.ig-u .avatar{box-shadow:none}
.ig-u.ancho{grid-column:1/-1}
.ig-quien{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:#fff;border:1px solid #E3E9F2;margin-bottom:14px}
.ig-quien b{display:block;font-size:15px}.ig-quien small{color:#7A8597;font-size:12.5px}
.ig-quien button{margin-left:auto;color:#1E62B8;font-weight:600;font-size:13px;padding:6px 8px;border-radius:8px}
.ig-quien button:hover{background:#EEF3FB}
.ig-clave{position:relative}
.ig-clave input{width:100%;height:52px;border-radius:14px;border:1.5px solid #D5DEEB;background:#fff;padding:0 50px 0 16px;font-size:17px;letter-spacing:.12em;color:#1B2433;transition:border-color .15s, box-shadow .15s}
.ig-clave input:focus{outline:none;border-color:#1E62B8;box-shadow:0 0 0 4px rgba(30,98,184,.15)}
.ig-clave input.mal{border-color:#D64545;box-shadow:0 0 0 4px rgba(214,69,69,.14)}
.ig-clave .icon-btn{position:absolute;right:6px;top:6px;color:#7A8597}
.ig-error{min-height:20px;font-size:13px;color:#C23B3B;margin:6px 2px 4px;font-weight:500}
.ig-entrar{width:100%;height:52px;border-radius:14px;font-size:16px}
.ig-ayuda{display:flex;gap:8px;align-items:center;justify-content:center;font-size:12.5px;color:#6B778A;margin-top:14px}
.ig-ayuda .ico{width:16px;height:16px;color:#1E62B8}
.ig-volver{margin-top:16px;color:rgba(255,255,255,.75);font-size:13px;padding:6px 10px;border-radius:8px}
.ig-volver:hover{color:#fff;background:rgba(255,255,255,.1)}
.ig-pie{position:relative;padding:0 0 18px;display:flex;align-items:center;justify-content:center;gap:8px;color:rgba(255,255,255,.62);font-size:12px;letter-spacing:.02em;pointer-events:none}
.ig-pie img{width:20px;height:20px;border-radius:50%;background:#fff;padding:1px;opacity:.9}
.ig-pie b{color:rgba(255,255,255,.85);letter-spacing:.08em}

/* ---------- Despegue ---------- */
#despegue{position:fixed;inset:0;z-index:650;cursor:pointer}
.dg-velo{position:absolute;inset:0;background:var(--fondo);opacity:0}
.dg-logo{position:absolute;left:50%;top:50%;width:min(80vw,620px);transform:translate(-50%,-50%);opacity:0}
.dg-logo .logo-dp{width:100%;height:auto;display:block;overflow:visible}
.dg-logo .dp-hoja{transform-box:fill-box;transform-origin:50% 50%}
.dg-estela{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.gota-e{position:absolute;width:var(--t);height:var(--t);border-radius:50%;background:radial-gradient(circle,#8ED64C 0%,#6DB72E 60%,rgba(109,183,46,0) 100%);
  animation:gotaCae .9s ease-out forwards;opacity:.75}
@keyframes gotaCae{to{opacity:0;transform:translate(var(--dx),34px) scale(.35)}}
.dg-vuela{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;filter:drop-shadow(0 14px 14px rgba(11,40,100,.18))}
.dg-vuela svg{display:block;width:100%;height:100%;overflow:visible}
.dg-saltar{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--texto-3);letter-spacing:.04em;opacity:0;animation:fundido .4s .8s forwards}
/* hélices girando: se ven como discos difuminados */
.girando .dp-pala{animation:pala .09s linear infinite}
.girando .dp-disco{transition:opacity .35s;opacity:.55!important}
@keyframes pala{0%{transform:scaleX(1)}50%{transform:scaleX(.12)}100%{transform:scaleX(1)}}
.dp-helice{transform-box:view-box}
.dp-pala{transform-box:fill-box;transform-origin:50% 50%}

/* La página aparece con un fundido suave */
#app.entrando{animation:appEntra .6s ease both}
@keyframes appEntra{from{opacity:0}to{opacity:1}}

/* ---------- Variantes de fondo del ingreso ---------- */
#ingreso[data-fondo="amanecer"] .ig-fondo{background:#0B3D9E}
#ingreso[data-fondo="amanecer"] .ig-luz{background:linear-gradient(180deg,rgba(5,20,60,0) 60%,rgba(5,25,10,.45))}
#ingreso[data-fondo="mision"] .ig-fondo{background:#06122B}
#ingreso[data-fondo="mision"] .ig-luz{background:radial-gradient(800px 500px at 50% 45%,rgba(30,98,184,.18),transparent 70%)}
#ingreso[data-fondo="satelital"] .ig-fondo{background:#5E8A31}
#ingreso[data-fondo="satelital"] .ig-luz{background:linear-gradient(180deg,rgba(5,20,60,0) 55%,rgba(5,20,46,.5))}
#ingreso[data-fondo="topo"] .ig-fondo{background:#F4F7FB}
#ingreso[data-fondo="topo"] .ig-luz{background:radial-gradient(900px 560px at 50% 45%,rgba(255,255,255,.85),transparent 70%)}
#ingreso[data-fondo="topo"] .ig-tarjeta{background:#fff;border-color:#E3E9F2;box-shadow:0 40px 90px -36px rgba(11,40,100,.35), 0 2px 6px rgba(11,40,100,.06)}
#ingreso[data-fondo="topo"] .ig-volver{color:#5B6678}
#ingreso[data-fondo="topo"] .ig-volver:hover{color:#0B3D9E;background:#EEF3FB}
#ingreso[data-fondo="topo"] .ig-pie{color:#8A94A6}
#ingreso[data-fondo="topo"] .ig-pie b{color:#5B6678}
#ingreso[data-fondo="topo"] .ig-pie img{background:transparent}


/* ===== css/03-app.css ===== */
/* =====================================================================
   LA PÁGINA: menú lateral, barra de arriba, panel y ventanas comunes
   ===================================================================== */
.solo-cel{display:none!important}

/* ---------- Menú lateral ---------- */
.lateral{position:fixed;left:0;top:0;bottom:0;width:var(--lateral);background:var(--carta);border-right:1px solid var(--borde-2);display:flex;flex-direction:column;z-index:60}
.lat-marca{padding:20px 22px 12px}
.lat-logo{display:block;width:100%;border-radius:10px}
.lat-marca .logo-dp{width:172px;height:auto;display:block;overflow:visible}
.lat-nav{flex:1;overflow:auto;padding:6px 0 10px;scrollbar-width:thin}
.lat-nav hr{border:none;height:1px;background:var(--borde-2);margin:8px 22px}
.nav-it{position:relative;display:flex;align-items:center;gap:12px;width:calc(100% - 20px);height:40px;margin:1px 10px;padding:0 12px;border-radius:10px;color:var(--texto-2);font-size:14px;font-weight:500;text-align:left;transition:background var(--anim), color var(--anim)}
.nav-it .ico{width:19px;height:19px}
.nav-it span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-it:hover{background:var(--fondo);color:var(--texto)}
.nav-it.on{background:var(--tinte);color:var(--azul);font-weight:600}
.nav-it.on::before{content:'';position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--azul)}
.contador.gris{background:var(--gris-e-f);color:var(--texto-2)}
.lat-pie{padding:10px 12px 14px;border-top:1px solid var(--borde-2)}
.lat-usuario{display:flex;align-items:center;gap:10px;padding:6px 6px 10px}
.lat-usuario span{flex:1;min-width:0}
.lat-usuario b{display:block;font-size:14px;line-height:1.2}
.lat-usuario small{display:block;font-size:12px;color:var(--texto-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lat-wydan{display:flex;align-items:center;gap:7px;padding:0 8px;font-size:11px;color:var(--texto-3);letter-spacing:.02em}
.lat-wydan img{width:16px;height:16px;border-radius:50%;opacity:.85}
.lat-wydan b{letter-spacing:.08em;color:var(--texto-2)}
.velo{position:fixed;inset:0;background:rgba(10,22,48,.4);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
.velo.on{opacity:1;pointer-events:auto}

/* ---------- Barra de arriba ---------- */
.tope{position:sticky;top:0;z-index:50;margin-left:var(--lateral);height:68px;display:flex;align-items:center;gap:12px;padding:0 28px;
  background:color-mix(in srgb,var(--fondo) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--borde-2)}
.tope-logo{display:none}
.buscador{display:flex;align-items:center;gap:10px;height:42px;width:min(400px,34vw);padding:0 10px 0 14px;border-radius:12px;background:var(--carta);border:1px solid var(--borde);color:var(--texto-3);font-size:14px;box-shadow:var(--s1);transition:border-color var(--anim), box-shadow var(--anim)}
.buscador:hover{border-color:#C3CEDF;box-shadow:var(--s2)}
.buscador .ico{width:18px;height:18px}
.bus-ph{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font-family:var(--f-texto);font-size:11px;font-weight:600;color:var(--texto-2);background:var(--fondo);border:1px solid var(--borde);border-bottom-width:2px;border-radius:6px;padding:2px 6px;white-space:nowrap}
.tope-rapidos{display:flex;gap:8px}
.tope-der{margin-left:auto;display:flex;align-items:center;gap:4px;position:relative}
.campana-n{position:absolute;top:3px;right:2px;min-width:18px;height:18px;font-size:10px;padding:0 5px;box-shadow:0 0 0 2px var(--fondo)}
.campana-caja{position:relative}
.tope-yo{margin-left:6px;border-radius:50%;transition:transform .12s}
.tope-yo:active{transform:scale(.94)}

/* Campanita */
.campana-panel{position:absolute;right:-8px;top:50px;width:400px;max-height:min(72vh,620px);display:flex;flex-direction:column;background:var(--carta);border:1px solid var(--borde-2);border-radius:18px;box-shadow:var(--s3);z-index:80;animation:subeModal .2s ease}
.cp-cab{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.cp-cab b{font-family:var(--f-titulo);font-size:16px}
.cp-lista{overflow:auto;padding:0 8px 8px}
.cp-it{display:flex;align-items:flex-start;gap:12px;width:100%;padding:10px;border-radius:12px;text-align:left;position:relative}
.cp-it:hover{background:var(--fondo)}
.cp-it.leido{opacity:.62}
.cp-ico{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.cp-ico .ico{width:18px;height:18px}
.cp-txt{flex:1;min-width:0}
.cp-txt b{display:block;font-size:13.5px;font-weight:600;line-height:1.35}
.cp-txt small{display:block;font-size:12.5px;color:var(--texto-3);margin-top:2px}
.cp-nuevo{width:8px;height:8px;border-radius:50%;background:var(--cielo);margin-top:6px;flex-shrink:0}
/* Menú del usuario */
.menu-yo{position:absolute;right:0;top:54px;width:270px;background:var(--carta);border:1px solid var(--borde-2);border-radius:18px;box-shadow:var(--s3);padding:8px;z-index:80;animation:subeModal .2s ease}
.my-cab{display:flex;align-items:center;gap:12px;padding:10px 10px 12px}
.my-cab b{display:block}.my-cab small{color:var(--texto-3);font-size:12.5px}
.menu-yo button{display:flex;align-items:center;gap:12px;width:100%;height:42px;padding:0 12px;border-radius:10px;font-size:14px;color:var(--texto);text-align:left}
.menu-yo button .ico{color:var(--texto-2)}
.menu-yo button:hover{background:var(--fondo)}
.menu-yo hr{border:none;height:1px;background:var(--borde-2);margin:6px 4px}
.my-bloq{color:var(--rojo-t)!important}.my-bloq .ico{color:var(--rojo-t)!important}

/* Franja amarilla fija mientras haya pedidos esperando */
.franja{position:sticky;top:68px;z-index:45;margin-left:var(--lateral);display:flex;align-items:center;gap:12px;padding:10px 28px;background:#FFF4D2;border-bottom:1px solid #F1DC9B;color:#6B4E00;font-size:14px;animation:franjaEntra .3s ease}
html[data-tema="oscuro"] .franja{background:#33290F;border-color:#4A3B12;color:#F2C14E}
.franja b{font-weight:700}
.fr-ico{width:28px;height:28px;border-radius:8px;background:rgba(224,161,0,.2);display:inline-flex;align-items:center;justify-content:center;color:#9A6C00}
.fr-ico .ico{width:16px;height:16px}
.fr-urg{color:var(--rojo-t)}
.franja button{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px;color:#6B4E00;padding:6px 10px;border-radius:8px;background:rgba(224,161,0,.18)}
html[data-tema="oscuro"] .franja button{color:#F2C14E}
.franja button .ico{width:15px;height:15px}
@keyframes franjaEntra{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* Cartel en el momento (pedido que llega) */
.cartel{position:fixed;top:84px;right:24px;z-index:880;width:min(440px,calc(100vw - 24px));display:flex;align-items:center;gap:12px;padding:14px 10px 14px 14px;border-radius:16px;background:var(--carta);border:1px solid var(--borde-2);box-shadow:var(--s3), 0 0 0 4px rgba(224,161,0,.18)}
.cartel.entra{animation:cartelEntra .45s cubic-bezier(.2,.9,.3,1.15)}
@keyframes cartelEntra{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.ct-ico{width:40px;height:40px;border-radius:12px;background:var(--ambar-f);color:var(--ambar-t);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;animation:latido 1.2s ease 2}
@keyframes latido{50%{transform:scale(1.12)}}
.ct-txt{flex:1;font-size:14px;line-height:1.4}

/* ---------- Contenido ---------- */
.principal{margin-left:var(--lateral);padding:26px 32px 56px;max-width:calc(1480px + var(--lateral))}
.vista-entra{animation:vistaEntra .28s cubic-bezier(.2,.7,.3,1)}
@keyframes vistaEntra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.enc{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.enc-pre{font-size:13px;color:var(--texto-3);font-weight:500}
.enc-pre::first-letter{text-transform:uppercase}
.enc h1{font-size:28px;color:var(--azul);margin-top:2px}
html[data-tema="oscuro"] .enc h1{color:var(--texto)}
.enc-sub{color:var(--texto-2);margin-top:4px;font-size:15px}
.enc-sub b{color:var(--texto);font-weight:600}
.txt-ambar{color:var(--ambar-t)!important}.txt-rojo{color:var(--rojo-t)}
.enc-acc{display:flex;gap:8px}
.grilla{display:grid;gap:16px;margin-top:16px}
.g-7-5{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pie-pag{text-align:center;color:var(--texto-3);font-size:12px;margin-top:28px}
.pie-pag b{letter-spacing:.08em;color:var(--texto-2)}

/* KPIs con su tendencia de la semana */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{background:var(--carta);border:1px solid var(--borde-2);border-radius:var(--r-l);box-shadow:var(--s1);padding:16px 18px 12px;transition:box-shadow var(--anim), transform var(--anim)}
.kpi:hover{box-shadow:var(--s2);transform:translateY(-1px)}
.kpi-cab{display:flex;align-items:center;gap:10px}
.kpi-ico{width:32px;height:32px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--k) 12%,transparent);color:var(--k)}
html[data-tema="oscuro"] .kpi-ico{background:color-mix(in srgb,var(--k) 26%,transparent);color:color-mix(in srgb,var(--k) 55%,#fff)}
.kpi-ico .ico{width:17px;height:17px}
.kpi-t{font-size:13px;font-weight:600;color:var(--texto-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kpi-var{flex-shrink:0;white-space:nowrap;margin-left:auto;display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:700;padding:2px 7px 2px 4px;border-radius:999px}
.kpi-var .ico{width:14px;height:14px}
.kpi-var.bien{background:var(--ok-f);color:var(--ok-t)}.kpi-var.mal{background:var(--rojo-f);color:var(--rojo-t)}
.kpi-v{font-family:var(--f-titulo);font-size:27px;font-weight:600;margin:10px 0 2px;letter-spacing:-.01em}
.kpi-pie{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--texto-2);margin-bottom:6px}

/* Para aprobar */
.aprobar-bloque{margin-bottom:16px;border-color:#F1DC9B;background:linear-gradient(180deg,#FFFBEE 0,var(--carta) 120px)}
html[data-tema="oscuro"] .aprobar-bloque{border-color:#4A3B12;background:linear-gradient(180deg,#221D10 0,var(--carta) 120px)}
.tarjeta-cab h3 .contador{vertical-align:2px;margin-left:4px}
.ap-lista{display:flex;flex-direction:column}
.ap-fila{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 4px;border-top:1px solid var(--borde-2);transition:opacity .35s, transform .35s}
.ap-fila.urgente{background:linear-gradient(90deg,var(--rojo-f),transparent 70%);border-radius:12px;padding-left:10px;margin:0 -6px;border-top-color:transparent}
.ap-fila.aprobada{opacity:.6}
.ap-tipo{width:38px;height:38px;border-radius:11px;background:var(--fondo);color:var(--azul);display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--borde-2)}
.ap-tipo .ico{width:18px;height:18px}
.ap-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14.5px;line-height:1.4}
.ap-det{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ap-item{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 9px;border-radius:8px;background:var(--fondo);border:1px solid var(--borde-2)}
.ap-item small{color:var(--texto-3);font-size:11.5px}
.ap-item.falta{background:var(--rojo-f);border-color:#F3C6C6;color:var(--rojo-t)}
.ap-item.falta small{color:var(--rojo-t)}
.ap-item.ok{background:var(--ok-f);border-color:transparent;color:var(--ok-t)}
.ap-cuando{font-size:12.5px;color:var(--texto-3);margin-top:6px}
.ap-acc{display:flex;gap:8px;align-items:center}
.ap-acc .tilde{width:40px;height:40px}
.ap-mas{display:flex;align-items:center;gap:4px;margin-top:6px;padding:10px 4px 0;border-top:1px solid var(--borde-2);width:100%;font-size:13px;font-weight:600;color:var(--cielo)}

/* Drones recibidos hoy */
.hoy-lista{display:flex;flex-direction:column;gap:10px}
.dron-hoy{display:grid;grid-template-columns:132px minmax(0,1fr);border:1px solid var(--borde-2);border-radius:14px;overflow:hidden;text-align:left;background:var(--carta);transition:box-shadow var(--anim), transform var(--anim), border-color var(--anim);animation:vistaEntra .4s calc(var(--i) * 70ms) both}
.dron-hoy:hover{box-shadow:var(--s2);transform:translateY(-1px);border-color:var(--borde)}
.dh-foto{position:relative;min-height:112px}
.dh-foto .foto-dron,.lo-foto .foto-dron,.md-foto .foto-dron,.fo-foto .foto-dron{position:absolute;inset:0;width:100%;height:100%}
.dh-hora{position:absolute;left:8px;top:8px;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.92);color:#1B2433;padding:2px 7px;border-radius:7px;font-variant-numeric:tabular-nums}
.dh-txt{padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.dh-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dh-top b{font-family:var(--f-titulo);font-weight:600;font-size:15px}
.dh-cli{font-size:13.5px;color:var(--texto);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh-sint{font-size:13px;color:var(--texto-2);display:flex;align-items:center;gap:5px}
.dh-sint .ico{color:var(--ambar)}
.dh-tec{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--texto-2);margin-top:4px}
.dh-tec .sutil{margin-left:auto}

/* Drones en el taller por estado */
.estados{display:flex;flex-direction:column}
.est-fila{display:grid;grid-template-columns:6px minmax(0,1fr) auto 18px;gap:12px;align-items:center;height:46px;padding:0 8px 0 4px;border-radius:10px;text-align:left;font-size:14px;color:var(--texto);transition:background var(--anim)}
.est-fila:hover{background:var(--fondo)}
.est-fila + .est-fila{border-top:1px solid var(--borde-2)}
.est-fila b{font-family:var(--f-titulo);font-size:20px;font-weight:600;min-width:28px;text-align:right}
.est-fila .ico{color:var(--texto-3)}
.est-barra{width:6px;height:24px;border-radius:3px;background:currentColor}
.aviso-linea{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:10px 12px;border-radius:12px;font-size:13.5px;text-align:left}
.aviso-linea.rojo{background:var(--rojo-f);color:var(--rojo-t)}
.aviso-linea span{flex:1}

/* Centro de baterías */
.bat-est{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.bat-e{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 2px;border-radius:12px;font-size:11.5px;color:var(--texto-2);line-height:1.25;text-align:center}
.bat-e:hover{background:var(--fondo)}
.bat-n{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-titulo);font-size:18px;font-weight:600}
.bat-barra{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:12px;gap:2px}
.bat-barra i.c-gris{background:var(--gris-e)}.bat-barra i.c-cielo{background:#4F95E0}.bat-barra i.c-azul{background:var(--azul-e)}.bat-barra i.c-ambar{background:var(--ambar)}.bat-barra i.c-verde{background:var(--ok)}

/* Stock */
.st-g{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.st-g .chip{align-self:flex-start;margin-bottom:4px}
.st-fila{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 6px;border-radius:8px;font-size:13px;text-align:left}
.st-fila:hover{background:var(--fondo)}
.st-cod{font-size:12px;color:var(--texto-3);font-weight:600}
.st-nom{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-fila b{font-size:14px}.st-fila b small{color:var(--texto-3);font-weight:500;font-size:11.5px}
.st-mas{font-size:12.5px;color:var(--cielo);font-weight:600;text-align:left;padding:4px 6px}

/* Pedido a Dragur */
.pd-num{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.pd-num b{font-family:var(--f-titulo);font-size:40px;font-weight:600;color:var(--hoja);line-height:1}
.pd-num span{font-size:14px;color:var(--texto-2);line-height:1.3}
.pd-lineas{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.pd-lineas div{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:6px;font-size:13px;align-items:center}
.pd-lineas span:nth-child(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd-lineas small{font-size:11.5px;color:var(--texto-3)}
.pd-acc{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12.5px}

/* Cobros */
.cobros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cb{padding:12px 14px;border-radius:12px;background:var(--fondo);border:1px solid var(--borde-2);display:flex;flex-direction:column;gap:2px}
.cb small{font-size:12.5px;color:var(--texto-2);font-weight:600}
.cb b{font-family:var(--f-titulo);font-size:21px;font-weight:600}
.cb span{font-size:12px;color:var(--texto-3)}
.cb.rojo{background:var(--rojo-f);border-color:transparent}.cb.rojo b{color:var(--rojo-t)}
.cb.ambar{background:var(--ambar-f);border-color:transparent}.cb.ambar b{color:var(--ambar-t)}
.deben{margin-top:14px}
.deben-t{display:block;font-size:12px;font-weight:600;color:var(--texto-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.deb-fila{display:grid;grid-template-columns:24px minmax(0,1fr) auto 36px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--borde-2)}
.deb-n b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deb-n small{font-size:12px;color:var(--texto-3)}
.icon-btn.wa{width:36px;height:36px;color:#1FA855}
.icon-btn.wa:hover{background:#E5F7EC;color:#178A45}

/* Órdenes atrasadas */
.atr-lista{display:flex;flex-direction:column}
.atr-fila{display:grid;grid-template-columns:48px minmax(0,1fr) auto 26px;gap:12px;align-items:center;padding:8px 6px;border-radius:10px;text-align:left}
.atr-fila:hover{background:var(--fondo)}
.atr-fila + .atr-fila{border-top:1px solid var(--borde-2)}
.atr-d{width:48px;height:48px;border-radius:12px;background:var(--rojo-f);color:var(--rojo-t);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.atr-d b{font-family:var(--f-titulo);font-size:18px}.atr-d small{font-size:10px;font-weight:600}
.atr-t{min-width:0}
.atr-t b,.atr-t small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atr-t b{font-size:13.5px}.atr-t small{font-size:12.5px;color:var(--texto-2)}
.atr-fila .chip{max-width:150px;overflow:hidden;text-overflow:ellipsis}

/* Números del mes */
.numeros{margin-top:16px}
.seg{display:inline-flex;background:var(--fondo);border:1px solid var(--borde-2);border-radius:10px;padding:3px}
.seg button{height:30px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--texto-2)}
.seg button.on{background:var(--carta);color:var(--azul);box-shadow:var(--s1)}
.num-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.num-grid h4{font-size:14px;color:var(--texto-2);font-weight:600;margin-bottom:12px;font-family:var(--f-texto)}
.barra-f{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;gap:12px;align-items:center;min-height:38px}
.barra-f.rep{grid-template-columns:minmax(0,230px) minmax(0,1fr) 40px}
.bf-n{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;min-width:0}
.bf-tx{min-width:0}.bf-tx b{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bf-tx small{font-size:11.5px;color:var(--texto-3)}
.rk{width:22px;height:22px;border-radius:7px;background:var(--fondo);color:var(--texto-2);font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.bf-b{height:10px;border-radius:5px;background:var(--fondo);overflow:hidden}
.bf-b i{display:block;height:100%;width:var(--w);border-radius:5px;background:linear-gradient(90deg,var(--azul),var(--cielo));animation:crece .9s var(--d) cubic-bezier(.2,.8,.3,1) both}
.bf-b.verde i{background:linear-gradient(90deg,var(--hoja),var(--verde))}
@keyframes crece{from{width:0}}
.barra-f b{text-align:right;font-size:14px}
.bf-tot{margin-top:10px;font-size:12.5px}

/* Inicio del técnico */
.gran-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.gran-btn{height:108px;border-radius:18px;background:var(--carta);border:1px solid var(--borde-2);box-shadow:var(--s1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:15.5px;font-weight:600;color:var(--texto);transition:transform .12s, box-shadow var(--anim)}
.gran-btn .ico{width:30px;height:30px;color:var(--azul)}
.gran-btn:hover{box-shadow:var(--s2)}
.gran-btn:active{transform:scale(.97)}
.gran-btn.prim{background:linear-gradient(160deg,#1550BF,var(--azul));color:#fff;border-color:transparent;box-shadow:0 10px 24px -10px rgba(11,61,158,.7)}
.gran-btn.prim .ico{color:#fff}
.gran-btn.verde{background:linear-gradient(160deg,#7CC63A,#5AA425);color:#fff;border-color:transparent;box-shadow:0 10px 24px -10px rgba(63,138,31,.7)}
.gran-btn.verde .ico{color:#fff}
.mis-drones{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.md-card{display:grid;grid-template-columns:110px minmax(0,1fr);border:1px solid var(--borde-2);border-radius:16px;overflow:hidden;text-align:left;background:var(--carta);transition:box-shadow var(--anim);animation:vistaEntra .4s calc(var(--i) * 60ms) both}
.md-card:hover{box-shadow:var(--s2)}
.md-foto{position:relative;min-height:118px}
.md-txt{padding:12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:0}
.md-txt b{font-family:var(--f-titulo);font-size:15px;font-weight:600}
.md-txt span{font-size:13.5px;color:var(--texto-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.md-txt small{font-size:12px;color:var(--texto-3)}
.mis-ped{display:flex;flex-direction:column}
.mp-fila{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--borde-2)}
.mp-fila:first-child{border-top:none}
.mp-t b{display:block;font-size:14px;font-weight:600}.mp-t small{font-size:12.5px;color:var(--texto-3)}

/* Sección que llega en la próxima entrega */
.pronto{text-align:center;padding:36px 24px;max-width:620px;margin:0 auto}
.pronto h3{font-size:19px;color:var(--azul);margin:6px 0}
.pronto p{color:var(--texto-2)}
.pronto ul{list-style:none;display:inline-flex;flex-direction:column;gap:8px;text-align:left;margin-top:14px}
.pronto li{display:flex;gap:8px;align-items:center;font-size:14.5px}
.pronto li .ico{color:var(--verde)}

/* ---------- Buscador general ---------- */
.bus-fondo{position:fixed;inset:0;z-index:760;background:rgba(10,22,48,.38);backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;padding:11vh 16px 16px;animation:fundido .15s}
.bus-caja{width:min(660px,100%);background:var(--carta);border-radius:20px;box-shadow:var(--s3);overflow:hidden;animation:subeModal .2s cubic-bezier(.2,.8,.3,1)}
.bus-in{display:flex;align-items:center;gap:12px;padding:0 18px;height:62px;border-bottom:1px solid var(--borde-2);color:var(--texto-3)}
.bus-in input{flex:1;height:100%;border:none;background:none;font-size:17px;outline:none;color:var(--texto)}
.bus-res{max-height:min(60vh,520px);overflow:auto;padding:8px}
.bus-sug{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px}
.bus-sug small{font-size:12.5px;color:var(--texto-3);margin-right:4px}
.bus-sug button{font-size:13px;padding:5px 10px;border-radius:8px;background:var(--fondo);border:1px solid var(--borde-2)}
.bus-sug button:hover{border-color:var(--borde)}
.bus-g>small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--texto-3);padding:10px 10px 4px}
.bus-it{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:10px;text-align:left;color:var(--texto-2)}
.bus-it span{flex:1;min-width:0}
.bus-it b{display:block;font-weight:600;font-size:14px;color:var(--texto);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bus-it small{display:block;font-size:12.5px;color:var(--texto-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bus-it:hover,.bus-it.sel{background:var(--tinte)}
.bus-it.sel{box-shadow:inset 3px 0 0 var(--cielo)}
.bus-it mark{background:rgba(109,183,46,.3);color:inherit;border-radius:3px;padding:0 1px}
.bus-nada{text-align:center;padding:36px 10px;color:var(--texto-3)}

/* ---------- Escáner ---------- */
.modal.modal-escaner{max-width:580px}
.esc-visor{position:relative;aspect-ratio:4/3;max-height:42vh;width:100%;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#1A2740,#0A1120);color:#9AA7BD}
.esc-visor video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.esc-visor.con-video video{opacity:1}
.esc-sin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:13.5px;text-align:center;padding:0 40px}
.esc-marco{position:absolute;left:14%;right:14%;top:22%;bottom:22%}
.esc-marco i{position:absolute;width:30px;height:30px;border:4px solid #fff;border-radius:4px}
.esc-marco i:nth-child(1){left:0;top:0;border-right:none;border-bottom:none;border-top-left-radius:12px}
.esc-marco i:nth-child(2){right:0;top:0;border-left:none;border-bottom:none;border-top-right-radius:12px}
.esc-marco i:nth-child(3){left:0;bottom:0;border-right:none;border-top:none;border-bottom-left-radius:12px}
.esc-marco i:nth-child(4){right:0;bottom:0;border-left:none;border-top:none;border-bottom-right-radius:12px}
.esc-visor:not(.con-video) .esc-laser{display:none}
.esc-visor:not(.con-video) .esc-marco{opacity:.35}
.esc-laser{position:absolute;left:6%;right:6%;height:2px;top:50%;background:#7CF24A;box-shadow:0 0 12px 2px rgba(124,242,74,.75);animation:laser 1.8s ease-in-out infinite alternate}
@keyframes laser{from{top:12%}to{top:88%}}
.esc-pista{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:12.5px;color:rgba(255,255,255,.8)}
.esc-visor.leido::after{content:'';position:absolute;inset:0;border-radius:18px;box-shadow:inset 0 0 0 4px #6DB72E;background:rgba(109,183,46,.18);animation:fundidoSale .7s ease forwards}
.esc-marco{left:6%;right:6%;top:26%;bottom:26%}
.esc-ctrl{position:absolute;top:10px;right:10px;display:flex;gap:8px}
.esc-ctrl button{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.5)}
.esc-ctrl button.on{background:#fff;color:#0B3D9E}
.esc-sacar{width:100%;justify-content:center;margin-top:10px;cursor:pointer}
.esc-leyendo{margin-top:14px;padding:14px;border-radius:12px;background:var(--fondo);display:flex;gap:8px;align-items:center;font-size:14px;color:var(--texto-2)}
.esc-manual{margin-top:14px}
.esc-in{display:flex;gap:8px}
.esc-in input{flex:1;min-width:0}
.esc-ej{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.esc-ej small{font-size:12.5px;color:var(--texto-3)}
.esc-ej button{font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--fondo);border:1px solid var(--borde-2)}
.esc-ej button:hover{border-color:var(--cielo);color:var(--cielo)}
.esc-ficha{display:grid;grid-template-columns:92px minmax(0,1fr);gap:16px;margin-top:16px;padding:16px;border-radius:16px;border:1px solid var(--borde-2);background:var(--fondo);animation:subeModal .25s ease}
.esc-foto{width:92px;height:92px;border-radius:14px;background:var(--carta);border:1px solid var(--borde-2);display:flex;align-items:center;justify-content:center;color:var(--azul);overflow:hidden;position:relative}
.esc-foto .foto-dron{position:absolute;inset:0;width:100%;height:100%}
.esc-foto .ico{width:38px;height:38px}
.esc-datos small{font-size:12px;color:var(--texto-3);font-weight:600}
.esc-datos h3{font-size:18px;margin:2px 0 6px}
.esc-datos p{font-size:13.5px;color:var(--texto-2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.esc-precio{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.esc-precio b{font-family:var(--f-titulo);font-size:30px;font-weight:600;color:var(--azul)}
.esc-precio span{font-size:12.5px;color:var(--texto-3)}
.esc-disp{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:6px;font-size:13px;color:var(--texto-2)}
.esc-disp span{display:inline-flex;align-items:center;gap:4px}
.esc-usado{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--carta);border:1px dashed var(--borde);font-size:13px}
.esc-acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.esc-nada{margin-top:14px;padding:14px;border-radius:12px;background:var(--rojo-f);color:var(--rojo-t);display:flex;gap:8px;align-items:center;font-size:14px}

/* ---------- Vista rápida de una orden y listas ---------- */
.fo-grid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px}
.fo-foto{position:relative;border-radius:16px;overflow:hidden;min-height:180px}
.fo-fila{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fo-dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.fo-dl dt{color:var(--texto-3)}
.fo-dl dd{display:flex;align-items:center;gap:6px}
.fo-t{margin:20px 0 10px;font-size:15px}
.fo-hist{list-style:none;border-left:2px solid var(--borde);margin-left:6px;padding-left:16px;display:flex;flex-direction:column;gap:10px}
.fo-hist li{position:relative;font-size:13.5px}
.fo-hist li::before{content:'';position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--carta);border:2px solid var(--cielo)}
.fo-hist li:first-child::before{background:var(--cielo)}
.fo-hist b{display:block;font-weight:500}
.fo-hist small{color:var(--texto-3);font-size:12.5px}
.lista-ord{display:flex;flex-direction:column;gap:8px}
.lo-fila{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px;border-radius:14px;border:1px solid var(--borde-2);text-align:left}
.lo-fila:hover{background:var(--fondo)}
.lo-foto{position:relative;height:56px;border-radius:10px;overflow:hidden}
.lo-txt b{display:block;font-size:14px}.lo-txt small{font-size:12.5px;color:var(--texto-2)}
.lo-der{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.lo-der small{font-size:12px;color:var(--texto-3);display:flex;align-items:center;gap:4px}

@media (max-width:1280px){
  .g-3{grid-template-columns:1fr 1fr}
  .g-3>:last-child{grid-column:1/-1}
  .tope-rapidos .btn-linea{display:none}
}
@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-7-5{grid-template-columns:1fr}
  .num-grid{grid-template-columns:1fr}
}

/* En modo oscuro, las letras azules del logo pasan a blanco para que se lean sobre el fondo oscuro */
html[data-tema="oscuro"] .lat-marca .dp-drones,html[data-tema="oscuro"] .lat-marca .dp-pampa,
html[data-tema="oscuro"] .tope-logo .dp-drones,html[data-tema="oscuro"] .tope-logo .dp-pampa{fill:#EAF0FA}


/* ===== css/04-celular.css ===== */
/* =====================================================================
   VISTA CELULAR (automática en el celular y con botón en la compu)
   Botones grandes (48 px o más), letra de 16 px o más, buen contraste
   para leer al sol, menú abajo y el botón Escanear fijo en el centro.
   ===================================================================== */
body.cel{font-size:16px}
body.cel .solo-cel{display:inline-flex!important}
body.cel .solo-pc{display:none!important}
/* El menú lateral pasa a ser un cajón que se abre desde «Más» */
body.cel .lateral{width:min(300px,86vw);transform:translateX(-102%);transition:transform .26s cubic-bezier(.2,.8,.3,1);z-index:320;box-shadow:var(--s3)}
body.cel .lateral.abierto{transform:none}
body.cel .velo{z-index:310}
body.cel .nav-it{height:48px;font-size:15.5px}
body.cel .tope{margin-left:0;height:60px;padding:0 10px 0 14px;gap:6px}
body.cel .tope-logo{display:block}
body.cel .tope-logo .logo-dp{height:38px;width:auto;display:block;overflow:visible}
body.cel .buscador,body.cel .tope-rapidos{display:none}
body.cel .icon-btn{width:44px;height:44px}
body.cel .campana-panel{position:fixed;left:10px;right:10px;top:66px;width:auto}
body.cel .menu-yo{position:fixed;right:10px;top:66px}
body.cel .franja{margin-left:0;top:60px;padding:10px 14px;font-size:14px}
body.cel .principal{margin-left:0;padding:16px 14px calc(104px + env(safe-area-inset-bottom))}
body.cel .enc{flex-direction:column;align-items:flex-start;margin-bottom:16px}
body.cel .enc h1{font-size:23px}
body.cel .kpis{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
body.cel .tarjeta-cab .sub{display:none}
body.cel .tarjeta-cab .link{white-space:nowrap}
body.cel .kpi{padding:12px 12px 8px}
body.cel .kpi-v{font-size:19px}
body.cel .kpi-t{font-size:12px;line-height:1.25}
body.cel .kv-txt{display:none}
body.cel .kpi-ico{width:28px;height:28px}
body.cel .kpi-pie span.sutil{display:none}
body.cel .grilla,body.cel .g-3,body.cel .g-7-5{grid-template-columns:1fr;gap:12px;margin-top:12px}
body.cel .g-3>:last-child{grid-column:auto}
body.cel .tarjeta{padding:16px;border-radius:18px}
body.cel .num-grid{grid-template-columns:1fr;gap:22px}
body.cel .barra-f{grid-template-columns:110px minmax(0,1fr) 54px}
body.cel .barra-f.rep{grid-template-columns:minmax(0,1fr) 70px 30px}
body.cel .cobros{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
body.cel .cobros .cb:last-child{grid-column:1/-1}
body.cel .dron-hoy{grid-template-columns:104px minmax(0,1fr)}
body.cel .ap-fila{grid-template-columns:38px minmax(0,1fr)}
body.cel .ap-acc{grid-column:1/-1;justify-content:flex-end}
body.cel .ap-acc .btn{height:44px;padding:0 18px;font-size:14.5px}
body.cel .ap-acc .btn-verde{flex:1}
body.cel .gran-grid{grid-template-columns:1fr 1fr;gap:10px}
body.cel .gran-btn{height:104px;font-size:16px}
body.cel .mis-drones{grid-template-columns:1fr}
body.cel .btn{height:46px;font-size:15px}
body.cel .btn-sm{height:38px;font-size:14px}
body.cel .campo input,body.cel .campo select,body.cel .campo textarea{font-size:16px;height:50px}
body.cel .modal-fondo{align-items:flex-end;padding:0}
body.cel .modal{max-width:none;border-radius:24px 24px 0 0;max-height:94vh;animation:subeHoja .3s cubic-bezier(.2,.8,.3,1)}
@keyframes subeHoja{from{transform:translateY(40%);opacity:.6}to{transform:none;opacity:1}}
body.cel .modal-cab{padding:18px 18px 8px}
body.cel .modal-cuerpo{padding:6px 18px 18px}
body.cel .modal-pie{padding:12px 18px calc(16px + env(safe-area-inset-bottom))}
body.cel .modal-pie .btn{flex:1}
body.cel .fo-grid{grid-template-columns:1fr}
body.cel .fo-foto{min-height:170px}
body.cel .bus-fondo{padding:0}
body.cel .bus-caja{border-radius:0;height:100%;display:flex;flex-direction:column}
body.cel .bus-res{max-height:none;flex:1}
body.cel .cartel{top:68px;right:10px;left:10px;width:auto}
body.cel .avisos{bottom:calc(96px + env(safe-area-inset-bottom))}

/* Barra de abajo con el botón Escanear en el centro */
.barra-cel{display:none}
body.cel .barra-cel{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;align-items:stretch;justify-content:space-around;height:calc(70px + env(safe-area-inset-bottom));padding:0 6px env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--carta) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--borde-2);box-shadow:0 -6px 20px -12px rgba(16,36,80,.2)}
.bc-it{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--texto-3);min-width:56px}
.bc-it .ico{width:24px;height:24px}
.bc-it.on{color:var(--azul)}
.bc-it.on::after{content:'';position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--azul)}
.bc-it .contador{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;font-size:10px;padding:0 5px}
.bc-scan{flex:0 0 76px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--azul);margin-top:-22px}
.bc-scan .ico{width:62px;height:62px;padding:16px;border-radius:50%;color:#fff;background:linear-gradient(160deg,#1A57C8,var(--azul));box-shadow:0 10px 22px -6px rgba(11,61,158,.65), 0 0 0 5px var(--carta);transition:transform .12s}
.bc-scan:active .ico{transform:scale(.93)}

/* En la compu, con «Vista celular», la página se muestra con el ancho de un celular */
body.cel-forzada{background:radial-gradient(1000px 600px at 50% 0,#E3EAF5,#D5DEEB)}
html[data-tema="oscuro"] body.cel-forzada{background:#070B13}
body.cel-forzada #app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--fondo);box-shadow:0 0 0 1px var(--borde), 0 30px 80px -20px rgba(9,30,80,.35);position:relative}
body.cel-forzada .barra-cel{left:50%;right:auto;width:430px;transform:translateX(-50%)}
body.cel-forzada .lateral{left:calc(50% - 215px)}
body.cel-forzada .avisos{width:400px}
body.cel-forzada .cartel{left:calc(50% - 205px);right:auto;width:410px}
body.cel-forzada .campana-panel{left:calc(50% - 205px);right:auto;width:410px}
body.cel-forzada .menu-yo{right:calc(50% - 205px)}
body.cel-forzada .modal{max-width:430px}
body.cel-forzada .modal-fondo{align-items:flex-end}
body.cel-forzada .bus-caja{max-width:430px;margin:0 auto}

@media (max-width:420px){
  .ig-tarjeta{padding:24px 18px 20px;border-radius:22px}
  .ig-logo .logo-dp{width:210px}
  .ig-usuarios{grid-template-columns:1fr}
  .ig-u.ancho{grid-column:auto}
  .bv-t{font-size:27px}
  .bv-frase{font-size:15px}
  .bv-prev{padding:10px}
  .mini-app{height:190px}
}

/* Drones recibidos hoy, en el celular: foto más angosta y el estado debajo del modelo */
body.cel .dron-hoy{grid-template-columns:96px minmax(0,1fr)}
body.cel .dh-top{flex-direction:column;align-items:flex-start;gap:4px}
body.cel .dh-tec .sutil{display:none}
body.cel .dh-txt{padding:10px 12px}
body.cel .kpi-t{white-space:normal;line-height:1.2}
body.cel .solo-cel.hidden{display:none!important}


/* ===== css/05-comunes.css ===== */
/* =====================================================================
   PIEZAS COMUNES: pestañas, filtros, tablas/fichas, formularios, fotos
   ===================================================================== */
.barra-filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.barra-filtros .der{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.pestanas{display:flex;gap:4px;border-bottom:1px solid var(--borde);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.pestanas::-webkit-scrollbar{display:none}
.pestanas button{position:relative;height:44px;padding:0 14px;font-size:14px;font-weight:600;color:var(--texto-2);white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.pestanas button:hover{color:var(--texto)}
.pestanas button.on{color:var(--azul)}
.pestanas button.on::after{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--azul)}
.pn{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--gris-e-f);color:var(--texto-2);font-size:11.5px;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.pestanas button.on .pn{background:var(--tinte);color:var(--azul)}
.pildoras{display:flex;flex-wrap:wrap;gap:6px}
.pildora{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--borde);background:var(--carta);font-size:13px;font-weight:600;color:var(--texto-2);display:inline-flex;align-items:center;gap:6px;transition:all var(--anim)}
.pildora:hover{border-color:#C3CEDF;color:var(--texto)}
.pildora.on{background:var(--azul);border-color:var(--azul);color:#fff}
.pildora .n{font-size:11.5px;opacity:.75;font-variant-numeric:tabular-nums}
.pd-punto{width:8px;height:8px;border-radius:50%;background:currentColor}
.pd-punto.c-verde{color:var(--ok)}.pd-punto.c-ambar{color:var(--ambar)}.pd-punto.c-rojo{color:var(--rojo)}.pd-punto.c-azul{color:var(--azul-e)}.pd-punto.c-violeta{color:var(--violeta)}.pd-punto.c-gris{color:var(--gris-e)}.pd-punto.c-cielo{color:#4F95E0}
.pildora.on .pd-punto{color:#fff}
.buscar{position:relative;display:flex;align-items:center;flex:1;min-width:200px;max-width:360px}
.buscar .ico{position:absolute;left:12px;color:var(--texto-3);width:18px;height:18px}
.buscar input{width:100%;height:40px;padding:0 12px 0 38px;border-radius:10px;border:1px solid var(--borde);background:var(--carta);font-size:14px}
.buscar input:focus{outline:none;border-color:var(--cielo);box-shadow:0 0 0 4px rgba(30,98,184,.12)}
select.filtro{height:40px;border-radius:10px;border:1px solid var(--borde);background:var(--carta);padding:0 10px;font-size:14px;color:var(--texto)}

/* Tablas */
.tabla-caja{background:var(--carta);border:1px solid var(--borde-2);border-radius:var(--r-l);box-shadow:var(--s1);overflow:auto}
.tabla{width:100%;border-collapse:collapse;font-size:14px}
.tabla th{position:sticky;top:0;background:var(--fondo);text-align:left;font-size:12px;font-weight:600;color:var(--texto-2);padding:11px 14px;border-bottom:1px solid var(--borde);white-space:nowrap;z-index:1}
.tabla td{padding:11px 14px;border-bottom:1px solid var(--borde-2);vertical-align:middle}
.tabla tr:last-child td{border-bottom:none}
.tabla tr.clic{cursor:pointer;transition:background .12s}
.tabla tr.clic:hover td{background:var(--tinte)}
.tabla .der{text-align:right}.tabla .cen{text-align:center}
.tabla .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tabla .peq{font-size:12.5px;color:var(--texto-2)}
.tabla tr[data-c="anulado"] td{opacity:.5;text-decoration:line-through}
.tabla tr[data-c="rojo"] td:first-child{box-shadow:inset 3px 0 0 var(--rojo)}
.tabla tr[data-c="ambar"] td:first-child{box-shadow:inset 3px 0 0 var(--ambar)}
.celda-p{display:flex;align-items:center;gap:10px;min-width:0}
.celda-p b{display:block;font-weight:600}
.celda-p small{display:block;font-size:12.5px;color:var(--texto-3)}
.mas-filas{display:flex;justify-content:center;align-items:center;gap:12px;padding:12px;font-size:13px}

/* Lista que sugiere opciones (sin datalist) */
.ac-lista{position:fixed;z-index:950;background:var(--carta);border:1px solid var(--borde);border-radius:14px;box-shadow:var(--s3);padding:6px;max-height:300px;overflow:auto}
.ac-lista button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;text-align:left}
.ac-lista button .ico{color:var(--texto-3);width:18px;height:18px}
.ac-lista button:hover,.ac-lista button.sel{background:var(--tinte)}
.ac-lista b{display:block;font-size:14px;font-weight:600}
.ac-lista small{display:block;font-size:12px;color:var(--texto-3)}

/* Opciones grandes (Sí/No, Bien/Con daños) */
.opciones{display:flex;flex-wrap:wrap;gap:8px}
.opc{flex:1;min-width:110px;min-height:52px;padding:0 14px;border-radius:14px;border:1.5px solid var(--borde);background:var(--carta);font-weight:600;font-size:15px;color:var(--texto);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .15s}
.opc:hover{border-color:#B9CBEA}
.opc:active{transform:scale(.98)}
.opc.on{border-color:var(--azul);background:var(--tinte);color:var(--azul)}
.opc.on.ok{border-color:var(--ok);background:var(--ok-f);color:var(--ok-t)}
.opc.on.mal{border-color:var(--rojo);background:var(--rojo-f);color:var(--rojo-t)}
.opc.on.ambar{border-color:var(--ambar);background:var(--ambar-f);color:var(--ambar-t)}
.contador-num{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--borde);border-radius:14px;padding:4px;background:var(--carta)}
.contador-num button{width:44px;height:44px;border-radius:10px;background:var(--fondo);display:inline-flex;align-items:center;justify-content:center;color:var(--azul)}
.contador-num button:active{transform:scale(.94)}
.contador-num b{min-width:44px;text-align:center;font-family:var(--f-titulo);font-size:22px}

/* Formularios */
.form-grilla{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grilla .ancho{grid-column:1/-1}
.form-sec{margin-top:18px;padding-top:16px;border-top:1px solid var(--borde-2)}
.form-sec>h4{font-size:14px;margin-bottom:10px;color:var(--texto)}
.fila-int{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--borde-2)}
.fila-int:first-child{border-top:none}
.fila-int>div{flex:1;min-width:0}
.fila-int b{display:block;font-size:14.5px;font-weight:600}
.fila-int small{display:block;font-size:13px;color:var(--texto-2);margin-top:2px}

/* Fotos */
.fotos{display:flex;flex-wrap:wrap;gap:8px}
.foto-m{position:relative;width:96px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--borde-2);background:var(--fondo);flex-shrink:0}
.foto-m img,.foto-m .foto-dron{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.foto-m small{position:absolute;left:0;right:0;bottom:0;padding:2px 5px;font-size:10px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foto-m .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center}
.foto-m .x .ico{width:13px;height:13px}
.foto-btn{width:96px;height:72px;border-radius:10px;border:1.5px dashed #B9CBEA;color:var(--cielo);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600;background:var(--tinte)}
.foto-btn.falta{border-color:var(--rojo);color:var(--rojo-t);background:var(--rojo-f)}
.foto-btn .ico{width:22px;height:22px}
.foto-ej{font-size:12px;color:var(--cielo);font-weight:600;padding:4px 2px;align-self:center}

/* Pie del registro (quién creó y quién cambió) */
.pie-reg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:18px;padding:10px 14px;border-radius:12px;background:var(--fondo);border:1px dashed var(--borde);font-size:12.5px;color:var(--texto-2)}
.pie-reg .link{margin-left:auto}
.cambio{display:flex;flex-direction:column;gap:2px;font-size:12.5px;margin:3px 0;color:var(--texto-2)}
.cambio s{color:var(--rojo-t)}

/* Vista previa de documentos */
.modal.modal-doc{max-width:900px;height:calc(100vh - 40px)}
.modal-doc .modal-cuerpo{flex:1;display:flex;padding:0 16px 12px}
.doc-visor{flex:1;width:100%;min-height:60vh;border:1px solid var(--borde-2);border-radius:12px;background:#525659}

/* Tarjetas de resumen chicas */
.resumen{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.res{background:var(--carta);border:1px solid var(--borde-2);border-radius:14px;padding:14px 16px;box-shadow:var(--s1)}
.res small{display:block;font-size:12.5px;color:var(--texto-2);font-weight:600}
.res b{display:block;font-family:var(--f-titulo);font-size:22px;font-weight:600;margin-top:4px}
.res span{display:block;font-size:12px;color:var(--texto-3);margin-top:2px}
.res.rojo b{color:var(--rojo-t)}.res.ambar b{color:var(--ambar-t)}.res.verde b{color:var(--ok-t)}.res.azul b{color:var(--azul)}

/* ---------- Celular: las tablas pasan a fichas (etiqueta a la izquierda, dato a la derecha) ---------- */
body.cel .barra-filtros{gap:8px}
body.cel .buscar{max-width:none;min-width:100%}
body.cel .barra-filtros .der{margin-left:0;width:100%}
body.cel .tabla-caja{background:none;border:none;box-shadow:none;overflow:visible}
body.cel .tabla thead{display:none}
body.cel .tabla,body.cel .tabla tbody{display:block}
body.cel .tabla tr{display:block;background:var(--carta);border:1px solid var(--borde-2);border-radius:16px;box-shadow:var(--s1);padding:6px 14px;margin-bottom:10px}
body.cel .tabla td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--borde-2);text-align:right}
body.cel .tabla td:last-child{border-bottom:none}
body.cel .tabla td::before{content:attr(data-l);font-size:12.5px;color:var(--texto-3);font-weight:600;text-align:left;flex-shrink:0}
body.cel .tabla td.td-1{justify-content:flex-start;text-align:left;font-size:15px}
body.cel .tabla td.td-1::before{display:none}
body.cel .tabla td:empty{display:none}
body.cel .form-grilla{grid-template-columns:1fr}
body.cel .pestanas button{height:46px}
body.cel .resumen{grid-template-columns:1fr 1fr}
body.cel .modal.modal-doc{height:94vh}


/* ===== css/06-taller.css ===== */
/* =====================================================================
   RECEPCIÓN · REPARACIONES · FICHA DE LA ORDEN · APROBACIONES
   ===================================================================== */
/* ---------- Recepción paso a paso ---------- */
.rec{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start;max-width:1040px}
.rec-pasos{position:sticky;top:90px;display:flex;flex-direction:column;gap:2px;background:var(--carta);border:1px solid var(--borde-2);border-radius:var(--r-l);padding:10px;box-shadow:var(--s1)}
.rec-pasos button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:13.5px;color:var(--texto-2);text-align:left}
.rec-pasos button span{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--borde);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;background:var(--carta)}
.rec-pasos button span .ico{width:14px;height:14px}
.rec-pasos button.hecho{color:var(--texto)}
.rec-pasos button.hecho span{background:var(--verde);border-color:var(--verde);color:#fff}
.rec-pasos button.on{background:var(--tinte);color:var(--azul);font-weight:600}
.rec-pasos button.on span{border-color:var(--azul);color:var(--azul)}
.rec-pasos button:disabled{opacity:.55;cursor:default}
.rec-caja{padding:22px 24px}
.rec-avance{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.rec-avance small{display:block;font-size:12.5px;color:var(--texto-3);font-weight:600}
.rec-avance b{font-family:var(--f-titulo);font-size:21px;color:var(--azul);font-weight:600}
.rec-g{font-size:12px;color:var(--ok-t);display:inline-flex;align-items:center;gap:4px;opacity:0}
.rec-g.on{animation:guardado 1.6s ease}
@keyframes guardado{0%,70%{opacity:1}100%{opacity:0}}
.rec-barra{height:8px;border-radius:4px;background:var(--fondo);margin:12px 0 20px;overflow:hidden}
.rec-barra i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--azul),var(--verde));transition:width .35s cubic-bezier(.2,.8,.3,1)}
.rec-cuerpo{display:flex;flex-direction:column;gap:18px;animation:vistaEntra .25s ease}
.rec-cuerpo.tiembla{animation:tiembla .42s}
.rec-pie{display:flex;justify-content:space-between;gap:12px;margin-top:24px;padding-top:18px;border-top:1px solid var(--borde-2)}
.rec-sig{min-width:220px}
.rec-auto{font-size:13px;color:var(--texto-2);display:flex;align-items:center;gap:6px;background:var(--fondo);padding:8px 12px;border-radius:10px;align-self:flex-start}
.fila-in{display:flex;gap:8px;align-items:center}
.fila-in input{flex:1;min-width:0;height:48px;padding:0 14px;border:1px solid var(--borde);border-radius:12px;background:var(--carta);font-size:16px}
.fila-in input:focus{outline:none;border-color:var(--cielo);box-shadow:0 0 0 4px rgba(30,98,184,.14)}
.fila-in .btn{height:48px}
.sufijo{color:var(--texto-3);font-size:14px}
.elegido{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--azul);background:var(--tinte)}
.elegido span{flex:1}.elegido b{display:block}.elegido small{color:var(--texto-2);font-size:12.5px}
.sug-drones{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sug-drones>small{width:100%;font-size:12.5px;color:var(--texto-3);font-weight:600}
.sug-drones button{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;border:1px solid var(--borde);background:var(--carta);text-align:left}
.sug-drones button.on{border-color:var(--verde);background:var(--tinte-verde)}
.sug-drones b{display:block;font-size:13px}.sug-drones small{font-size:11.5px;color:var(--texto-3)}
.opciones.modelos .opc{min-width:120px;flex:0 1 auto}
.ficha-mini{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--tinte-verde);border:1px solid rgba(109,183,46,.3);color:var(--hoja)}
.ficha-mini b{display:block;color:var(--texto);font-size:14px}.ficha-mini small{color:var(--texto-2);font-size:12.5px;line-height:1.7}
.rec-bats{display:flex;flex-direction:column;gap:12px}
.rec-bat{border:1px solid var(--borde-2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--fondo)}
.rb-cab{display:flex;align-items:center;gap:10px}
.rb-g{display:grid;grid-template-columns:120px 1fr;gap:12px}
.motores{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.motor{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid var(--borde);background:var(--carta)}
.motor.rev{border-color:rgba(109,183,46,.5);background:var(--tinte-verde)}
.mt-rev{width:30px;height:30px;border-radius:8px;border:2px solid var(--borde);display:inline-flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.motor.rev .mt-rev{background:var(--verde);border-color:var(--verde)}
.mt-rev .ico{width:16px;height:16px}
.motor>b{font-family:var(--f-titulo);width:28px}
.mt-res{display:flex;gap:4px;flex-wrap:wrap}
.mt-res button{height:30px;padding:0 8px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid var(--borde);background:var(--carta);color:var(--texto-2)}
.mt-res button.on.ok{background:var(--ok-f);border-color:var(--ok);color:var(--ok-t)}
.mt-res button.on.mal{background:var(--rojo-f);border-color:var(--rojo);color:var(--rojo-t)}
.mt-todos{margin-top:8px}
.frases{display:flex;flex-wrap:wrap;gap:8px}
.frases button{min-height:42px;padding:0 14px;border-radius:999px;border:1.5px solid var(--borde);background:var(--carta);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.frases button.on{border-color:var(--azul);background:var(--tinte);color:var(--azul);font-weight:600}
.rec-resumen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;background:var(--fondo);padding:14px;border-radius:14px}
