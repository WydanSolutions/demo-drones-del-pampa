/* ===== js/19-ventas.js ===== */
/* =====================================================================
   VENTAS · cualquier producto del stock, sin que haya una reparación.
   Venden Claudio, Florencia y los técnicos (las de los técnicos pasan por
   aprobación antes de descontar el stock; se cambia en Configuración).
   ===================================================================== */
const VTA = { per:'mes', q:'', vend:'', ver:60 };
let VNUEVA = null;
RENDER.ventas = v => SUB.nueva ? pintarNuevaVenta(v) : pintarVentas(v);

function ventasVisibles(){
  const h = hoy(), desde = { hoy:h, semana:inicioSemana(h), mes:inicioMes(h), todas:'0000' }[VTA.per], s = sinTildes(VTA.q);
  return D().ventas.filter(x => x.f >= desde && (!esTecnico() || x.u === USUARIO) && (!VTA.vend || x.u === VTA.vend)
    && (!s || sinTildes(x.num + ' ' + nomCli(x.cli) + ' ' + x.items.map(i => i.cod + ' ' + ((producto(i.cod) || {}).nombre || '')).join(' ')).includes(s)))
    .sort((a, b) => (b.f + b.h).localeCompare(a.f + a.h));
}
function pintarVentas(v){
  const l = ventasVisibles(), ok = l.filter(ventaCuenta), sinFac = l.filter(x => ventaCuenta(x) && !x.factura);
  v.innerHTML = `${enc(esTecnico() ? 'Mis ventas' : 'Ventas', `${ok.length} ventas · <b>${usd(sumar(ok, totalVenta))}</b>${esJefe() && sinFac.length ? ` · <b class="txt-ambar">${sinFac.length} sin factura</b>` : ''}`, `<button class="btn btn-prim" onclick="nuevaVenta()">${ico('carrito')} Nueva venta</button>`)}
    <div class="barra-filtros">${pildoras([['hoy', 'Hoy'], ['semana', 'Esta semana'], ['mes', 'Este mes'], ['todas', 'Todas']], VTA.per, 'vtaPer')}
      ${buscadorLocal('vta-q', VTA.q, 'Buscar venta, cliente o producto…', 'vtaBuscar')}
      ${esJefe() ? `<select class="filtro" onchange="VTA.vend=this.value;ir('ventas',true,true)"><option value="">Todos los vendedores</option>${D().usuarios.filter(u => ['dueno', 'admin', 'tecnico'].includes(u.tipo)).map(u => `<option value="${u.id}" ${VTA.vend === u.id ? 'selected' : ''}>${esc(u.nombre)}</option>`).join('')}</select>` : ''}
      <div class="der"><button class="btn btn-linea btn-sm" onclick="exportarVentas()">${ico('descargar')} Excel</button></div></div>
    ${tabla([
      { t:'Venta', k:x => `<div class="celda-p"><span class="ap-tipo">${ico('carrito')}</span><span><b class="num">${x.num}</b><small>${fCorta(x.f)} ${x.h}</small></span></div>` },
      { t:'Cliente', k:x => esc(nomCli(x.cli)) },
      { t:'Productos', k:x => `<span class="peq">${x.items.map(i => i.cant + ' × ' + esc(((producto(i.cod) || {}).nombre || i.cod))).join(', ')}</span>` },
      { t:'Vendió', k:x => `<span class="celda-p">${avatar(nomUsuario(x.u), 'chico')}${esc(nomUsuario(x.u))}</span>` },
      { t:'Pago', k:x => x.anulado ? chip('Anulada', 'gris') : x.est === 'pendiente' ? chip('Esperando aprobación', 'ambar') : x.pago === 'cuenta' ? chip('A cuenta', 'violeta') : chip('Contado', 'verde') },
      { t:'Factura', k:x => x.factura ? `<span class="num peq">${(D().facturas.find(f => f.id === x.factura) || {}).num || ''}</span>` : ventaCuenta(x) ? '<span class="chip c-ambar">Sin factura</span>' : '' },
      { t:'Total', k:x => `<b class="num">${usd(totalVenta(x))}</b>`, cls:'der' }
    ], l, { click:x => `fichaVenta('${x.id}')`, filaCls:x => x.anulado ? 'anulado' : '', max:VTA.ver, mas:`VTA.ver+=60;ir('ventas',true,true)`,
      vacio:vacio('Sin ventas en este período', 'Con «Nueva venta» se vende cualquier producto del stock.', `<button class="btn btn-prim" onclick="nuevaVenta()">${ico('carrito')} Nueva venta</button>`) })}`;
}
function vtaPer(k){ VTA.per = k; ir('ventas', true, true); }
function vtaBuscar(q){ VTA.q = q; ir('ventas', true, true); reenfocar('vta-q'); }
function exportarVentas(){
  const l = ventasVisibles();
  excel(`Ventas - ${fArchivo(hoy())}.xlsx`, 'VENTAS DRONES DEL PAMPA ' + fCorta(hoy()), ['Venta', 'Fecha', 'Cliente', 'Productos', 'Vendedor', 'Pago', 'Factura', 'Total USD'],
    l.map(x => [x.num, fCorta(x.f), nomCli(x.cli), x.items.map(i => i.cant + ' x ' + i.cod).join(', '), nomUsuario(x.u), x.anulado ? 'Anulada' : x.pago === 'cuenta' ? 'A cuenta' : 'Contado', ((D().facturas.find(f => f.id === x.factura)) || {}).num || '', totalVenta(x)]), { centrar:[0, 1, 5, 6], num:[7], sec:'ventas' });
}

/* ---------- Nueva venta ---------- */
function nuevaVenta(){ VNUEVA = { items:[], cli:'', pago:'contado', desc:0 }; SUB.nueva = true; ir('ventas', false, true); }
function ventaCon(cod){ nuevaVenta(); ventaAgregar(cod); }
function pintarNuevaVenta(v){
  const V = VNUEVA, bruto = sumar(V.items, i => i.precio * i.cant), total = Math.max(0, bruto - (V.desc || 0)), iva = D().config.iva / 100;
  const aprob = esTecnico() && D().config.aprobaciones.venta.on;
  v.innerHTML = `<button class="volver-link" onclick="SUB={};ir('ventas')">${ico('izq')} Ventas</button>
    ${enc('Nueva venta', 'Escaneá o buscá los productos: se ve el precio final y lo disponible')}
    <div class="venta"><section class="tarjeta">
      <div class="fila-in"><input id="v-q" placeholder="Código o nombre del producto" autocomplete="off"><button class="btn btn-prim" onclick="ventaEscanear()">${ico('escanear')} Escanear</button></div>
      <div class="v-items">${V.items.map((i, k) => { const p = producto(i.cod), falta = p.stock < i.cant;
        return `<div class="v-it"><span class="ap-tipo">${ico(icoCategoria(p.cat))}</span><div><b>${esc(p.nombre)}</b><small class="peq ${falta ? 'txt-rojo' : 'muted'} num" style="display:block">${p.cod} · ${usd(p.precio)} · ${falta ? 'no alcanza: hay ' + p.stock : 'hay ' + p.stock}</small></div>
          ${contadorNum(k, i.cant, 0, 99, 'ventaCant')}<b class="num">${usd(i.precio * i.cant)}</b><button class="icon-btn" onclick="ventaCant(${k},0)" aria-label="Quitar">${ico('x')}</button></div>`; }).join('') || vacio('Todavía no agregaste productos', 'Buscalos arriba o escaneá el código de barras.')}</div>
    </section>
    <aside class="tarjeta v-res">
      ${campo('Cliente', V.cli ? `<div class="elegido">${avatar(nomCli(V.cli))}<span><b>${esc(nomCli(V.cli))}</b><small>${esc(datosCli(cliente(V.cli)))}</small></span><button class="link" onclick="VNUEVA.cli='';VNUEVA.pago='contado';ir('ventas',true,true)">Cambiar</button></div>`
        : `<input id="v-cli" placeholder="Buscar cliente…" autocomplete="off"><div class="ayuda">Si es una venta al paso, queda como <b>Consumidor final</b>.</div>`)}
      <div class="campo mt"><label>Forma de pago</label><div class="opciones"><button class="opc ${V.pago === 'contado' ? 'on ok' : ''}" onclick="VNUEVA.pago='contado';ir('ventas',true,true)">Contado</button><button class="opc ${V.pago === 'cuenta' ? 'on' : ''}" ${V.cli ? '' : 'disabled title="Elegí un cliente"'} onclick="VNUEVA.pago='cuenta';ir('ventas',true,true)">A cuenta</button></div>
        ${V.pago === 'cuenta' ? `<div class="ayuda">Queda en el estado de cuenta del cliente, con vencimiento el ${fCorta(sumarDias(hoy(), D().config.plazoPago))}.</div>` : ''}</div>
      ${esJefe() ? campo('Descuento (USD)', `<input type="number" step="0.01" value="${V.desc || ''}" placeholder="0" onchange="VNUEVA.desc=numero(this.value);ir('ventas',true,true)">`, { cls:'mt', ayuda:'Solo Claudio y Florencia.' }) : ''}
      <div class="v-tot"><div><span>Subtotal sin IVA</span><b class="num">${usd(total / (1 + iva))}</b></div><div><span>IVA ${D().config.iva} %</span><b class="num">${usd(total - total / (1 + iva))}</b></div>${V.desc ? `<div><span>Descuento</span><b class="num">− ${usd(V.desc)}</b></div>` : ''}<div class="gran"><span>Total</span><b class="num">${usd(total)}</b></div></div>
      ${aprob ? `<p class="ayuda-sec">${ico('info', 'chico')} Tu venta pasa por la aprobación de Claudio o Florencia antes de descontar el stock.</p>` : ''}
      <button class="btn btn-verde btn-xl" style="width:100%" ${V.items.length ? '' : 'disabled'} onclick="confirmarVenta()">${ico('check')} ${aprob ? 'Enviar para aprobar' : 'Confirmar venta'}</button></aside></div>`;
  autocompletar($('#v-q'), q => opcProductos(q), x => { ventaAgregar(x.v); });
  autocompletar($('#v-cli'), opcClientes, x => { VNUEVA.cli = x.v; ir('ventas', true, true); });
  setTimeout(() => { const q = $('#v-q'); if (q && innerWidth > 860) q.focus(); }, 60);
}
function ventaAgregar(cod){ const p = producto(cod), l = VNUEVA.items.find(i => i.cod === cod); if (l) l.cant++; else VNUEVA.items.push({ cod, cant:1, precio:p.precio }); if (SUB.nueva) ir('ventas', true, true); }
function ventaCant(k, n){ if (!n) VNUEVA.items.splice(k, 1); else VNUEVA.items[k].cant = n; ir('ventas', true, true); }
function ventaEscanear(){ const p = D().productos.filter(x => !x.usado && x.precio < 300)[Math.floor(Math.random() * 30)]; sonido('escaner'); vibrar(60); ventaAgregar(p.cod); avisar('Código leído: ' + p.cod, 'escanear'); }
async function confirmarVenta(){
  const V = VNUEVA, falta = V.items.find(i => producto(i.cod).stock < i.cant);
  if (falta && !await confirmar('No alcanza el stock', `De ${esc(producto(falta.cod).nombre)} hay ${producto(falta.cod).stock}. ¿Vender igual?`, 'Vender igual')) return;
  const aprob = esTecnico() && D().config.aprobaciones.venta.on;
  const v = { id:'v' + Date.now().toString(36), num:'V-' + String(D().numV = (D().numV || 0) + 1).padStart(4, '0'), f:hoy(), h:hora(), cli:V.cli || null, items:V.items.map(i => ({ ...i })), desc:V.desc || 0, pago:V.pago, u:USUARIO, est:aprob ? 'pendiente' : 'aprobada', creado:{ u:USUARIO, f:hoy(), h:hora() } };
  if (v.pago === 'cuenta') v.venc = sumarDias(hoy(), D().config.plazoPago);
  D().ventas.unshift(v);
  if (aprob) D().aprobaciones.push({ id:'a' + Date.now().toString(36), tipo:'venta', u:USUARIO, f:hoy(), h:hora(), est:'pendiente', vistoBueno:[], venta:v.id });
  else v.items.forEach(i => { producto(i.cod).stock -= i.cant; D().movs.unshift({ f:hoy(), h:hora(), cod:i.cod, tipo:'venta', cant:-i.cant, ref:v.num, u:USUARIO }); if (!producto(i.cod).usado) sumarAlPedido(i.cod, i.cant, v.num); });
  registrar(`Vendió ${v.items.length} producto${v.items.length === 1 ? '' : 's'} (${usd(totalVenta(v))})`, v.num, 'ventas'); guardar(); _cache = {};
  SUB = {}; VNUEVA = null; ir('ventas'); armarNav();
  avisar(aprob ? `Venta <b>${v.num}</b> enviada · la aprueba Claudio o Florencia` : `Venta <b>${v.num}</b> confirmada · ${usd(totalVenta(v))}`, 'carrito', { tilde:true, accion:'Comprobante', alTocar:() => comprobanteVenta(v.id) });
}

/* ---------- Ficha de la venta ---------- */
function fichaVenta(id){
  const x = D().ventas.find(v => v.id === id), fac = x.factura && D().facturas.find(f => f.id === x.factura);
  abrirModal({ titulo:`Venta ${x.num}`, sub:`${fCorta(x.f)} ${x.h} · vendió ${esc(nomUsuario(x.u))}${x.aprobo ? ' · aprobó ' + esc(nomUsuario(x.aprobo)) : ''}`, ancho:'ancho',
    cuerpo:`<div class="fo-fila">${x.anulado ? chip('Anulada: ' + x.anulado.motivo, 'gris', 'anular') : x.est === 'pendiente' ? chip('Esperando aprobación', 'ambar') : chip(x.pago === 'cuenta' ? 'A cuenta · vence ' + fCorta(x.venc) : 'Contado', x.pago === 'cuenta' ? 'violeta' : 'verde')}</div>
      <p><b>${esc(nomCli(x.cli))}</b></p>
      ${tabla([{ t:'Producto', k:i => `<b>${esc((producto(i.cod) || {}).nombre)}</b><small class="sutil num" style="display:block">${i.cod}</small>` }, { t:'Cant.', k:i => i.cant, cls:'cen' }, { t:'Precio', k:i => `<span class="num">${usd(i.precio)}</span>`, cls:'der' }, { t:'Importe', k:i => `<b class="num">${usd(i.precio * i.cant)}</b>`, cls:'der' }], x.items)}
      <div class="ord-tot"><span>${x.desc ? 'Descuento ' + usd(x.desc) + ' · ' : ''}Total con IVA</span><b class="num">${usd(totalVenta(x))}</b></div>
      ${esJefe() ? `<div class="form-sec"><h4>Factura</h4>${fac ? bloqueFactura(fac) : `<p class="sutil">Todavía no tiene factura. Florencia la hace en su sistema y la sube acá.</p>`}</div>` : ''}
      ${pieRegistro(x, x.num)}`,
    pie:`${esJefe() && !x.anulado ? `<button class="btn btn-fantasma" onclick="anularVenta('${x.id}')">${ico('anular')} Anular</button>` : ''}
      ${esJefe() && !fac && ventaCuenta(x) ? `<button class="btn btn-linea" onclick="cargarFactura('venta','${x.id}')">${ico('factura')} Subir factura</button>` : ''}
      <button class="btn btn-prim" onclick="comprobanteVenta('${x.id}')">${ico('imprimir')} Comprobante</button>` });
}
async function anularVenta(id){
  const x = D().ventas.find(v => v.id === id), m = await pedirTexto('Anular la venta', '', 'Motivo', 'Nada se borra: queda como anulada y los productos vuelven al stock.'); if (!m) return;
  x.anulado = { u:USUARIO, f:hoy(), h:hora(), motivo:m };
  if (x.est !== 'pendiente') x.items.forEach(i => { producto(i.cod).stock += i.cant; D().movs.unshift({ f:hoy(), h:hora(), cod:i.cod, tipo:'devolucion', cant:i.cant, ref:x.num + ' anulada', u:USUARIO }); });
  registrar('Anuló la venta (' + m + ')', x.num, 'ventas'); guardar(); _cache = {}; cerrarModal(); refrescar(); avisar(`${x.num} anulada · los productos volvieron al stock`, 'anular');
}
async function comprobanteVenta(id){
  const x = D().ventas.find(v => v.id === id), c = cliente(x.cli), iva = D().config.iva / 100, tot = totalVenta(x);
  const doc = await nuevoPDF({ titulo:'Comprobante de venta', sub:x.num });
  pdfDatos(doc, [['Venta', x.num], ['Fecha', fCorta(x.f) + ' ' + x.h], ['Cliente', c ? c.nombre : 'Consumidor final'], ['RUT / CI', c ? c.doc : '—'], ['Forma de pago', x.pago === 'cuenta' ? 'A cuenta · vence ' + fCorta(x.venc) : 'Contado'], ['Atendió', nomUsuario(x.u)]], 'Datos');
  pdfTabla(doc, ['Código', 'Producto', 'Cant.', 'Precio', 'Importe'], x.items.map(i => [i.cod, (producto(i.cod) || {}).nombre, String(i.cant), usd(i.precio), usd(i.precio * i.cant)]), { columnStyles:{ 2:{ halign:'center' }, 3:{ halign:'right' }, 4:{ halign:'right' } } });
  pdfTotales(doc, [['Subtotal sin IVA', usd(tot / (1 + iva))], ['IVA ' + D().config.iva + ' %', usd(tot - tot / (1 + iva))]].concat(x.desc ? [['Descuento incluido', '− ' + usd(x.desc)]] : []).concat([['Total', usd(tot), true]]));
  pdfTexto(doc, 'Este comprobante no es la factura. La factura se emite por separado.', { tam:8.5, color:PDF_GRIS });
  pdfPie(doc, x.num);
  docListo(doc, `Venta ${x.num}${c ? ' - ' + c.nombre : ''}.pdf`, { tel:c ? c.tel : '', ref:x.num, sec:'ventas', texto:`${hola(c)}, te escribimos de Drones del Pampa. Te mandamos el comprobante de tu compra ${x.num} por ${usd(tot)}. ¡Gracias!` });
}


/* ===== js/20-presupuestos.js ===== */
/* =====================================================================
   PRESUPUESTOS · los arman los técnicos; quién los aprueba antes de
   mandarlos lo define Claudio (él, Florencia, cualquiera, los dos o nadie).
   Líneas de repuestos, horas y otros conceptos; IVA 22 %; validez y la
   leyenda «Sujeto a cambios». Si aparece algo nuevo: versión 2.
   ===================================================================== */
const EST_PRESU = {
  borrador:  { t:'Borrador', c:'gris' },        aprobar:{ t:'Para aprobar', c:'ambar' },  aprobado:{ t:'Aprobado · listo para enviar', c:'cielo' },
  enviado:   { t:'Enviado al cliente', c:'azul' }, aceptado:{ t:'Aceptado', c:'verde' }, rechazado:{ t:'Rechazado', c:'rojo' }, reemplazado:{ t:'Reemplazado por otra versión', c:'gris' }
};
const totalPresu = p => r2(sumar(p.lineas, l => l.precio * l.cant));
const chipPresu = p => { const e = EST_PRESU[p.est] || EST_PRESU.borrador, venc = p.est === 'enviado' && difDias(p.f, hoy()) > p.validez; return venc ? chip('Vencido', 'rojo') : chip(e.t, e.c); };
const PRE = { est:'todos', q:'' };
RENDER.presupuestos = v => SUB.presu ? pintarPresu(v, SUB.presu) : pintarPresupuestos(v);
function abrirPresupuesto(id){ cerrarModal(); SUB.presu = id; ir('presupuestos', false, true); }

function pintarPresupuestos(v){
  const s = sinTildes(PRE.q), todos = D().presupuestos.filter(p => !esTecnico() || p.u === USUARIO);
  const l = todos.filter(p => (PRE.est === 'todos' || p.est === PRE.est) && (!s || sinTildes(p.num + ' ' + nomCli(p.cli)).includes(s))).sort((a, b) => (b.f + b.h).localeCompare(a.f + a.h));
  v.innerHTML = `${enc('Presupuestos', `${todos.filter(p => p.est === 'aprobar').length} para aprobar · ${todos.filter(p => p.est === 'enviado').length} esperando respuesta del cliente`, `<button class="btn btn-prim" onclick="nuevoPresupuesto({})">${ico('mas')} Presupuesto suelto</button>`)}
    <div class="barra-filtros">${pildoras([['todos', 'Todos', todos.length]].concat(Object.entries(EST_PRESU).filter(([k]) => k !== 'reemplazado').map(([k, e]) => [k, e.t.split(' ·')[0], todos.filter(p => p.est === k).length, e.c])), PRE.est, 'preEst')}</div>
    <div class="barra-filtros">${buscadorLocal('pre-q', PRE.q, 'Buscar presupuesto o cliente…', 'preBuscar')}</div>
    ${tabla([

    D().baterias.map(b => [b.num, fCorta(b.f), nomCli(b.cli), b.disp, b.serie, b.sintoma, b.ciclos || '', b.obs || '', b.diag.join(', '), ESTADOS_BATERIA[b.estado].t]), { centrar:[0, 1, 6], sec:'baterias' });

/* ---------- Ingreso de una batería (etiqueta QR, aviso a Esteban, comprobante) ---------- */
let NB = {};
function recibirBateria(serie){
  NB = { cli:'', disp:dispLista()[0], serie:typeof serie === 'string' ? serie : '', sintoma:'', obs:'' };
  abrirModal({ titulo:'Recibir batería', sub:'Fecha automática · queda a nombre de quien recibe', ancho:'ancho',
    cuerpo:`<div id="nb">${formBateria()}</div>`,
    pie:`<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-prim" onclick="confirmarBateria()">${ico('check')} Ingresar y generar etiqueta</button>`,
    alAbrir:() => prepararFormBat() });
}
function formBateria(){
  const prev = NB.serie && D().baterias.filter(b => sinTildes(b.serie) === sinTildes(NB.serie)).sort((a, b) => b.f.localeCompare(a.f));
  return grilla([
    campo('Cliente', NB.cli ? `<div class="elegido">${avatar(nomCli(NB.cli))}<span><b>${esc(nomCli(NB.cli))}</b></span><button class="link" onclick="NB.cli='';pintarNB()">Cambiar</button></div>` : `<div class="fila-in"><input id="nb-cli" placeholder="Buscar cliente…"><button class="btn btn-linea" onclick="clienteNuevo(id=>{NB.cli=id;recibirBateriaVolver()})">${ico('mas')}</button></div>`, { req:true, cls:'ancho' }),
    campo('Dispositivo', sel('disp', dispLista(), NB.disp, 'onchange="NB.disp=this.value"')),
    campo('N° de serie', `<div class="fila-in"><input id="nb-serie" class="num" value="${esc(NB.serie)}" placeholder="Escaneá el QR o escribilo" onchange="NB.serie=this.value;pintarNB()"><button class="btn btn-prim" onclick="nbQR()">${ico('qr')} QR</button></div>`, { req:true }),
    prev && prev.length ? `<div class="ancho ficha-mini reing">${ico('historial')}<div><b>Reingreso: esta batería ya vino ${prev.length} ${prev.length === 1 ? 'vez' : 'veces'}</b><small>Última: ${prev[0].num} el ${fCorta(prev[0].f)} · ${prev[0].ciclos} ciclos · ${prev[0].diag.join(', ') || 'sin diagnóstico'}. Al cargar los ciclos se calcula cuántos usó desde entonces.</small></div></div>` : '',
    campo('Síntoma declarado por el cliente', `<input value="${esc(NB.sintoma)}" placeholder="Ej.: no carga" oninput="NB.sintoma=this.value">`, { req:true, cls:'ancho' }),
    `<div class="ancho frases">${SINTOMAS_BAT.map(s => `<button type="button" class="${NB.sintoma === s ? 'on' : ''}" onclick="NB.sintoma='${s}';pintarNB()">${s}</button>`).join('')}</div>`
  ]);
}
function pintarNB(){ $('#nb').innerHTML = formBateria(); prepararFormBat(); }
function prepararFormBat(){ autocompletar($('#nb-cli'), opcClientes, x => { NB.cli = x.v; pintarNB(); }); }
function recibirBateriaVolver(){ const g = NB; recibirBateria(); NB = g; pintarNB(); }
// Abre la cámara (el formulario queda guardado y vuelve con el N° de serie completo)
function nbQR(){
  const g = Object.assign({}, NB), prev0 = (NB.cli && D().baterias.find(b => b.cli === NB.cli)) || D().baterias[5 + Math.floor(Math.random() * 40)];
  abrirEscaner({ titulo:'Escanear el QR de la batería', sub:'Se completa el N° de serie', ejemplos:[[prev0.serie, 'Una que ya vino'], ['8WWMKN4N', 'Batería T100 nueva']], alLeer:txt => {
    const s = sinTildes(txt), partes = [s].concat(s.split(/[\s;,|/?&=#:]+/));
    const prev = D().baterias.slice().sort((a, b) => b.f.localeCompare(a.f)).find(b => partes.includes(sinTildes(b.serie)));
    recibirBateria(); NB = g; NB.serie = prev ? prev.serie : serieDe(txt);
    if (prev){ NB.cli = NB.cli || prev.cli; NB.disp = prev.disp; }
    pintarNB(); avisar('QR leído: N° de serie ' + esc(NB.serie) + (prev ? ' · ya vino antes' : ''), 'qr');
  } });
}
async function confirmarBateria(){
  if (!NB.cli || !NB.serie || !NB.sintoma){ error('Faltan el cliente, el N° de serie o el síntoma'); return; }
  const prev = D().baterias.filter(b => sinTildes(b.serie) === sinTildes(NB.serie)).sort((a, b) => b.f.localeCompare(a.f))[0];
  const b = { id:'b' + Date.now().toString(36), num:'B-' + hoy().slice(0, 4) + '-' + String(D().numB = (D().numB || 200) + 1).padStart(4, '0'), f:hoy(), h:hora(), cli:NB.cli, disp:NB.disp, serie:NB.serie.trim(), sintoma:NB.sintoma, ciclos:'', obs:'', diag:prev ? ['Reingreso'] : [],
    estado:'local', recibio:USUARIO, reingreso:!!prev, anterior:prev ? prev.id : null, hist:[{ f:hoy(), h:hora(), u:USUARIO, a:'Ingresó la batería' + (prev ? ' (reingreso)' : '') }], creado:{ u:USUARIO, f:hoy(), h:hora() } };
  D().baterias.unshift(b); registrar('Recibió una batería · ' + b.disp, b.num, 'baterias'); guardar(); _cache = {};
  cerrarModal(); refrescar(); avisar(`<b>${b.num}</b> ingresada · le avisamos a Esteban`, 'bateria', { tilde:true });
  etiquetaBateria(b.id);
}
async function etiquetaBateria(id){
  const b = D().baterias.find(x => x.id === id), qr = await qrSVG(`${b.num}|${b.serie}|${nomCli(b.cli)}|${fCorta(b.f)}`, 5).catch(() => '');
  abrirModal({ titulo:'Etiqueta para pegar en la batería', sub:'Con QR: cliente, N° de serie y fecha',
    cuerpo:`<div class="etq-bat" id="etq-bat"><div class="eb-qr">${qr}</div><div><b>${esc(nomCli(b.cli))}</b><span class="num">${esc(b.serie)}</span><span>${esc(b.disp)}</span><small>${b.num} · ${fCorta(b.f)}</small></div></div>`,
    pie:`<button class="btn btn-linea" onclick="comprobanteBateria('${id}')">${ico('presupuesto')} Comprobante</button><button class="btn btn-prim" onclick="imprimirHTML($('#etq-bat').outerHTML,'Etiqueta ${b.num}')">${ico('imprimir')} Imprimir etiqueta</button>` });
}
function imprimirHTML(html, titulo){
  const w = window.open('', '_blank'); if (!w){ error('El navegador bloqueó la ventana de impresión'); return; }
  w.document.write(`<!DOCTYPE html><html><head><title>${titulo}</title><style>body{font-family:Inter,Arial,sans-serif;margin:8mm}.etq-bat{display:flex;gap:10px;align-items:center;width:70mm;border:1px dashed #bbb;padding:3mm;border-radius:3mm}.eb-qr svg{width:26mm;height:26mm}.etq-bat b,.etq-bat span,.etq-bat small{display:block;font-size:9pt}.etq-bat b{font-size:10pt}</style></head><body>${html}<script>setTimeout(()=>print(),300)<\/script></body></html>`);
  w.document.close();
}

/* ---------- Ficha de la batería ---------- */
function fichaBateria(id){
  const b = D().baterias.find(x => x.id === id), c = cliente(b.cli), hist = D().baterias.filter(x => x.serie === b.serie && x.id !== b.id).sort((a, b2) => b2.f.localeCompare(a.f));
  const puedeDiag = esEsteban() || esJefe(), puedeEstado = esJefe(), usados = hist[0] && b.ciclos ? Number(b.ciclos) - hist[0].ciclos : null;
  abrirModal({ titulo:`${b.num} · ${esc(b.disp)}`, sub:`Ingresó el ${fCorta(b.f)} ${b.h}${veEsteban('recibio') ? ' · recibió ' + esc(nomUsuario(b.recibio)) : ''}`, ancho:'ancho',
    cuerpo:`<div class="fo-fila">${chipBat(b)}${b.reingreso ? chip('Reingreso', 'violeta', 'historial') : ''}</div>
      <dl class="fo-dl"><dt>Cliente</dt><dd>${esc(c.nombre)}</dd>${veEsteban('telefono') ? `<dt>Teléfono</dt><dd>${esc(c.tel)}</dd>` : ''}<dt>N° de serie</dt><dd class="num">${esc(b.serie)}</dd><dt>Síntoma</dt><dd>${esc(b.sintoma)}</dd></dl>
      <div class="form-sec"><h4>Diagnóstico ${puedeDiag ? '<small class="sutil">· tocá una o varias</small>' : ''}</h4>
        <div class="frases">${diagLista().map(d => `<button ${puedeDiag ? `onclick="batDiag('${id}','${d}')"` : 'disabled'} class="${b.diag.includes(d) ? 'on' : ''}">${b.diag.includes(d) ? ico('check', 'chico') : ''}${d}</button>`).join('')}</div>
        ${grilla([campo('Carga (ciclos)', `<input type="number" value="${esc(b.ciclos)}" ${puedeDiag ? '' : 'readonly'} onchange="batSet('${id}','ciclos',this.value)">`, { ayuda:usados != null ? `Usó <b>${usados}</b> ciclos desde el último ingreso (${hist[0].ciclos}).` : hist[0] ? `En el último ingreso tenía ${hist[0].ciclos}.` : '' }),
          campo('Observaciones', `<input value="${esc(b.obs)}" ${puedeDiag ? '' : 'readonly'} onchange="batSet('${id}','obs',this.value)">`)])}</div>
      <div class="form-sec"><h4>Estado ${puedeEstado ? '' : '<small class="sutil">· lo pone Florencia</small>'}</h4>
        <div class="est-bat">${ORDEN_BATERIA.map(k => `<button ${puedeEstado ? `onclick="batEstado('${id}','${k}')"` : 'disabled'} class="c-${ESTADOS_BATERIA[k].c} ${b.estado === k ? 'on' : ''}">${b.estado === k ? ico('check', 'chico') : ''}${ESTADOS_BATERIA[k].t}</button>`).join('')}</div></div>
      ${hist.length ? `<div class="form-sec"><h4>Historial de la batería</h4>${hist.map(x => `<div class="st-fila"><span class="st-cod num">${fCorta(x.f)}</span><span class="st-nom">${x.num} · ${x.ciclos} ciclos · ${x.diag.join(', ')}</span>${chipBat(x)}</div>`).join('')}</div>` : ''}
      <div class="form-sec"><h4>Movimientos</h4><ol class="fo-hist">${b.hist.slice().reverse().map(x => `<li><b>${esc(x.a)}</b><small>${esc(nomUsuario(x.u))} · ${fCorta(x.f)} ${x.h}</small></li>`).join('')}</ol></div>
      ${pieRegistro(b, b.num)}`,
    pie:`${!esEsteban() ? `<button class="btn btn-linea" onclick="etiquetaBateria('${id}')">${ico('qr')} Etiqueta</button><button class="btn btn-linea" onclick="comprobanteBateria('${id}')">${ico('imprimir')} Comprobante</button>` : ''}
      ${b.estado === 'pendiente' && !esEsteban() ? `<button class="btn btn-prim" onclick="cerrarModal();nuevoPresupuesto({bateria:'${id}'})">${ico('presupuesto')} Presupuesto al cliente</button>` : `<button class="btn btn-prim" onclick="cerrarModal()">Listo</button>`}` });
}
function batDiag(id, d){ const b = D().baterias.find(x => x.id === id), i = b.diag.indexOf(d); if (i < 0) b.diag.push(d); else b.diag.splice(i, 1);
  if (b.estado === 'local' || b.estado === 'taller') b.estado = 'diagnostico';
  b.hist.push({ f:hoy(), h:hora(), u:USUARIO, a:(i < 0 ? 'Marcó ' : 'Sacó ') + d }); b.cambio = { u:USUARIO, f:hoy(), h:hora() }; b.diagF = hoy(); b.diagU = USUARIO;
  registrar('Diagnóstico: ' + (i < 0 ? '+ ' : '− ') + d, b.num, 'baterias'); guardar(); _cache = {}; fichaBateria(id); refrescarFondo(); }
function batSet(id, k, v){ const b = D().baterias.find(x => x.id === id), antes = b[k]; b[k] = k === 'ciclos' ? numero(v) : v; b.cambio = { u:USUARIO, f:hoy(), h:hora() };
  registrar('Cargó ' + (k === 'ciclos' ? 'los ciclos' : 'observaciones'), b.num, 'baterias', { [k]:antes || '—' }, { [k]:b[k] }); guardar(); fichaBateria(id); }
function batEstado(id, k){ const b = D().baterias.find(x => x.id === id), antes = b.estado; b.estado = k; b.cambio = { u:USUARIO, f:hoy(), h:hora() };
  if (k === 'entregado') b.fEntrega = hoy();
  b.hist.push({ f:hoy(), h:hora(), u:USUARIO, a:`Cambió el estado a «${ESTADOS_BATERIA[k].t}»` });
  registrar('Cambió el estado de la batería', b.num, 'baterias', { estado:ESTADOS_BATERIA[antes].t }, { estado:ESTADOS_BATERIA[k].t }); guardar(); _cache = {}; fichaBateria(id); refrescarFondo();
  avisar(`${b.num} → <b>${ESTADOS_BATERIA[k].t}</b>`, 'bateria'); }
function refrescarFondo(){ const y = scrollY; armarNav(); const v = $('#vista'); (RENDER[SECCION] || (() => {}))(v); scrollTo(0, y); }
async function comprobanteBateria(id){
  const b = D().baterias.find(x => x.id === id), c = cliente(b.cli), doc = await nuevoPDF({ titulo:'Recepción de batería', sub:b.num });
  pdfDatos(doc, [['N°', b.num], ['Fecha', fCorta(b.f) + ' ' + b.h], ['Cliente', c.nombre], ['Teléfono', c.tel], ['Dispositivo', b.disp], ['N° de serie', b.serie], ['Síntoma', b.sintoma], ['Recibió', nomUsuario(b.recibio)]], 'Datos del ingreso');
  pdfTexto(doc, 'El diagnóstico lo hace nuestro técnico de baterías. Si hace falta una reparación, te mandamos el presupuesto antes de hacerla.', { tam:9 });
  pdfFirmas(doc, 'Entrega: ' + c.contacto, 'Recibe: ' + nomUsuario(b.recibio)); pdfPie(doc, b.num);
  docListo(doc, `Recepcion bateria ${b.num} - ${c.nombre}.pdf`, { tel:c.tel, ref:b.num, sec:'baterias', texto:`${hola(c)}, recibimos tu ${b.disp} (N° de serie ${b.serie}) con el número ${b.num}. Te avisamos con el diagnóstico.` });
}

/* ---------- Resumen de trabajo de Esteban ---------- */
function resumenEsteban(){
  const h = hoy(), desde = { semana:inicioSemana(h), mes:inicioMes(h), anio:h.slice(0, 4) + '-01-01' }[BAT.per];
  const diag = D().baterias.filter(b => b.diag.length && (b.diagF || sumarDias(b.f, 2)) >= desde);
  const porMes = {}; D().baterias.filter(b => b.diag.length && b.f >= h.slice(0, 4) + '-01-01').forEach(b => { const m = (b.diagF || b.f).slice(0, 7); porMes[m] = (porMes[m] || 0) + 1; });
  const meses = Object.keys(porMes).sort(), max = Math.max(...Object.values(porMes), 1), tags = {};
  diag.forEach(b => b.diag.forEach(d => tags[d] = (tags[d] || 0) + 1));
  return `<div class="barra-filtros">${pildoras([['semana', 'Esta semana'], ['mes', 'Este mes'], ['anio', 'Este año']], BAT.per, 'batPer')}</div>
    <div class="resumen"><div class="res azul"><small>Baterías diagnosticadas</small><b class="num">${diag.length}</b></div><div class="res"><small>Reingresos</small><b class="num">${diag.filter(b => b.reingreso).length}</b></div>
      <div class="res verde"><small>Aprobadas por el cliente</small><b class="num">${diag.filter(b => ['aprobado', 'entregado'].includes(b.estado)).length}</b></div></div>
    <div class="grilla g-7-5" style="margin-top:0"><section class="tarjeta"><div class="tarjeta-cab"><span class="tarjeta-ico">${ico('grafico')}</span><h3>Diagnosticadas por mes</h3></div>
      <div class="barras-v">${meses.map(m => `<div><b class="num">${porMes[m]}</b><i style="--h:${porMes[m] / max * 100}%"></i><small>${MESES[Number(m.slice(5)) - 1].slice(0, 3)}</small></div>`).join('')}</div></section>
    <section class="tarjeta"><div class="tarjeta-cab"><span class="tarjeta-ico verde">${ico('etiqueta')}</span><h3>Diagnósticos del período</h3></div>
      ${Object.entries(tags).sort((a, b) => b[1] - a[1]).map(([t, n]) => `<div class="barra-f rep"><span class="bf-n">${esc(t)}</span><span class="bf-b verde"><i style="--w:${n / Math.max(...Object.values(tags)) * 100}%;--d:0ms"></i></span><b class="num">${n}</b></div>`).join('') || '<p class="sutil">Sin diagnósticos en el período.</p>'}</section></div>`;
}
function batPer(k){ BAT.per = k; ir('baterias', true, true); }


/* ===== js/22-pedidos.js ===== */
/* =====================================================================
   PEDIDOS A DRAGUR
   El pedido se arma solo: cada repuesto usado (retiro aprobado o venta) o
   que llega al mínimo se suma al borrador. Sale en Excel con el formato de
   hoy (Código · Nombre · Cantidad), más prolijo. Al llegar, tres controles:
   lo pedido, lo recibido y lo facturado, con observaciones y fotos.
   ===================================================================== */
const EST_PED = { borrador:['Borrador', 'gris'], enviado:['Enviado', 'azul'], parcial:['Recibido parcial', 'ambar'], completo:['Recibido completo', 'verde'], diferencias:['Con diferencias', 'rojo'], cerrado:['Cerrado', 'gris'] };
const chipPed = p => chip(EST_PED[p.est][0], EST_PED[p.est][1]);
const puedeArmarPedido = () => esJefe();
let PDV = 'borrador';
RENDER.pedidos = v => SUB.pedido ? pintarPedidoDragur(v, SUB.pedido) : pintarPedidos(v);
function abrirPedido(id){ SUB.pedido = id; ir('pedidos', false, true); }

function pintarPedidos(v){
  if (!puedeArmarPedido() && PDV === 'borrador') PDV = 'pedidos';
  const b = pedidoBorrador(), l = D().pedidos.filter(p => p.est !== 'borrador').sort((a, c) => c.f.localeCompare(a.f));
  v.innerHTML = `${enc('Pedidos a Dragur', `${b ? `Borrador con <b>${b.lineas.length} repuestos</b> · ` : ''}${l.filter(p => p.est === 'enviado').length} en camino · ${l.filter(p => p.est === 'diferencias').length} con diferencias`)}
    ${pestanas((puedeArmarPedido() ? [['borrador', 'Lista de compras', b ? b.lineas.length : 0]] : []).concat([['pedidos', 'Pedidos', l.length]]), PDV, 'pdVista')}
    ${PDV === 'borrador' ? listaCompras(b) : tabla([
      { t:'Pedido', k:p => `<div class="celda-p"><span class="ap-tipo">${ico('camion')}</span><span><b class="num">${p.num}</b><small>${fCorta(p.f)}</small></span></div>` },
      { t:'Productos', k:p => `${p.lineas.length} · <span class="sutil">${sumar(p.lineas, x => x.cant)} unidades</span>` },
      { t:'Factura de Dragur', k:p => p.factura ? `<span class="num peq">${esc(p.factura)}</span>` : '<span class="sutil">—</span>' },
      { t:'Estado', k:p => chipPed(p) }
    ], l, { click:p => `abrirPedido('${p.id}')` })}`;
  if (PDV === 'borrador') autocompletar($('#pd-q'), q => opcProductos(q).filter(x => !/-U$/.test(x.v)), x => { sumarAlPedido(x.v, 1, 'Agregado a mano'); registrar('Agregó ' + x.v + ' al pedido', pedidoBorrador().num, 'pedidos'); guardar(); ir('pedidos', true, true); });
}
function pdVista(k){ PDV = k; ir('pedidos', true, true); }

/* ---------- Lista de compras interna (el borrador) ---------- */
function listaCompras(b){
  if (!b || !b.lineas.length) return vacio('El pedido está vacío', 'Se arma solo cuando se usan repuestos o algo llega al mínimo.');
  const ultimo = cod => { const p = D().pedidos.filter(x => x.est !== 'borrador' && x.lineas.some(l => l.cod === cod)).sort((a, c) => c.f.localeCompare(a.f))[0]; return p ? fCorta(p.f) : '—'; };
  return `<div class="pd-cab tarjeta"><div><b class="num">${b.num}</b><small>Se va armando solo desde el ${fCorta(b.f)} · revisalo antes de mandarlo</small></div>
      <div class="pd-btns"><button class="btn btn-linea" onclick="excelDragur('${b.id}')">${ico('descargar')} Excel para Dragur</button>
        <button class="btn btn-linea" onclick="mandarPedido('${b.id}','whatsapp')">${ico('whatsapp')} WhatsApp</button><button class="btn btn-linea" onclick="mandarPedido('${b.id}','email')">${ico('enviar')} Email</button>
        <button class="btn btn-prim" onclick="marcarEnviado('${b.id}')">${ico('check')} Marcar como enviado</button></div></div>
    <div class="fila-in mt" style="max-width:520px"><input id="pd-q" placeholder="+ Agregar un producto al pedido" autocomplete="off"></div>
    <div class="mt">${tabla([
      { t:'Producto', k:l => { const p = producto(l.cod) || {}; return `<div class="celda-p"><span class="ap-tipo">${ico(icoCategoria(p.cat))}</span><span><b>${esc(p.nombre)}</b><small class="num">${l.cod}</small></span></div>`; } },
      { t:'Motivo', k:l => (l.motivos || []).slice(0, 3).map(m => `<span class="tag-d">${esc(m)}</span>`).join(' ') + ((l.motivos || []).length > 3 ? ` <span class="sutil">+${l.motivos.length - 3}</span>` : '') },
      { t:'Stock actual', k:l => { const p = producto(l.cod); return `<span class="chip c-${estadoStock(p).c}">${p.stock}</span>`; }, cls:'cen' },
      { t:'Último precio', k:l => `<span class="num peq">${usd((producto(l.cod) || {}).costo || 0)}</span>`, cls:'der' },
      { t:'Última vez pedido', k:l => `<span class="num peq">${ultimo(l.cod)}</span>`, cls:'cen' },
      { t:'Cantidad', k:(l, i) => contadorNum(i, l.cant, 0, 99, 'pdCant'), cls:'cen' }
    ], b.lineas, { max:200 })}</div>
    <div class="ord-tot"><span>${b.lineas.length} productos · ${sumar(b.lineas, l => l.cant)} unidades</span><b class="num">${usd(sumar(b.lineas, l => ((producto(l.cod) || {}).costo || 0) * l.cant))} <small>costo estimado</small></b></div>`;
}
function pdCant(i, n){ const b = pedidoBorrador(); if (!n) b.lineas.splice(i, 1); else b.lineas[i].cant = n; guardar(); ir('pedidos', true, true); }
// Excel con el mismo formato de hoy: Código · Nombre · Cantidad, sin imágenes
function excelDragur(id){
  const p = D().pedidos.find(x => x.id === id);

/* ---------- Control de lo recibido: pedido · recibido · facturado ---------- */
function resultadoLinea(l){
  if (l.noPedido) return ['No pedido', 'violeta'];
  if (l.recibido == null) return ['Sin controlar', 'gris'];
  if (l.recibido < l.cant) return ['Falta', 'rojo'];
  if (l.recibido > l.cant) return ['Sobra', 'ambar'];
  if (l.facturado != null && l.facturado !== l.recibido) return [l.facturado > l.recibido ? 'Facturado de más' : 'Facturado de menos', 'rojo'];
  if (l.precioFact != null && Math.abs(l.precioFact - l.precio) > .01) return ['Precio distinto', 'ambar'];
  return ['Coincide', 'verde'];
}

        ${p.est === 'diferencias' && esJefe() ? `${menuMas([['ok', 'Se resolvió con nota de crédito', `pdResolver('${id}','nota de crédito')`], ['camion', 'Dragur lo reenvió', `pdResolver('${id}','reenvío')`], ['check', 'Se acepta así', `pdResolver('${id}','se acepta')`]])}` : ''}</div>` : ''}

async function pdConfirmar(id){

  const dif = p.lineas.some(l => resultadoLinea(l)[0] !== 'Coincide'), falta = p.lineas.some(l => l.recibido < l.cant);
  p.est = dif ? 'diferencias' : falta ? 'parcial' : 'completo'; p.fRecibido = hoy();
  registrar('Confirmó la recepción del pedido (' + EST_PED[p.est][0] + ')', p.num, 'pedidos'); guardar(); _cache = {}; ir('pedidos', true, true);

  const fotos = p.lineas.flatMap(l => (l.fotos || []).map(f => ({ foto:f, t:l.cod })));
  await pdfFotos(doc, fotos, 'Fotos (con fecha y hora en que se subieron)');

/* ===== js/23-facturacion.js ===== */
/* =====================================================================
   FACTURACIÓN, COBROS Y ESTADOS DE CUENTA (todo en dólares)
   Bandeja para facturar con el reporte armado; la factura se hace en el
   sistema de siempre y se sube el PDF: se guarda en el Google Drive del
   taller (Facturas de venta / año / mes), se lee sola (N°, fecha, total) y
   se ve la vista previa completa sin salir de la página.
   ===================================================================== */
const FAC = { vista:'facturar', est:'abiertas', q:'', cli:null, ver:60 };
const _pdfs = {};   // los PDF subidos en esta sesión (en la versión real quedan en Google Drive)
RENDER.facturacion = v => {
  const pf = paraFacturar(), fs = facturasActivas(), deben = deudores();

    ${pestanas([['facturar', 'Para facturar', pf.length], ['facturas', 'Facturas'], ['cuentas', 'Estados de cuenta', deben.length], ['entregas', 'Entregas', ent]], FAC.vista, 'facVista')}
    <div>${{ facturar:bandejaFacturar, facturas:listaFacturas, cuentas:estadosCuenta, entregas:listaEntregas }[FAC.vista]()}</div>`;
};
function facVista(k){ FAC.vista = k; FAC.cli = null; ir('facturacion', true, true); }

/* ---------- Para facturar (y pendientes de factura) ---------- */
function paraFacturar(){
  const l = [];
  D().ordenes.filter(o => o.estado === 'terminado' && !o.factura && !o.anulado).forEach(o => l.push({ tipo:'orden', id:o.id, ref:o.num, cli:o.cli, t:modeloTxt(o.modelo), f:o.fTerm || o.f, total:totalOrdenFacturar(o), ico:'llave' }));
  D().baterias.filter(b => b.estado === 'aprobado' && !b.factura).forEach(b => l.push({ tipo:'bateria', id:b.id, ref:b.num, cli:b.cli, t:b.disp + ' · ' + b.diag.join(', '), f:b.f, total:b.total || 180, ico:'bateria' }));
  D().ventas.filter(v => ventaCuenta(v) && !v.factura).forEach(v => l.push({ tipo:'venta', id:v.id, ref:v.num, cli:v.cli, t:v.items.length + ' producto' + (v.items.length === 1 ? '' : 's') + (v.pago === 'cuenta' ? ' · a cuenta' : ' · contado'), f:v.f, total:totalVenta(v), ico:'carrito' }));
  return l.sort((a, b) => a.f.localeCompare(b.f));
}
const totalOrdenFacturar = o => r2((sumar(o.repuestos.filter(x => x.est === 'aprobado' && !x.devuelto), x => x.precio * x.cant) / 1.22 + totalHoras(o) * D().config.tarifaHora) * 1.22);
function bandejaFacturar(){
  const l = paraFacturar(), grupo = (t, tipoG, i) => { const g = l.filter(x => x.tipo === tipoG); return g.length ? `<section class="tarjeta mt"><div class="tarjeta-cab"><span class="tarjeta-ico">${ico(i)}</span><div><h3>${t}</h3><div class="sub">${g.length} sin factura</div></div></div>
    ${g.map(x => `<div class="fac-fila"><span class="ap-tipo">${ico(x.ico)}</span><div class="ff-t"><b>${x.ref} · ${esc(nomCli(x.cli))}</b><small>${esc(x.t)} · ${cuando(x.f)}</small></div><b class="num">${usd(x.total)}</b>
      <div class="ff-acc"><button class="btn btn-fantasma btn-sm" onclick="${x.tipo === 'orden' ? `reporteFacturar('${x.id}')` : x.tipo === 'venta' ? `comprobanteVenta('${x.id}')` : `comprobanteBateria('${x.id}')`}">${ico('imprimir')} Reporte</button><button class="btn btn-prim btn-sm" onclick="cargarFactura('${x.tipo}','${x.id}')">${ico('factura')} Subir factura</button></div></div>`).join('')}</section>` : ''; };
  return l.length ? `<p class="ayuda-sec">${ico('info', 'chico')} Florencia hace la factura en su sistema de siempre, descarga el PDF y lo sube acá. La página lo guarda en el Google Drive del taller y lee sola el N°, la fecha y el total.</p>
    ${grupo('Reparaciones terminadas', 'orden', 'llave')}${grupo('Baterías aprobadas', 'bateria', 'bateria')}${grupo('Ventas sin factura', 'venta', 'carrito')}`
    : vacio('No queda nada colgado', 'Todas las reparaciones, baterías y ventas tienen su factura.');
}

/* ---------- Subir la factura: Drive + lectura automática + vista previa ---------- */
let SUBIDA = null;
function cargarFactura(tipoO, id){
  const o = tipoO === 'orden' ? orden(id) : tipoO === 'venta' ? D().ventas.find(x => x.id === id) : D().baterias.find(x => x.id === id);
  const esperado = tipoO === 'orden' ? totalOrdenFacturar(o) : tipoO === 'venta' ? totalVenta(o) : (o.total || 180);
  SUBIDA = { tipo:tipoO, id, cli:o.cli, ref:o.num, esperado, datos:null, blob:null, nombre:'' };
  abrirModal({ titulo:'Subir factura', sub:`${o.num} · ${esc(nomCli(o.cli))} · total esperado ${usd(esperado)}`, ancho:'ancho',
    cuerpo:`<div class="subir" id="subir"><label class="zona">${ico('descargar', 'grande')}<b>Elegí el PDF de la factura</b><small>El que descargaste de tu sistema de facturación</small><input type="file" accept="application/pdf" onchange="leerFacturaArchivo(this.files[0])"></label>
      <button class="link mt-s" onclick="facturaEjemplo()">${ico('estrella', 'chico')} Probar con una factura de ejemplo</button></div><div id="subir-res"></div>`,
    alCerrar:() => { SUBIDA = null; } });
}
async function facturaEjemplo(){
  const n = (D().numFac || 4900) + 1, doc = await pdfFacturaEjemplo({ num:'A-' + n, f:hoy(), cli:SUBIDA.cli, total:SUBIDA.esperado, ref:SUBIDA.ref });
  leerFacturaArchivo(new File([doc.output('blob')], `Factura A-${n}.pdf`, { type:'application/pdf' }));
}
async function leerFacturaArchivo(file){
  if (!file) return;
  $('#subir-res').innerHTML = `<div class="mt">${esqueleto(4)}</div>`;
  try { await cargarLib('pdfjs'); pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; } catch (e){ error('No se pudo cargar el lector de PDF'); return; }
  const buf = await file.arrayBuffer(), pdf = await pdfjsLib.getDocument({ data:buf.slice(0) }).promise;
  let txt = ''; for (let i = 1; i <= pdf.numPages; i++){ const p = await pdf.getPage(i), c = await p.getTextContent(); txt += c.items.map(x => x.str).join(' ') + '\n'; }
  // Lectura automática: N° de factura, fecha y total (si el PDF lo genera el sistema, no si es una foto)
  const mNum = txt.match(/\b([A-Z]{1,2}-\d{3,8})\b/) || txt.match(/(?:N[°º]|Nro\.?|Número)\s*:?\s*([A-Z]{0,2}-?\s?\d{3,8})/i);
  // el TOTAL (no el «Subtotal»): se toma el último que aparece
  const mF = txt.match(/(\d{2}\/\d{2}\/\d{4})/), mT = [...txt.matchAll(/\bTOTAL(?:\s+USD)?[^0-9]{0,12}([\d.]+,\d{2})/gi)].pop();
  const datos = { num:mNum ? mNum[1].replace(/\s/g, '') : '', f:mF ? mF[1].split('/').reverse().join('-') : hoy(), total:mT ? numero(mT[1]) : 0, leida:!!(mNum || mT) };
  SUBIDA.datos = datos; SUBIDA.blob = new Blob([buf], { type:'application/pdf' }); SUBIDA.nombre = file.name;
  const c = cliente(SUBIDA.cli), nombre = `Factura ${datos.num.replace(/^A-/, '') || '—'} - ${c ? c.nombre : 'Consumidor final'} - ${fArchivo(datos.f)}.pdf`;
  const difiere = datos.total && Math.abs(datos.total - SUBIDA.esperado) > .5;
  $('#subir').classList.add('hidden');
  $('#subir-res').innerHTML = `<div class="fac-sub"><div class="fs-prev" id="fs-prev"></div>
    <div><div class="ficha-mini">${ico(datos.leida ? 'check' : 'info')}<div><b>${datos.leida ? 'La página leyó la factura sola' : 'No se pudo leer: completá los datos'}</b><small>${datos.leida ? 'Revisá que esté todo bien.' : 'Parece una foto o un escaneo. La lectura de fotos va en la segunda etapa.'}</small></div></div>
      ${grilla([campo('N° de factura', `<input id="fs-num" value="${esc(datos.num)}">`, { req:true }), campo('Fecha', `<input id="fs-f" type="date" value="${datos.f}">`),

/* ===== js/25-equipo-actividad.js ===== */
/* =====================================================================
   EQUIPO · lo que trabajó cada uno, por persona y por período.
   ACTIVIDAD · quién hizo qué y cuándo (no se puede borrar ni editar).
   ===================================================================== */
const EQ = { u:null, per:'mes', desde:'', hasta:'', comparar:false };
function rangoEq(){
  const h = hoy();
  if (EQ.per === 'semana') return [inicioSemana(h), h];
  if (EQ.per === 'mes') return [inicioMes(h), h];
  if (EQ.per === 'anterior'){ const i = inicioMes(sumarDias(inicioMes(h), -1)); return [i, sumarDias(inicioMes(h), -1)]; }
  return [EQ.desde || inicioMes(h), EQ.hasta || h];
}
function trabajoDe(uid, d, h){
  const en = f => f >= d && f <= h;
  const hs = []; D().ordenes.forEach(o => (o.horas || []).forEach(x => { if (x.u === uid && en(x.f)) hs.push({ ...x, o }); }));
  const ret = D().movs.filter(m => m.u === uid && m.tipo === 'retiro' && en(m.f)), dev = D().movs.filter(m => m.u === uid && m.tipo === 'devolucion' && en(m.f));
  const pres = D().presupuestos.filter(p => p.u === uid && en(p.f)), vts = D().ventas.filter(v => v.u === uid && ventaCuenta(v) && en(v.f));
  return { recibidos:D().ordenes.filter(o => o.recibio === uid && en(o.f)).length, terminadas:D().ordenes.filter(o => o.tec === uid && o.fTerm && en(o.fTerm)).length,
    horas:sumar(hs, x => x.h), hs, retirados:sumar(ret, m => -m.cant), devueltos:sumar(dev, m => m.cant), pres:pres.length, presOk:pres.filter(p => p.est === 'aceptado').length,
    ventas:vts.length, ventasUSD:sumar(vts, totalVenta), baterias:D().baterias.filter(b => b.diag.length && (b.diagU === uid || (uid === 'esteban' && !b.diagU)) && en(b.diagF || sumarDias(b.f, 2))).length,
    pasesR:D().aprobaciones.filter(a => a.tipo === 'pase' && a.est === 'aprobado' && a.a === uid && en(a.fRes || a.f)).length, pasesD:D().aprobaciones.filter(a => a.tipo === 'pase' && a.est === 'aprobado' && a.u === uid && en(a.fRes || a.f)).length };
}
RENDER.equipo = v => {
  const gente = D().usuarios.filter(u => ['dueno', 'admin', 'tecnico', 'externo'].includes(u.tipo) && u.activo);
  if (esTecnico()) EQ.u = USUARIO; else if (!EQ.u) EQ.u = 'tec1';
  const [d, h] = rangoEq(), t = trabajoDe(EQ.u, d, h), u = usuario(EQ.u);
  const porDia = {}; t.hs.forEach(x => porDia[x.f] = (porDia[x.f] || 0) + x.h); const dias = Object.keys(porDia).sort(), maxD = Math.max(...Object.values(porDia), 1);
  const porOrden = {}; t.hs.forEach(x => porOrden[x.o.num] = (porOrden[x.o.num] || 0) + x.h);
  v.innerHTML = `${enc(esTecnico() ? 'Mi trabajo' : 'Equipo', esTecnico() ? 'Lo que trabajaste en el período' : 'Lo que trabajó cada uno · elegí persona y período', esJefe() ? `<button class="btn btn-linea" onclick="exportarEquipo()">${ico('descargar')} Excel</button>` : '')}
    ${esJefe() ? `<div class="personas">${gente.map(p => `<button class="${EQ.u === p.id && !EQ.comparar ? 'on' : ''}" onclick="EQ.u='${p.id}';EQ.comparar=false;ir('equipo',true,true)">${avatar(p.nombre)}<span>${esc(p.nombre)}</span></button>`).join('')}<button class="${EQ.comparar ? 'on' : ''}" onclick="EQ.comparar=true;ir('equipo',true,true)">${ico('grafico')}<span>Comparar a todos</span></button></div>` : ''}
    <div class="barra-filtros">${pildoras([['semana', 'Esta semana'], ['mes', 'Este mes'], ['anterior', 'Mes pasado'], ['fechas', 'Fechas a elección']], EQ.per, 'eqPer')}
      ${EQ.per === 'fechas' ? `<input type="date" class="filtro" value="${d}" onchange="EQ.desde=this.value;ir('equipo',true,true)"><input type="date" class="filtro" value="${h}" onchange="EQ.hasta=this.value;ir('equipo',true,true)">` : `<span class="sutil">${fCorta(d)} al ${fCorta(h)}</span>`}</div>
    ${EQ.comparar ? comparativa(gente, d, h) : `<h3 class="sec-t">${avatar(u.nombre)} ${esc(u.nombre)} <small class="sutil">· ${esc(u.cargo)}</small></h3>
    <div class="resumen">${u.tipo === 'externo' ? `<div class="res azul"><small>Baterías diagnosticadas</small><b class="num">${t.baterias}</b></div>` : `
      <div class="res azul"><small>Drones recibidos</small><b class="num">${t.recibidos}</b></div><div class="res verde"><small>Reparaciones terminadas</small><b class="num">${t.terminadas}</b></div>
      <div class="res"><small>Horas de trabajo</small><b class="num">${horas(t.horas)}</b><span>${usd0(t.horas * D().config.tarifaHora)} de mano de obra</span></div>
      <div class="res"><small>Repuestos</small><b class="num">${t.retirados}</b><span>retirados · ${t.devueltos} devueltos</span></div>
      <div class="res"><small>Presupuestos</small><b class="num">${t.pres}</b><span>${t.presOk} aceptados por el cliente</span></div>
      <div class="res verde"><small>Ventas</small><b class="num">${t.ventas}</b><span>${usd(t.ventasUSD)}</span></div>
      <div class="res"><small>Pases de drones</small><b class="num">${t.pasesR + t.pasesD}</b><span>${t.pasesR} recibidos · ${t.pasesD} pasados</span></div>`}</div>
    ${u.tipo !== 'externo' ? `<div class="grilla g-7-5"><section class="tarjeta"><div class="tarjeta-cab"><span class="tarjeta-ico">${ico('reloj')}</span><h3>Horas por día</h3></div>
        ${dias.length ? `<div class="barras-v">${dias.map(x => `<div><b class="num">${String(porDia[x]).replace('.', ',')}</b><i style="--h:${porDia[x] / maxD * 100}%"></i><small>${fDM(x)}</small></div>`).join('')}</div>` : '<p class="sutil">Sin horas cargadas en el período.</p>'}</section>
      <section class="tarjeta"><div class="tarjeta-cab"><span class="tarjeta-ico verde">${ico('llave')}</span><h3>Horas por orden</h3></div>
        ${Object.entries(porOrden).sort((a, b) => b[1] - a[1]).map(([n, x]) => `<div class="barra-f rep"><span class="bf-n num">${n}</span><span class="bf-b"><i style="--w:${x / Math.max(...Object.values(porOrden)) * 100}%;--d:0ms"></i></span><b class="num">${horas(x)}</b></div>`).join('') || '<p class="sutil">—</p>'}</section></div>` : ''}`}`;
};
function eqPer(k){ EQ.per = k; ir('equipo', true, true); }
function comparativa(gente, d, h){
  const filas = gente.map(u => ({ u, t:trabajoDe(u.id, d, h) }));
  return tabla([{ t:'Persona', k:x => `<span class="celda-p">${avatar(x.u.nombre, 'chico')}<b>${esc(x.u.nombre)}</b></span>` }, { t:'Recibidos', k:x => x.t.recibidos, cls:'cen' }, { t:'Terminadas', k:x => x.t.terminadas, cls:'cen' },
    { t:'Horas', k:x => `<b class="num">${horas(x.t.horas)}</b>`, cls:'der' }, { t:'Repuestos', k:x => `${x.t.retirados} / ${x.t.devueltos}`, cls:'cen' }, { t:'Presupuestos', k:x => `${x.t.pres} (${x.t.presOk} ✓)`, cls:'cen' },

    ${pestanas([['notas', 'Notas', E.notas.length], ['calendario', 'Calendario'], ['recordatorios', 'Recordatorios', E.recordatorios.filter(r => !r.hecho).length], ['tareas', 'Tareas', E.tareas.filter(t => !t.hecha).length]], ME.tab, 'meTab')}

/* ---------- Notas adhesivas ---------- */
function pintarNotas(E){
  const s = sinTildes(ME.q), base = E.notas.filter(n => !ME.grupo || n.g === ME.grupo);
  const l = base.filter(n => (ME.filtro === 'todas' || (ME.filtro === 'hechas') === !!n.hecha) && (!s || sinTildes((n.txt || '') + (n.lista || []).map(x => x.t).join(' ')).includes(s)));
  const nH = base.filter(n => n.hecha).length;
  return `<div class="barra-filtros">${pildoras([['pendientes', 'Pendientes', base.length - nH], ['hechas', 'Realizadas', nH], ['todas', 'Todas', base.length]], ME.filtro, 'meFiltro')}
      ${buscadorLocal('me-q', ME.q, 'Buscar en las notas…', 'meBuscar')}
      <div class="der"><button class="btn btn-linea btn-sm" onclick="nuevoGrupo()">${ico('mas')} Grupo</button><button class="btn btn-prim btn-sm" onclick="nuevaNota()">${ico('mas')} Nota</button></div></div>
    <div class="grupos"><button class="${!ME.grupo ? 'on' : ''}" onclick="ME.grupo='';ir('miespacio',true,true)">Todos</button>${E.grupos.map(g => `<button class="${ME.grupo === g.id ? 'on' : ''}" style="--gc:${g.c}" onclick="ME.grupo='${g.id}';ir('miespacio',true,true)"><i></i>${esc(g.t)} <span>${E.notas.filter(n => n.g === g.id && !n.hecha).length}</span></button>`).join('')}</div>
    ${l.length ? `<div class="notas">${l.map(notaHTML).join('')}</div>` : `<div class="notas-vacio">${ME.filtro === 'hechas' ? 'Todavía no marcaste ninguna nota como realizada. Usá ✓ en la nota.' : '🎉 No te quedan notas pendientes.'}<br><button class="btn btn-prim btn-sm mt" onclick="nuevaNota()">${ico('editar')} Escribir una nota</button></div>`}`;
}
function notaHTML(n){
  const E = espacio(), g = E.grupos.find(x => x.id === n.g), L = n.lnk, lnkTxt = L ? (L.tipo === 'cliente' ? nomCli(L.id) : L.tipo === 'orden' ? (orden(L.id) || {}).num : L.tipo === 'pedido' ? (D().pedidos.find(p => p.id === L.id) || {}).num : (dron(L.id) || {}).chasis) : '';
  return `<div class="nota ${n.hecha ? 'hecha' : ''}" style="--nc:${n.c}">
    <div class="nota-acc"><button onclick="paletaNota(event,'${n.id}')" title="Color">🎨</button><button onclick="vincularNota('${n.id}')" title="Vincular">🔗</button><button onclick="grupoNota(event,'${n.id}')" title="Grupo">📁</button>
      <button class="nh ${n.hecha ? 'on' : ''}" onclick="notaHecha('${n.id}')" title="${n.hecha ? 'Volver a pendiente' : 'Marcar como realizada'}">✓</button><button onclick="borrarNota('${n.id}')" title="Eliminar">×</button></div>
    ${n.lista ? `<div class="nota-lista">${n.lista.map((x, i) => `<label><input type="checkbox" ${x.ok ? 'checked' : ''} onchange="itemNota('${n.id}',${i})"><span class="${x.ok ? 'ok' : ''}">${esc(x.t)}</span></label>`).join('')}
        <input class="nota-add" placeholder="+ Agregar" onkeydown="if(event.key==='Enter'&&this.value.trim()){addItemNota('${n.id}',this.value)}"></div>`
      : `<div class="nota-txt" contenteditable="true" spellcheck="false" onblur="textoNota('${n.id}',this.innerText)">${esc(n.txt || '')}</div>`}
    ${L ? `<button class="nota-lnk" onclick="abrirVinculo('${L.tipo}','${L.id}')">${ico({ cliente:'clientes', orden:'llave', pedido:'camion', dron:'dron' }[L.tipo], 'chico')} ${esc(lnkTxt)}</button>` : ''}
    <div class="nota-pie">${g ? `<span class="nota-g" style="--gc:${g.c}">${esc(g.t)}</span>` : ''}<span class="nota-fecha">${fDM(n.f)}</span></div>
    ${n.hecha ? `<div class="nota-sello">✓ Realizada ${fDM(n.hecha)}</div>` : ''}</div>`;
}
const notaDe = id => espacio().notas.find(n => n.id === id);
function meFiltro(k){ ME.filtro = k; ir('miespacio', true, true); }
function meBuscar(q){ ME.q = q; ir('miespacio', true, true); reenfocar('me-q'); }
function nuevaNota(){
  abrirModal({ titulo:'Nota nueva', cuerpo:`<div class="seg" id="nn-tipo"><button class="on" data-t="txt">Texto libre</button><button data-t="lista">Lista con casillas</button></div>

        cerrarModal(); ME.filtro = 'pendientes'; meGuardar(); avisar('Nota pegada', 'nota'); }; } });
}
function nuevoGrupo(){ pedirTexto('Grupo nuevo', '', 'Nombre del grupo', 'Ej.: Proveedores, Clientes, Local, Personal').then(t => { if (!t) return; const cs = ['#3F8A1F', '#0B3D9E', '#E0A100', '#7B5CC4', '#D64545', '#0F7C85']; espacio().grupos.push({ id:'g' + Date.now().toString(36), t, c:cs[espacio().grupos.length % cs.length] }); meGuardar(); }); }

function notaHecha(id){ const n = notaDe(id); n.hecha = n.hecha ? null : hoy(); meGuardar(); avisar(n.hecha ? '✓ Nota realizada: la tenés en «Realizadas»' : 'La nota volvió a pendientes', 'check'); }
async function borrarNota(id){ if (!await confirmar('¿Eliminar la nota?', 'Es tu nota personal: se borra de tu espacio.', 'Eliminar', true)) return; espacio().notas = espacio().notas.filter(n => n.id !== id); meGuardar(); }
function paletaNota(ev, id){ ev.stopPropagation(); flotante(ev, NOTA_COLORES.map(c => `<button class="ncol" style="background:${c}" onclick="notaDe('${id}').c='${c}';cerrarFlotante();meGuardar()"></button>`).join(''), 'nota-cols'); }
function grupoNota(ev, id){ ev.stopPropagation(); flotante(ev, [['', 'Sin grupo', '#ccc']].concat(espacio().grupos.map(g => [g.id, g.t, g.c])).map(([k, t, c]) => `<button class="gr-op" onclick="notaDe('${id}').g='${k}';cerrarFlotante();meGuardar()"><i style="background:${c}"></i>${esc(t)}</button>`).join(''), 'gr-ops'); }
function flotante(ev, html, cls){
  cerrarFlotante(); const p = document.createElement('div'); p.id = 'flotante'; p.className = 'flotante ' + cls; p.innerHTML = html; document.body.appendChild(p);
  const b = ev.currentTarget.getBoundingClientRect(); p.style.top = (b.bottom + 6) + 'px'; p.style.left = Math.max(8, Math.min(b.left - 20, innerWidth - p.offsetWidth - 8)) + 'px';
  setTimeout(() => document.addEventListener('click', fueraFlotante), 0);
}
function fueraFlotante(e){ if (!e.target.closest('#flotante')) cerrarFlotante(); }
function cerrarFlotante(){ const p = $('#flotante'); if (p) p.remove(); document.removeEventListener('click', fueraFlotante); }
function vincularNota(id){

        D().drones.filter(d => sinTildes(d.chasis).includes(s)).slice(0, 3).map(d => ({ v:'dron:' + d.id, t:d.chasis, s:modeloTxt(d.modelo), ico:'dron' })), D().pedidos.filter(p => sinTildes(p.num).includes(s)).slice(0, 3).map(p => ({ v:'pedido:' + p.id, t:p.num, s:'Pedido a Dragur', ico:'camion' }))); },

async function cfgCambio(k, v, delicado, el){
  if (delicado && !await confirmar('¿Confirmás el cambio?', `«${esc(OPC_IDX[k] || k)}» es un cambio delicado: afecta a todos los usuarios y queda registrado.`, 'Sí, cambiar')){ ir('config', true, true); return; }
  const recarga = CONFIG_GRUPOS.some(g => (g.ops || []).some(o => o.si === k)) || /lista/.test(k);
  cfgSet(k, v, !recarga);
}
function cfgListaQuitar(k, i){ const l = (cfgGet(k) || []).slice(); l.splice(i, 1); cfgSet(k, l); }
async function cfgListaAgregar(k){ const t = await pedirTexto('Agregar', '', OPC_IDX[k]); if (t){ cfgSet(k, (cfgGet(k) || []).concat(t)); } }
async function cfgRecomendado(g){
  if (!await confirmar('¿Volver a lo recomendado?', 'Las opciones de este tema vuelven a como venían de fábrica.', 'Volver a lo recomendado')) return;
  const G = CONFIG_GRUPOS.find(x => x.id === g);
  if (G.especial === 'aprobaciones') D().config.aprobaciones = JSON.parse(JSON.stringify(CONFIG_INICIAL.aprobaciones));
  else G.ops.forEach(o => { const p = o.k.split('.'); let x = D().config; p.slice(0, -1).forEach(k => x = x && x[k]); if (x) delete x[p[p.length - 1]]; });
  registrar('Volvió a lo recomendado: ' + G.t, '', 'config'); guardar(); _cache = {}; ir('config', true, true); avisar('Volvió a lo recomendado', 'volver');
}

/* ---------- Modelos de dron (se agregan desde la recepción o desde acá) ---------- */
function agregarModelo(alListo){
  abrirModal({ titulo:'Agregar un modelo de dron', sub:'Queda disponible en la recepción para todos',
    cuerpo:grilla([campo('Nombre del modelo', `<input id="mo-n" placeholder="Ej.: DJI Agras T25P">`, { req:true, cls:'ancho' }), campo('Marca', `<input id="mo-m" value="DJI">`),
      campo('Cantidad de motores', `<input id="mo-k" type="number" min="1" max="16" value="4">`, { ayuda:'Arma el checklist de motores de la recepción.' })]),
    pie:`<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-prim" id="mo-ok">${ico('check')} Agregar</button>`,
    alAbrir:() => { setTimeout(() => $('#mo-n').focus(), 60); $('#mo-ok').onclick = () => {
      const t = $('#mo-n').value.trim(); if (!t) return error('Escribí el nombre del modelo');
      const k = crearModelo(t, $('#mo-m').value, $('#mo-k').value); if (!k) return;
      cerrarModal(); if (alListo) alListo(k);
    }; } });
}
// Crea el modelo (lo usan la recepción, Configuración y el alta de artículos). Devuelve su clave o null si ya estaba.
function crearModelo(t, marca, motores){
  const k = sinTildes(t).replace(/^dji |^xag /, '').replace(/agras /, '').replace(/[^a-z0-9]/g, '').toUpperCase() || 'MODELO';
  if (MODELOS[k]){ error('Ese modelo ya está'); return null; }
  const m = { t, marca:String(marca || '').trim() || (/^xag/i.test(t) ? 'XAG' : 'DJI'), motores:Math.max(1, Math.min(16, Number(motores) || 4)), color:'#3F4651' };
  D().config.modelosExtra = Object.assign({}, D().config.modelosExtra, { [k]:m }); MODELOS[k] = m;
  registrar('Agregó el modelo de dron ' + t + ' (' + m.motores + ' motores)', t, 'config'); guardar();
  avisar(`Modelo <b>${esc(t)}</b> agregado`, 'dron', { tilde:true });
  return k;
}
async function quitarModelo(k){
  if (D().drones.some(d => d.modelo === k)){ error('Hay drones cargados con ese modelo: no se puede quitar'); return; }
  if (!await confirmar('¿Quitar el modelo?', esc(modeloTxt(k)) + ' deja de aparecer en la recepción.', 'Quitar', true)) return;
  delete D().config.modelosExtra[k]; delete MODELOS[k]; registrar('Quitó el modelo de dron ' + k, k, 'config'); guardar(); ir('config', true, true);
}

    alAbrir:() => $('#nu-ok').onclick = () => { const n = $('#nu-n').value.trim(), t = ($('[name=pl]:checked') || {}).value; if (!n) return error('Escribí el nombre');
      const u = { id:'u' + Date.now().toString(36), nombre:n, tipo:t, cargo:TIPOS_USUARIO[t].t, activo:true, alta:hoy(), email:$('#nu-m').value };
      D().usuarios.push(u); registrar('Creó el usuario ' + n + ' (' + TIPOS_USUARIO[t].t + ')', n, 'config'); guardar(); cerrarModal(); CFG.uabierto = u.id; ir('config', true, true); avisar(`Usuario <b>${esc(n)}</b> creado · le mandamos el mail para su contraseña`, 'usuario', { tilde:true }); } });
}
